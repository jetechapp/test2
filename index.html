<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LEO WORLD: HEROES FIXED</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        body { margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #050505; font-family: 'Fredoka', sans-serif; overflow: hidden; user-select: none; touch-action: none; }
        canvas { display: block; border-radius: 8px; box-shadow: 0 0 60px rgba(0,0,0,0.9); max-width: 100%; max-height: 100%; border: 2px solid #333; }
        
        #uiLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; }
        .gui-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .badge { background: rgba(30,30,30,0.95); color: white; padding: 12px 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15); backdrop-filter: blur(8px); font-weight: 800; font-size: 16px; display: flex; align-items: center; gap: 10px; margin-bottom: 8px; box-shadow: 0 8px 20px rgba(0,0,0,0.6); text-transform: uppercase; }
        .leaderboard-box { background: rgba(30,30,30,0.95); border-radius: 12px; padding: 15px; min-width: 220px; color: #fff; font-size: 12px; pointer-events: auto; border: 1px solid rgba(255,255,255,0.15); }

        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); backdrop-filter: blur(15px); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .card { background: #1e272e; padding: 35px; border-radius: 24px; width: 450px; text-align: center; border: 1px solid #485460; box-shadow: 0 30px 90px rgba(0,0,0,1); color: white; position: relative; overflow: hidden; }
        .card::before { content:''; position: absolute; top:0; left:0; width:100%; height:6px; background: linear-gradient(90deg, #ff4757, #ffa502, #2ed573, #1e90ff); }
        
        h1 { margin: 10px 0 5px 0; color: #fff; font-weight: 900; font-size: 40px; text-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        h2 { color: #ffa502; margin-top: 0; font-size: 14px; letter-spacing: 4px; font-weight: 600; margin-bottom: 20px; }
        input { width: 100%; padding: 16px; margin: 10px 0; background: #000; border: 2px solid #485460; color: white; border-radius: 12px; box-sizing: border-box; font-weight: bold; font-size: 14px; }
        input:focus { border-color: #ffa502; outline: none; }
        
        .btn { width: 100%; padding: 18px; border: none; border-radius: 12px; font-family: 'Fredoka', sans-serif; font-weight: 900; font-size: 16px; cursor: pointer; margin-top: 10px; color: #fff; transition: all 0.2s; text-transform: uppercase; }
        .btn:hover { transform: translateY(-3px); filter: brightness(1.1); }
        .btn-green { background: linear-gradient(to bottom, #2ecc71, #27ae60); box-shadow: 0 5px 0 #1e8449; }
        .btn-blue { background: linear-gradient(to bottom, #3498db, #2980b9); box-shadow: 0 5px 0 #1c5980; }
        .btn-orange { background: linear-gradient(to bottom, #ffa502, #ff7f50); box-shadow: 0 5px 0 #d35400; color: #000; }

        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 25px; max-height: 300px; overflow-y: auto; padding-right: 8px; }
        .shop-item { background: #2f3640; border-radius: 12px; padding: 15px; border: 2px solid #485460; cursor: pointer; position: relative; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; }
        .shop-item:hover { transform: scale(1.03); border-color: #fff; background: #353b48; }
        .shop-item.owned { border-color: #3498db; }
        .shop-item.equipped { border-color: #2ed573; background: linear-gradient(135deg, rgba(46, 213, 115, 0.1), rgba(46, 213, 115, 0.2)); box-shadow: 0 0 20px rgba(46, 213, 115, 0.2); }
        
        .preview-canvas { width: 80px; height: 80px; margin: 10px auto; display: block; filter: drop-shadow(0 8px 8px rgba(0,0,0,0.5)); }

        #jumpBtn { position: absolute; bottom: 40px; right: 40px; width: 110px; height: 110px; background: linear-gradient(135deg, rgba(255, 71, 87, 0.4), rgba(255, 107, 129, 0.6)); border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; display: flex; justify-content: center; align-items: center; pointer-events: auto; backdrop-filter: blur(10px); cursor: pointer; transition: transform 0.1s; box-shadow: 0 15px 40px rgba(0,0,0,0.4); }
        #jumpBtn:active { transform: scale(0.9); background: rgba(255, 71, 87, 0.8); }
    </style>
</head>
<body>

    <div id="uiLayer">
        <div class="gui-top">
            <div>
                <div class="badge" style="border-left: 5px solid #3498db;">👤 <span id="uiName">...</span></div>
                <div class="badge" style="border-left: 5px solid #ffa502; color:#ffa502;">⬢ <span id="uiCoins">0</span></div>
            </div>
            <div class="leaderboard-box">
                <div style="border-bottom:2px solid #ffffff20; margin-bottom:10px; padding-bottom:5px; font-weight:900; color:#ff4757;">TOP HEROES 🏆</div>
                <div id="leaderList" style="opacity:0.8;">Connecting...</div>
            </div>
        </div>
        <div class="badge" style="align-self: flex-end; font-size:32px; background: linear-gradient(45deg, #ff4757, #ff6b81); border:none;">
            <span style="font-size:14px; opacity:0.8; margin-right:8px;">SCORE</span> <span id="uiScore">0</span>
        </div>
    </div>

    <canvas id="gameCanvas" width="900" height="500"></canvas>
    
    <div id="jumpBtn" onmousedown="handleInput(event)" ontouchstart="handleInput(event)">
        <span style="font-size:50px;">🚀</span>
    </div>

    <div id="mainMenu" class="overlay">
        <div class="card">
            <h1>LEO WORLD</h1>
            <h2>ULTIMATE EDITION</h2>
            <input type="text" id="loginUser" placeholder="NOME UTENTE">
            <input type="password" id="loginPass" placeholder="PASSWORD">
            <button class="btn btn-green" onclick="doLogin()">ENTRA E GIOCA</button>
            <button class="btn btn-blue" onclick="playGuest()">GIOCA COME OSPITE</button>
            <div style="margin-top:20px; font-size:12px; opacity:0.6; cursor:pointer; text-decoration:underline;" onclick="doRegister()">Crea un nuovo account</div>
        </div>
    </div>

    <div id="shopMenu" class="overlay" style="display:none;">
        <div class="card" style="width: 500px;">
            <h1 style="color:#ffa502">SHOP</h1>
            <h2>POTENZIA IL TUO EROE</h2>
            <div class="badge" style="justify-content:center; margin:10px auto; background:#2f3640; width: fit-content; border:1px solid #485460;">SALDO: ⬢ <span id="shopBalance" style="color:#ffa502">0</span></div>
            <div style="display:flex; gap:15px; margin:25px 0; justify-content:center;">
                <button class="btn btn-blue" style="width:auto; padding:12px 40px; margin:0;" onclick="switchShop('skins')">EROI</button>
                <button class="btn btn-orange" style="width:auto; padding:12px 40px; margin:0;" onclick="switchShop('pets')">PETS</button>
            </div>
            <div class="shop-grid" id="shopGrid"></div>
            <button class="btn btn-green" style="margin-top:25px;" onclick="closeShop()">TORNA AL GIOCO</button>
        </div>
    </div>

    <div id="gameOverMenu" class="overlay" style="display:none;">
        <div class="card">
            <h1 style="color:#ff4757; font-size: 50px;">GAME OVER</h1>
            <p style="opacity:0.7; letter-spacing:2px; margin-bottom:25px;">MISSIONE FALLITA</p>
            <div style="background:#111; padding:20px; border-radius:16px; border:2px solid #333;">
                <div style="font-size:14px; color:#aaa; margin-bottom:5px;">PUNTEGGIO</div>
                <div style="font-size:42px; font-weight:900; color:#fff;" id="finalScore">0</div>
                <div style="margin-top:15px; padding-top:15px; border-top:1px solid #333; font-size:18px; color:#ffa502;">
                    <span>GUADAGNO:</span> <span style="font-weight:800; font-size:28px;">+</span><span id="finalCoins" style="font-weight:800; font-size:28px;">0</span> <span>⬢</span>
                </div>
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; margin-top:25px;">
                <button class="btn btn-green" style="margin:0;" onclick="resetGame()">RIPROVA</button>
                <button class="btn btn-orange" style="margin:0;" onclick="openShop()">SHOP</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jcylyutlybmbjrgghpzm.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpjeWx5dXRseWJtYmpyZ2docHptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA0NTc4NTYsImV4cCI6MjA4NjAzMzg1Nn0.X9xwESmsRJurzGODAb6V0x4QA_YODtKbATooYcC39Ew';
        let sb = null; try { if(typeof supabase !== 'undefined') sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e) { console.warn("Offline"); }

        const WORLDS = { 1: { name: "Sky Kingdom", skyTop: '#48dbfb', skyBot: '#c8d6e5', ground: '#1dd1a1', studs: '#10ac84' } };
        let currentWorldId = 1;

        // --- ASSETS CON CODICI COLORE A 6 CIFRE CORRETTI ---
        const SKINS = {
            'noob': { name: 'NOOB', price: 0, type: 'basic', colors: ['#ffeaa7', '#0984e3', '#55efc4'] },
            'iron': { name: 'IRON MAN', price: 2500, type: 'ironman', colors: ['#c0392b', '#c0392b', '#f1c40f'] },
            'spider': { name: 'SPIDER-MAN', price: 5000, type: 'spiderman', colors: ['#e74c3c', '#3498db', '#c0392b'] },
            'cap': { name: 'CAP AMERICA', price: 7500, type: 'cap', colors: ['#3498db', '#3498db', '#c0392b'] },
            'hulk': { name: 'HULK', price: 10000, type: 'hulk', colors: ['#2ecc71', '#2ecc71', '#8e44ad'] }
        };

        const PETS = {
            'none': { name: 'NESSUNO', price: 0, type: 'none', color: null },
            'cube': { name: 'TESSERACT', price: 1000, type: 'cube', color: '#3498db' },
            'doge': { name: 'DOGE', price: 3000, type: 'doge', color: '#f1c40f' },
            'ufo': { name: 'UFO', price: 6000, type: 'ufo', color: '#95a5a6' }
        };

        let user = { username: 'Guest', id: 'guest', coins: 0, highscore: 0, inventory: ['noob'], skin: 'noob', pets: ['none'], pet: 'none' };

        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const audio = AudioCtx ? new AudioCtx() : null;
        function playSound(n) {
            if(!audio || audio.state==='suspended') audio?.resume().catch(()=>{});
            const o=audio.createOscillator(), g=audio.createGain(), t=audio.currentTime;
            o.connect(g); g.connect(audio.destination);
            if(n==='jump'){o.frequency.setValueAtTime(300,t);o.frequency.linearRampToValueAtTime(600,t+0.1);g.gain.setValueAtTime(0.1,t);g.gain.linearRampToValueAtTime(0,t+0.15);o.start(t);o.stop(t+0.15)}
            else if(n==='coin'){o.type='triangle';o.frequency.setValueAtTime(1500,t);g.gain.setValueAtTime(0.05,t);g.gain.linearRampToValueAtTime(0,t+0.1);o.start(t);o.stop(t+0.1)}
            else if(n==='break'){o.type='sawtooth';o.frequency.setValueAtTime(120,t);g.gain.setValueAtTime(0.2,t);g.gain.linearRampToValueAtTime(0,t+0.2);o.start(t);o.stop(t+0.2)}
            else if(n==='spring'){o.type='sine';o.frequency.setValueAtTime(200,t);g.gain.setValueAtTime(0.2,t);g.gain.linearRampToValueAtTime(0,t+0.3);o.start(t);o.stop(t+0.3)}
            else{o.type='triangle';o.frequency.setValueAtTime(300,t);g.gain.setValueAtTime(0.3,t);g.gain.linearRampToValueAtTime(0,t+0.5);o.start(t);o.stop(t+0.5)}
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // --- FUNZIONE SHADE CORRETTA PER EVITARE BUG COLORE ---
        function shade(hex, percent) {
            if(!hex || hex.length < 7) return hex; // Ritorna il colore base se formato errato (evita il grigio)
            let f=parseInt(hex.slice(1),16), t=percent<0?0:255, p=percent<0?percent*-1:percent, R=f>>16, G=f>>8&0x00FF, B=f&0x0000FF;
            return "#"+(0x1000000+(Math.round((t-R)*p)+R)*0x10000+(Math.round((t-G)*p)+G)*0x100+(Math.round((t-B)*p)+B)).toString(16).slice(1);
        }

        function drawVoxel(targetCtx, x, y, w, h, color, studs=true) {
            targetCtx.fillStyle = color; targetCtx.fillRect(x, y, w, h);
            targetCtx.fillStyle = shade(color, 0.3); targetCtx.fillRect(x, y, w, 4);
            targetCtx.fillStyle = shade(color, -0.2); targetCtx.fillRect(x+w-5, y, 5, h); targetCtx.fillRect(x, y+h-5, w, 5);
            if(studs) {
                targetCtx.fillStyle = shade(color, 0.15);
                for(let i=6; i<w-6; i+=12) { targetCtx.beginPath(); targetCtx.arc(x+i+3, y+3, 3, 0, Math.PI*2); targetCtx.fill(); }
            }
        }

        // --- RENDERER DETTAGLIATO (Shop & Game) ---
        function drawAvatarDetailed(c, x, y, skinKey, isGrounded, animFrame) {
            const skinData = SKINS[skinKey] || SKINS['noob'];
            const type = skinData.type || 'basic';
            const cols = skinData.colors;
            let legAnim = 0;
            if(animFrame !== 0 && animFrame !== null) legAnim = !isGrounded ? -4 : Math.sin(animFrame*0.3)*4;

            c.save();
            
            if(type === 'ironman') {
                let r='#c0392b', g='#f1c40f';
                c.fillStyle=r; c.fillRect(x+4,y,22,18); c.fillStyle=g; c.fillRect(x+8,y+4,14,14);
                c.fillStyle="#ffffff"; c.fillRect(x+10,y+8,4,2); c.fillRect(x+16,y+8,4,2); // Eyes
                c.fillStyle=r; c.fillRect(x,y+18,30,18); 
                c.fillStyle="#3498db"; c.shadowColor="#3498db"; c.shadowBlur=10; c.beginPath(); c.arc(x+15,y+27,4,0,Math.PI*2); c.fill(); c.shadowBlur=0;
                c.fillStyle=r; c.fillRect(x+2,y+36,12,12+legAnim); c.fillRect(x+16,y+36,12,12-legAnim);
                c.fillStyle=g; c.fillRect(x+2,y+44+legAnim,12,4); c.fillRect(x+16,y+44-legAnim,12,4);
            } 
            else if (type === 'spiderman') {
                let r='#e74c3c', b='#3498db';
                c.fillStyle=r; c.fillRect(x+4,y,22,18);
                c.fillStyle="#ffffff"; c.beginPath(); c.moveTo(x+6,y+6); c.lineTo(x+15,y+10); c.lineTo(x+6,y+6); c.fill(); // Simple eyes
                c.fillRect(x+6,y+6,8,4); c.fillRect(x+16,y+6,8,4);
                c.fillStyle=b; c.fillRect(x,y+18,30,18); c.fillStyle=r; c.fillRect(x+10,y+18,10,18);
                c.fillStyle="#2c3e50"; c.fillRect(x+13,y+25,4,4); // Logo
                c.fillStyle=b; c.fillRect(x+2,y+36,12,12+legAnim); c.fillRect(x+16,y+36,12,12-legAnim);
                c.fillStyle=r; c.fillRect(x+2,y+42+legAnim,12,6); c.fillRect(x+16,y+42-legAnim,12,6);
            }
            else if (type === 'cap') {
                let b='#2980b9', w='#ecf0f1';
                c.fillStyle=b; c.fillRect(x+4,y,22,18); c.fillStyle=w; c.font="bold 12px Arial"; c.fillText("A",x+11,y+14);
                c.fillStyle=b; c.fillRect(x,y+18,30,18); c.fillStyle=w; c.beginPath(); c.arc(x+15,y+27,5,0,Math.PI*2); c.fill();
                c.fillStyle=b; c.fillRect(x+2,y+36,12,12+legAnim); c.fillRect(x+16,y+36,12,12-legAnim);
                c.fillStyle="#c0392b"; c.fillRect(x+2,y+44+legAnim,12,4); c.fillRect(x+16,y+44-legAnim,12,4);
            }
            else if (type === 'hulk') {
                c.fillStyle="#2ecc71"; c.fillRect(x+2,y-2,26,20); c.fillStyle="#000"; c.fillRect(x+2,y-2,26,6);
                c.fillStyle="#27ae60"; c.fillRect(x-2,y+18,34,20); // Big Body
                c.fillStyle="#8e44ad"; c.fillRect(x+2,y+38,12,10+legAnim); c.fillRect(x+16,y+38,12,10-legAnim);
            }
            else {
                drawVoxel(c, x+4, y, 22, 18, cols[0]);
                drawVoxel(c, x, y+18, 30, 18, cols[1]);
                drawVoxel(c, x+2, y+36, 12, 12+legAnim, cols[2]);
                drawVoxel(c, x+16, y+36, 12, 12-legAnim, cols[2]);
            }
            c.restore();
        }

        function drawPetDetailed(c, x, y, type) {
            c.save();
            if(type === 'cube') {
                c.fillStyle="#3498db"; c.shadowColor="#3498db"; c.shadowBlur=15; c.fillRect(x, y, 25, 25);
                c.fillStyle="#ffffff"; c.globalAlpha=0.6; c.fillRect(x+8, y+8, 9, 9);
            }
            else if(type === 'doge') {
                c.fillStyle="#f1c40f"; c.fillRect(x, y, 26, 22); 
                c.fillStyle="#000"; c.fillRect(x+6, y+8, 3, 3); c.fillRect(x+18, y+8, 3, 3);
                c.fillStyle="#fff"; c.fillRect(x+10, y+12, 6, 4);
            }
            else if(type === 'ufo') {
                c.fillStyle="#95a5a6"; c.beginPath(); c.ellipse(x+15, y+15, 18, 6, 0, 0, Math.PI*2); c.fill();
                c.fillStyle="#3498db"; c.beginPath(); c.arc(x+15, y+10, 8, 0, Math.PI*2); c.fill();
            }
            else {
                c.fillStyle="#555"; c.beginPath(); c.arc(x+12, y+12, 5, 0, Math.PI*2); c.fill();
            }
            c.restore();
        }

        class Debris {
            constructor(x, y, color) { this.x=x;this.y=y;this.color=color;this.vx=(Math.random()-0.5)*10;this.vy=(Math.random()-1)*10;this.life=1.0; }
            update() { this.vy+=0.8; this.x+=this.vx; this.y+=this.vy; this.life-=0.02; }
            draw(c) { c.globalAlpha=Math.max(0,this.life); c.fillStyle=this.color; c.fillRect(this.x,this.y,8,8); c.globalAlpha=1; }
        }
        class FloatingText {
            constructor(txt, x, y, col) { this.txt=txt;this.x=x;this.y=y;this.col=col;this.life=1.0; }
            update() { this.y-=2; this.life-=0.02; }
            draw(c) { c.globalAlpha=Math.max(0,this.life); c.fillStyle=this.col; c.font="900 20px Arial"; c.fillText(this.txt,this.x,this.y); c.globalAlpha=1; }
        }

        let gameState='MENU', frames=0, gameSpeed=6, score=0, sessionCoins=0, shake=0, spawnTimer=0, safeZoneTimer=0;
        let player={x:100,y:200,w:30,h:48,dy:0,grounded:false}, pet={x:50,y:200};
        let obstacles=[], coins=[], debrisList=[], textsList=[], clouds=[];

        function update() {
            if(gameState !== 'PLAY') return;
            frames++; score+=0.05; gameSpeed+=0.0005;
            player.dy+=0.65; player.y+=player.dy;
            let groundY = canvas.height - 60;
            if(player.y+player.h > groundY) { player.y=groundY-player.h; player.dy=0; player.grounded=true; } else { player.grounded=false; }

            if(spawnTimer>0) spawnTimer--; if(safeZoneTimer>0) safeZoneTimer--;
            if(spawnTimer<=0) spawnObstaclePattern();

            clouds.forEach(c=>c.x-=gameSpeed*0.4); obstacles.forEach(o=>o.x-=gameSpeed); coins.forEach(c=>c.x-=gameSpeed);
            debrisList.forEach(d=>d.update()); textsList.forEach(t=>t.update());

            for(let i=obstacles.length-1; i>=0; i--) {
                let o = obstacles[i], oy = groundY - o.h;
                if(player.x < o.x+o.w && player.x+player.w > o.x && player.y < oy+o.h && player.y+player.h > oy) {
                    if(o.type === 'crate') {
                        if(player.dy>0 && player.y+player.h < oy+25) { // Top hit
                            o.dead=true; player.dy=-12; score+=100; playSound('break');
                            textsList.push(new FloatingText("+100", o.x, oy, '#fff'));
                            for(let k=0;k<5;k++) debrisList.push(new Debris(o.x+20, oy+20, o.color));
                        } else if(player.dy<0 && player.y > oy+o.h-25) { // Bottom hit
                            o.dead=true; player.dy=5; score+=150; playSound('break');
                            for(let k=0;k<5;k++) debrisList.push(new Debris(o.x+20, oy+20, o.color));
                        } else gameOver();
                    } else if(o.type === 'spring') {
                        player.dy = -28; shake=10; playSound('spring');
                        textsList.push(new FloatingText("BOING!", player.x, player.y, '#a55eea'));
                    } else gameOver();
                }
            }
            
            for(let i=coins.length-1; i>=0; i--) {
                let c = coins[i];
                if(Math.hypot((player.x+15)-c.x, (player.y+24)-c.y) < 40) {
                    c.dead=true;
                    if(c.type==='elephant') { sessionCoins+=5; score+=500; playSound('coin_ele'); textsList.push(new FloatingText("EPIC!", c.x, c.y, '#00d2d3')); }
                    else { sessionCoins+=1; score+=50; playSound('coin'); }
                }
            }

            clouds=clouds.filter(c=>c.x>-100); obstacles=obstacles.filter(o=>!o.dead && o.x>-100); coins=coins.filter(c=>!c.dead && c.x>-50);
            debrisList=debrisList.filter(d=>d.life>0); textsList=textsList.filter(t=>t.life>0);
            if(shake>0) shake*=0.9;
        }

        function spawnObstaclePattern() {
            let r=Math.random(), ox=canvas.width;
            if(safeZoneTimer>0) { if(Math.random()<0.5) coins.push({x:ox, y:canvas.height-90, type:'normal'}); spawnTimer=40; return; }
            
            if(r<0.25) { // Spring
                obstacles.push({x:ox, y:0, w:50, h:15, type:'spring', color:'#a55eea'});
                for(let i=0; i<3; i++) {
                    clouds.push({x:ox+400+(i*60), y:70, w:70});
                    coins.push({x:ox+400+(i*60), y:50, type:'elephant'});
                }
                safeZoneTimer=160; spawnTimer=60;
            } else if(r<0.55) { // Crate
                obstacles.push({x:ox, y:0, w:45, h:45, type:'crate', color:'#e58e26'}); spawnTimer=50;
            } else if(r<0.75) { // Kill
                obstacles.push({x:ox, y:0, w:40, h:40, type:'kill', color:'#ff4757'}); spawnTimer=60;
            } else { // Wall
                obstacles.push({x:ox, y:0, w:40, h:80, type:'truss', color:'#2f3542'}); spawnTimer=70;
            }
        }

        function draw() {
            let grd=ctx.createLinearGradient(0,0,0,canvas.height); grd.addColorStop(0,'#48dbfb'); grd.addColorStop(1,'#c8d6e5');
            ctx.fillStyle=grd; ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.save(); if(shake>0.5) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);

            ctx.fillStyle="rgba(255,255,255,0.7)"; clouds.forEach(c=>{ ctx.beginPath(); ctx.arc(c.x,c.y,c.w/2,0,Math.PI*2); ctx.fill(); });

            let gH=60, gY=canvas.height-gH;
            ctx.fillStyle='#1dd1a1'; ctx.fillRect(0,gY,canvas.width,gH);
            ctx.fillStyle='#10ac84'; let off=(frames*gameSpeed)%40; for(let i=-40; i<canvas.width; i+=40) ctx.fillRect(i-off, gY, 36, 6);

            obstacles.forEach(o=>{
                let oy=gY-o.h;
                if(o.type==='truss') { ctx.fillStyle=o.color; ctx.fillRect(o.x,oy,10,o.h); ctx.fillRect(o.x+30,oy,10,o.h); }
                else if(o.type==='spring') { drawVoxel(ctx,o.x,oy,o.w,o.h,o.color); ctx.fillStyle='#fff'; ctx.fillRect(o.x+5,oy+2,o.w-10,4); }
                else { 
                    drawVoxel(ctx,o.x,oy,o.w,o.h,o.color);
                    if(o.type==='crate') { ctx.strokeStyle="rgba(255,255,255,0.3)"; ctx.lineWidth=2; ctx.strokeRect(o.x+5,oy+5,o.w-10,o.h-10); }
                }
            });

            coins.forEach(c=>{
                let cy=c.y+Math.sin(frames*0.15)*6;
                if(c.type==='elephant') {
                    ctx.fillStyle="#54a0ff"; ctx.beginPath(); ctx.arc(c.x, cy, 14, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle="#fff"; ctx.font="bold 14px Arial"; ctx.fillText("E", c.x-5, cy+5);
                } else {
                    ctx.fillStyle="#feca57"; ctx.beginPath(); ctx.arc(c.x, cy, 10, 0, Math.PI*2); ctx.fill();
                }
            });

            debrisList.forEach(d=>d.draw(ctx));

            if(user.pet!=='none' && PETS[user.pet]) {
                let px=player.x-40, py=player.y-20+Math.sin(frames*0.08)*10;
                pet.x+=(px-pet.x)*0.1; pet.y+=(py-pet.y)*0.1;
                drawPetDetailed(ctx, pet.x, pet.y, PETS[user.pet].type);
            }

            if(gameState==='PLAY') drawAvatarDetailed(ctx, player.x, player.y, user.skin, player.grounded, frames);
            textsList.forEach(t=>t.draw(ctx));

            ctx.restore();
            document.getElementById('uiScore').innerText = Math.floor(score); document.getElementById('uiCoins').innerText = user.coins + sessionCoins;
            if(gameState==='PLAY') requestAnimationFrame(function(){ update(); draw(); });
        }

        function gameOver() { gameState='GAMEOVER'; playSound('die'); shake=20; draw(); document.getElementById('gameOverMenu').style.display='flex'; document.getElementById('finalScore').innerText=Math.floor(score); document.getElementById('finalCoins').innerText=sessionCoins; document.getElementById('jumpBtn').style.display='none'; saveData(); }
        function resetGame() { obstacles=[]; coins=[]; debrisList=[]; textsList=[]; clouds=[]; score=0; sessionCoins=0; gameSpeed=6; frames=0; spawnTimer=0; safeZoneTimer=0; player.y=200; player.dy=0; document.getElementById('gameOverMenu').style.display='none'; document.getElementById('mainMenu').style.display='none'; document.getElementById('shopMenu').style.display='none'; document.getElementById('jumpBtn').style.display='flex'; gameState='PLAY'; update(); draw(); }

        // --- SHOP RENDERER (FIXED) ---
        let currentShopTab = 'skins';
        function openShop() { document.getElementById('gameOverMenu').style.display='none'; document.getElementById('shopMenu').style.display='flex'; switchShop('skins'); }
        function closeShop() { document.getElementById('shopMenu').style.display='none'; document.getElementById('gameOverMenu').style.display='flex'; }
        function switchShop(t) { currentShopTab=t; renderShop(); }

        function renderShop() {
            const grid = document.getElementById('shopGrid'); grid.innerHTML = ''; document.getElementById('shopBalance').innerText = user.coins;
            const isSkin = currentShopTab === 'skins'; const DB = isSkin ? SKINS : PETS;
            const owned = isSkin ? user.inventory : user.pets; const equipped = isSkin ? user.skin : user.pet;

            for(let k in DB) {
                let item = DB[k]; let isOwned = owned.includes(k); let isEquipped = equipped === k;
                let div = document.createElement('div'); div.className = `shop-item ${isOwned?'owned':''} ${isEquipped?'equipped':''}`;
                
                let cvs = document.createElement('canvas'); cvs.width=70; cvs.height=70; cvs.className='preview-canvas';
                let cx = cvs.getContext('2d');
                // Disegna al centro della card
                if(isSkin) drawAvatarDetailed(cx, 20, 10, k, true, 0); 
                else drawPetDetailed(cx, 25, 25, item.type);

                let btnTxt = isEquipped ? "EQUIPPED" : (isOwned ? "SELECT" : item.price); let btnCls = isEquipped ? "btn-green" : (isOwned ? "btn-blue" : "btn-orange");
                div.innerHTML = `<div style="font-weight:bold; font-size:12px; color:#fff; margin-bottom:5px;">${item.name}</div>`; div.appendChild(cvs);
                div.innerHTML += `<button class="btn ${btnCls}" style="padding:8px; font-size:10px; margin-top:5px; width:100%;" onclick="buyItem('${k}')">${btnTxt}</button>`;
                grid.appendChild(div);
            }
        }

        async function doLogin(){const u=document.getElementById('loginUser').value,p=document.getElementById('loginPass').value;if(!sb||!u)return playGuest();try{let{data}=await sb.from('leo_players').select('*').eq('username',u).eq('password',p).single();if(!data)throw new Error();user.id=data.id;user.username=data.username;user.coins=data.coins||0;user.highscore=data.best_score||0;let s=data.current_skin||'noob';user.skin=SKINS[s]?s:'noob';let pt=data.current_pet||'none';user.pet=PETS[pt]?pt:'none';user.inventory=(data.inventory||'noob').split(',');user.pets=(data.pets||'none').split(',');startGameSession()}catch(e){playGuest()}}
        async function doRegister(){const u=document.getElementById('loginUser').value,p=document.getElementById('loginPass').value;if(!sb||!u)return;await sb.from('leo_players').insert([{username:u,password:p,coins:0,best_score:0,inventory:'noob',current_skin:'noob',pets:'none',current_pet:'none'}]);alert("Registrato!");}
        function playGuest(){user.username="Guest_"+Math.floor(Math.random()*99);startGameSession()}
        function startGameSession(){document.getElementById('uiName').innerText=user.username;document.getElementById('uiCoins').innerText=user.coins;document.getElementById('mainMenu').style.display='none';loadLeaderboard();resetGame()}
        async function buyItem(k){playSound('coin');const isSkin=currentShopTab==='skins',DB=isSkin?SKINS:PETS,item=DB[k];let inv=isSkin?user.inventory:user.pets;if(inv.includes(k)){if(isSkin)user.skin=k;else user.pet=k}else{if(user.coins>=item.price){user.coins-=item.price;if(isSkin)user.inventory.push(k);else user.pets.push(k);if(isSkin)user.skin=k;else user.pet=k}else{alert("No money!");return}}renderShop();if(user.id!=='guest'&&sb){let p={coins:user.coins};if(isSkin){p.inventory=user.inventory.join(',');p.current_skin=user.skin}else{p.pets=user.pets.join(',');p.current_pet=user.pet}await sb.from('leo_players').update(p).eq('id',user.id)}}
        async function saveData(){if(user.id==='guest')return;user.coins+=sessionCoins;if(score>user.highscore)user.highscore=Math.floor(score);if(sb)await sb.from('leo_players').update({coins:user.coins,best_score:user.highscore}).eq('id',user.id);loadLeaderboard()}
        async function loadLeaderboard(){const l=document.getElementById('leaderList');if(!sb){l.innerHTML="Offline";return}const{data}=await sb.from('leo_players').select('username,best_score').order('best_score',{ascending:false}).limit(5);if(data)l.innerHTML=data.map((p,i)=>`<div style="display:flex;justify-content:space-between;margin-bottom:5px"><span>${i+1}.${p.username}</span><span style="color:#e74c3c">${p.best_score}</span></div>`).join('')}
        
        function handleInput(e){if(gameState!=='PLAY')return;if(e.type==='keydown'&&e.code!=='Space'&&e.code!=='ArrowUp')return;e.preventDefault();if(player.grounded){player.dy=-14;player.grounded=false;playSound('jump')}}
        window.addEventListener('keydown',handleInput);
        window.onload=()=>{
            let grd=ctx.createLinearGradient(0,0,0,canvas.height);grd.addColorStop(0,'#48dbfb');grd.addColorStop(1,'#c8d6e5');ctx.fillStyle=grd;ctx.fillRect(0,0,canvas.width,canvas.height);loadLeaderboard();
        }
    </script>
</body>
