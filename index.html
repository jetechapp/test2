<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LEO WORLD: ROBLOX EDITION</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* FONT ROBLOX STYLE (Verdana/Gotham like) */
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap');

        body {
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #74b9ff, #dfe6e9); /* Skybox */
            font-family: 'Fredoka', 'Verdana', sans-serif;
            overflow: hidden;
            user-select: none; -webkit-user-select: none; touch-action: none;
        }

        /* CANVAS STILE ROBLOX */
        canvas {
            border: 6px solid rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            background: transparent; /* Il background è gestito dal body o dal draw */
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 100%; max-height: 100%;
        }

        /* GUI INTERFACE */
        #ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 20px; box-sizing: border-box;
        }

        .top-bar {
            display: flex; justify-content: space-between; align-items: flex-start;
        }

        .player-list {
            background: rgba(30, 30, 30, 0.6);
            backdrop-filter: blur(5px);
            border-radius: 10px;
            padding: 10px;
            color: white;
            min-width: 180px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .player-list h4 { margin: 0 0 10px 0; font-size: 14px; color: #dfe6e9; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 5px; }
        .list-item { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px; align-items: center; }
        .avatar-head { width: 16px; height: 16px; border-radius: 50%; background: #ffd700; border: 2px solid #fff; margin-right: 8px; }

        .stats-container {
            display: flex; gap: 10px;
        }

        .gui-badge {
            background: rgba(255, 255, 255, 0.9);
            color: #2d3436;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
            display: flex; align-items: center; gap: 8px;
        }

        /* NOTIFICHE */
        #notificationArea {
            position: absolute; top: 100px; left: 50%; transform: translateX(-50%);
            text-align: center; width: 100%; pointer-events: none;
        }
        .notify-msg {
            font-size: 24px; color: #fff; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
            font-weight: 800;
            animation: popUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-bottom: 5px;
        }
        @keyframes popUp { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* OVERLAYS (Login/Shop) */
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center; z-index: 100;
        }
        
        .roblox-card {
            background: #fff;
            padding: 30px;
            border-radius: 24px;
            text-align: center;
            width: 320px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            border: 4px solid #fff;
        }
        
        input {
            width: 100%; padding: 12px; margin: 8px 0; border: 2px solid #dfe6e9; border-radius: 8px;
            font-family: 'Fredoka', sans-serif; font-size: 14px; outline: none; box-sizing: border-box;
            transition: 0.3s;
        }
        input:focus { border-color: #0984e3; }

        .btn {
            width: 100%; padding: 14px; border: none; border-radius: 12px;
            font-family: 'Fredoka', sans-serif; font-weight: bold; font-size: 16px;
            cursor: pointer; margin-top: 10px; transition: transform 0.1s;
            color: white; box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }
        .btn:active { transform: translateY(4px); box-shadow: none; }
        .btn-green { background: #00b894; } /* Play Green */
        .btn-blue { background: #0984e3; }
        .btn-shop { background: #fdcb6e; color: #d35400; }

        /* SHOP GRID */
        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; max-height: 250px; overflow-y: auto; }
        .shop-item { background: #f1f2f6; border-radius: 10px; padding: 10px; border: 2px solid transparent; cursor: pointer; }
        .shop-item.selected { border-color: #00b894; background: #e6fffa; }
        .shop-preview { width: 40px; height: 40px; margin: 0 auto 5px; border-radius: 6px; }

        /* JUMP BUTTON MOBILE */
        #jumpButton {
            display: none; position: absolute; bottom: 40px; right: 40px;
            width: 90px; height: 90px; background: rgba(255,255,255,0.3);
            border-radius: 50%; border: 4px solid rgba(255,255,255,0.6);
            backdrop-filter: blur(4px); pointer-events: auto;
            align-items: center; justify-content: center;
        }
        #jumpButton svg { fill: white; width: 40px; height: 40px; }
        #jumpButton:active { background: rgba(255,255,255,0.5); transform: scale(0.95); }

    </style>
</head>
<body>

    <div id="ui">
        <div class="top-bar">
            <div class="stats-container">
                <div class="gui-badge">
                    <span style="font-size:18px;">😐</span> <span id="nameDisplay">GUEST</span>
                </div>
                <div class="gui-badge" style="color:#00b894;">
                    ⬢ <span id="coinDisplay">0</span>
                </div>
            </div>
            
            <div class="player-list">
                <h4>PLAYERS</h4>
                <div id="leaderboardList">
                    <div class="list-item"><div class="avatar-head"></div> Loading...</div>
                </div>
            </div>
        </div>
        
        <div id="notificationArea"></div>

        <div class="stats-container" style="align-self: flex-end;">
            <div class="gui-badge">🏆 SCORE: <span id="scoreDisplay">0</span></div>
        </div>
    </div>

    <canvas id="gameCanvas" width="900" height="500"></canvas>
    
    <div id="jumpButton" onmousedown="handleInput(event)" ontouchstart="handleInput(event)">
        <svg viewBox="0 0 24 24"><path d="M12 4l-8 8h6v8h4v-8h6z"/></svg>
    </div>

    <div id="overlay">
        <div class="roblox-card" id="loginCard">
            <h1 style="color:#2d3436; margin:0 0 5px 0;">LEO WORLD</h1>
            <p style="color:#b2bec3; margin:0 0 20px 0; font-size:12px;">ROBLOX EDITION</p>
            
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            
            <button class="btn btn-green" onclick="login()">GIOCA (PLAY)</button>
            <button class="btn btn-blue" style="margin-top:5px; font-size:12px; padding:10px;" onclick="playGuest()">ENTRA COME OSPITE</button>
            <div style="margin-top:10px; font-size:10px; color:#636e72;">
                <span onclick="register()" style="cursor:pointer; text-decoration:underline;">Non hai un account? Registrati</span>
            </div>
        </div>

        <div class="roblox-card" id="shopCard" style="display:none; width: 400px;">
            <h2 style="margin-top:0;">AVATAR SHOP</h2>
            <div class="gui-badge" style="justify-content:center; margin-bottom:10px;">Saldo: ⬢ <span id="shopBalance">0</span></div>
            
            <div style="display:flex; justify-content:center; gap:10px; margin-bottom:10px;">
                <button onclick="shopTab='skins'; renderShop()" class="btn btn-blue" style="padding:8px; font-size:12px; width:auto;">SKINS</button>
                <button onclick="shopTab='pets'; renderShop()" class="btn btn-blue" style="padding:8px; font-size:12px; width:auto;">PETS</button>
            </div>

            <div class="shop-grid" id="shopGrid"></div>
            
            <button class="btn btn-green" onclick="closeShop()">TORNA AL GIOCO</button>
        </div>

        <div class="roblox-card" id="gameOverCard" style="display:none;">
            <h1 style="color:#d63031;">OOOF!</h1>
            <p>Sei stato eliminato.</p>
            <h2 id="finalScore" style="color:#2d3436; font-size:30px;">0</h2>
            <p>Guadagnati: <span id="finalCoins" style="color:#00b894; font-weight:bold;">+0</span> ⬢</p>
            <button class="btn btn-green" onclick="resetGame()">RESPAWN</button>
            <button class="btn btn-shop" onclick="openShop()">SHOP</button>
        </div>
    </div>

    <script>
        // --- CONFIG & SUPABASE ---
        const SUPABASE_URL = 'https://jcylyutlybmbjrgghpzm.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpjeWx5dXRseWJtYmpyZ2docHptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA0NTc4NTYsImV4cCI6MjA4NjAzMzg1Nn0.X9xwESmsRJurzGODAb6V0x4QA_YODtKbATooYcC39Ew';
        
        let sb = null;
        if(typeof supabase !== 'undefined') sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- ASSETS & DATA ---
        const SKINS = {
            'noob': { name: 'Classic Noob', price: 0, colors: ['#ffeaa7', '#0984e3', '#55efc4'] }, // Head, Body, Legs
            'guest': { name: 'Guest 666', price: 500, colors: ['#dfe6e9', '#2d3436', '#2d3436'] },
            'bacon': { name: 'Bacon Hair', price: 1000, colors: ['#fab1a0', '#74b9ff', '#636e72'] },
            'gold': { name: 'Golden Blox', price: 5000, colors: ['#fdcb6e', '#ffeaa7', '#e17055'] },
            'void': { name: 'Void Walker', price: 10000, colors: ['#000000', '#2d3436', '#636e72'] }
        };

        const PETS = {
            'none': { name: 'Nessuno', price: 0, color: null },
            'cube': { name: 'Floating Cube', price: 1500, color: '#ff7675' },
            'doge': { name: 'Doge Block', price: 3000, color: '#fdcb6e' },
            'ghost': { name: 'Ghost', price: 6000, color: '#dfe6e9' }
        };

        let user = { 
            username: 'Guest', coins: 0, highscore: 0, 
            inventory: ['noob'], skin: 'noob', 
            pets: ['none'], pet: 'none',
            id: 'guest' 
        };

        let shopTab = 'skins';
        let gameActive = false;
        
        // --- AUDIO ENGINE (Synthesized) ---
        const Audio = new (window.AudioContext || window.webkitAudioContext)();
        function sfx(type) {
            if(Audio.state === 'suspended') Audio.resume();
            const o = Audio.createOscillator();
            const g = Audio.createGain();
            o.connect(g); g.connect(Audio.destination);
            const t = Audio.currentTime;
            
            if(type === 'jump') { // "Hup" sound
                o.type = 'sine'; o.frequency.setValueAtTime(300, t); o.frequency.linearRampToValueAtTime(500, t+0.1);
                g.gain.setValueAtTime(0.1, t); g.gain.linearRampToValueAtTime(0, t+0.1);
                o.start(t); o.stop(t+0.1);
            }
            if(type === 'coin') { // "Ching"
                o.type = 'triangle'; o.frequency.setValueAtTime(1200, t); o.frequency.setValueAtTime(1600, t+0.1);
                g.gain.setValueAtTime(0.05, t); g.gain.linearRampToValueAtTime(0, t+0.2);
                o.start(t); o.stop(t+0.2);
            }
            if(type === 'die') { // "OOF" approx
                o.type = 'sawtooth'; o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(50, t+0.3);
                g.gain.setValueAtTime(0.2, t); g.gain.linearRampToValueAtTime(0, t+0.3);
                o.start(t); o.stop(t+0.3);
            }
            if(type === 'click') {
                o.type = 'square'; o.frequency.setValueAtTime(800, t);
                g.gain.setValueAtTime(0.05, t); g.gain.linearRampToValueAtTime(0, t+0.05);
                o.start(t); o.stop(t+0.05);
            }
        }

        // --- GAME LOGIC ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let frames = 0;
        let speed = 6;
        let score = 0;
        let sessionCoins = 0;
        let gravity = 0.6;

        // Entities
        let player = { x: 80, y: 200, w: 30, h: 46, dy: 0, grounded: false, color: SKINS['noob'].colors };
        let pet = { x: 40, y: 200, targetX: 0, targetY: 0 };
        let obstacles = [];
        let particles = [];
        let coins = [];
        let clouds = [];

        // Camera Shake
        let shake = 0;

        // --- RENDER FUNCTIONS (THE ROBLOX LOOK) ---
        
        // Helper per scurire i colori (Shading)
        function shade(hex, percent) {
            let f=parseInt(hex.slice(1),16),t=percent<0?0:255,p=percent<0?percent*-1:percent,R=f>>16,G=f>>8&0x00FF,B=f&0x0000FF;
            return "#"+(0x1000000+(Math.round((t-R)*p)+R)*0x10000+(Math.round((t-G)*p)+G)*0x100+(Math.round((t-B)*p)+B)).toString(16).slice(1);
        }

        function drawPlasticBlock(x, y, w, h, color) {
            // Main Body
            ctx.fillStyle = color;
            ctx.fillRect(x, y, w, h);
            
            // Top Highlight (Lucido)
            ctx.fillStyle = shade(color, 0.2);
            ctx.fillRect(x, y, w, 4);
            
            // Side Shadow
            ctx.fillStyle = shade(color, -0.2);
            ctx.fillRect(x + w - 4, y, 4, h);
            ctx.fillRect(x, y + h - 4, w, 4);
            
            // Studs (I pallini sopra i blocchi stile Lego)
            ctx.fillStyle = shade(color, 0.1);
            for(let i=4; i<w-4; i+=10) {
                ctx.beginPath();
                ctx.arc(x+i+3, y+2, 2, 0, Math.PI*2);
                ctx.fill();
            }
        }

        function drawAvatar(x, y, colors) {
            // Head
            drawPlasticBlock(x+5, y, 20, 16, colors[0]);
            // Torso
            drawPlasticBlock(x, y+16, 30, 16, colors[1]);
            // Legs (Split)
            let legH = 14;
            let legAnim = Math.sin(frames*0.2) * 4;
            if(!player.grounded) legAnim = -5; // Jump pose
            
            drawPlasticBlock(x+2, y+32, 12, legH + legAnim, colors[2]); // Left
            drawPlasticBlock(x+16, y+32, 12, legH - legAnim, colors[2]); // Right
        }

        function drawPet() {
            if(user.pet === 'none' || !PETS[user.pet]) return;
            const pColor = PETS[user.pet].color;
            
            // Smooth follow (Lerp)
            pet.targetX = player.x - 40;
            pet.targetY = player.y - 20 + Math.sin(frames*0.05)*10;
            pet.x += (pet.targetX - pet.x) * 0.1;
            pet.y += (pet.targetY - pet.y) * 0.1;

            ctx.shadowBlur = 10; ctx.shadowColor = pColor;
            drawPlasticBlock(pet.x, pet.y, 16, 16, pColor);
            ctx.shadowBlur = 0;
        }

        function spawnCloud() {
            if(Math.random() < 0.01) {
                clouds.push({ x: canvas.width, y: Math.random()*150, s: Math.random()*0.5+0.5 });
            }
        }

        function update() {
            if(!gameActive) return;
            frames++;
            score += 0.05;
            speed += 0.001;

            // Player Physics
            player.dy += gravity;
            player.y += player.dy;
            
            let groundY = canvas.height - 50;
            if(player.y + player.h > groundY) {
                player.y = groundY - player.h;
                player.dy = 0;
                player.grounded = true;
            } else player.grounded = false;

            // Cloud logic
            spawnCloud();
            clouds.forEach(c => c.x -= speed * 0.5);
            clouds = clouds.filter(c => c.x > -100);

            // Obstacle Logic
            if(frames % Math.floor(100 - speed*2) === 0) {
                let type = Math.random();
                if(type < 0.6) obstacles.push({x: canvas.width, w: 40, h: 40, type: 'block', col: '#636e72'}); // Stone
                else if(type < 0.8) obstacles.push({x: canvas.width, w: 40, h: 40, type: 'killbrick', col: '#ff0000'}); // Killbrick
                else obstacles.push({x: canvas.width, w: 40, h: 60, type: 'truss', col: '#2d3436'}); // Truss (Tall)
            }
            
            // Coins logic
            if(frames % 60 === 0) {
                coins.push({x: canvas.width, y: canvas.height - 100 - Math.random()*80 });
            }

            obstacles.forEach(o => o.x -= speed);
            coins.forEach(c => c.x -= speed);

            // Collision Detection
            obstacles.forEach(o => {
                if (player.x < o.x + o.w && player.x + player.w > o.x &&
                    player.y < 2000 && player.y + player.h > canvas.height - 50 - o.h + (o.h-40)) { // Simplified Y collision
                     // Just simple box collision for now
                     if(player.y + player.h > canvas.height - 50 - 5) {
                         if(o.type === 'killbrick') die();
                         else die(); // Hit obstacle
                     }
                }
            });
            
            // Clean up
            obstacles = obstacles.filter(o => o.x > -100);

            // Coin Collision
            coins = coins.filter(c => {
                let hit = Math.hypot(player.x - c.x, player.y - c.y) < 40;
                if(hit) {
                    sessionCoins++;
                    score += 100;
                    sfx('coin');
                    showNotify("+1 ⬢");
                }
                return !hit && c.x > -50;
            });

            // Update UI
            document.getElementById('scoreDisplay').innerText = Math.floor(score);
            document.getElementById('coinDisplay').innerText = user.coins + sessionCoins;
            
            // Shake dampening
            if(shake > 0) shake *= 0.9;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Shake effect
            ctx.save();
            if(shake > 0.5) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);

            // Clouds
            ctx.fillStyle = "rgba(255,255,255,0.6)";
            clouds.forEach(c => {
                ctx.beginPath(); ctx.arc(c.x, c.y, 30*c.s, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(c.x+20*c.s, c.y-10*c.s, 40*c.s, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(c.x+40*c.s, c.y, 30*c.s, 0, Math.PI*2); ctx.fill();
            });

            // Ground (Baseplate Green)
            ctx.fillStyle = "#5b9e52"; // Classic Roblox Green
            ctx.fillRect(0, canvas.height-50, canvas.width, 50);
            // Studs on ground
            ctx.fillStyle = "#6ab060";
            for(let i=0; i<canvas.width; i+=20) {
                ctx.fillRect((i - (frames*speed)%20), canvas.height-50, 10, 4);
            }

            // Obstacles
            obstacles.forEach(o => {
                let y = canvas.height - 50 - o.h;
                if(o.type === 'killbrick') {
                    ctx.shadowBlur = 10; ctx.shadowColor = 'red';
                    drawPlasticBlock(o.x, y, o.w, o.h, '#ff3838');
                    ctx.shadowBlur = 0;
                } else if(o.type === 'truss') {
                     // Draw Truss lines
                     ctx.fillStyle = "#2d3436"; ctx.fillRect(o.x, y, 10, o.h); ctx.fillRect(o.x+30, y, 10, o.h);
                     for(let k=0; k<o.h; k+=10) ctx.fillRect(o.x, y+k, 40, 5);
                } else {
                    drawPlasticBlock(o.x, y, o.w, o.h, o.col);
                }
            });

            // Coins (Hexagons)
            coins.forEach(c => {
                let y = c.y + Math.sin(frames*0.1)*5;
                ctx.fillStyle = "#55efc4"; // Robux Green
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    ctx.lineTo(c.x + 12 * Math.cos(i * 2 * Math.PI / 6), y + 12 * Math.sin(i * 2 * Math.PI / 6));
                }
                ctx.fill();
                ctx.strokeStyle = "#00b894"; ctx.lineWidth=2; ctx.stroke();
            });

            // Player & Pet
            drawPet();
            if(gameActive) drawAvatar(player.x, player.y, player.color);

            ctx.restore();
            if(gameActive) requestAnimationFrame(() => { update(); draw(); });
        }

        // --- CONTROLS ---
        function jump() {
            if(player.grounded) {
                player.dy = -12;
                player.grounded = false;
                sfx('jump');
            }
        }
        function handleInput(e) { 
            if(!gameActive) return; 
            e.preventDefault(); 
            jump(); 
        }
        window.addEventListener('keydown', e => { if(e.code==='Space' || e.code==='ArrowUp') handleInput(e); });

        // --- CORE FUNCTIONS ---
        function die() {
            gameActive = false;
            sfx('die');
            shake = 20;
            draw(); // Draw last frame with shake
            
            document.getElementById('gameOverCard').style.display = 'block';
            document.getElementById('overlay').style.display = 'flex';
            document.getElementById('loginCard').style.display = 'none';
            document.getElementById('shopCard').style.display = 'none';
            document.getElementById('jumpButton').style.display = 'none';

            document.getElementById('finalScore').innerText = Math.floor(score);
            document.getElementById('finalCoins').innerText = "+" + sessionCoins;
            
            saveData();
        }

        function resetGame() {
            obstacles = []; coins = []; clouds = [];
            score = 0; sessionCoins = 0; speed = 6;
            player.y = 200; player.dy = 0;
            gameActive = true;
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('jumpButton').style.display = 'flex';
            update(); draw();
        }

        function showNotify(msg) {
            const el = document.createElement('div');
            el.className = 'notify-msg';
            el.innerText = msg;
            document.getElementById('notificationArea').appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        // --- DATA & SHOP ---
        async function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if(!sb || !u) return playGuest(); // Fallback

            let { data, error } = await sb.from('leo_players').select('*').eq('username', u).eq('password', p).single();
            
            if(data) {
                user = {
                    ...data,
                    inventory: data.inventory ? data.inventory.split(',') : ['noob'],
                    pets: data.pets ? data.pets.split(',') : ['none'],
                    skin: data.current_skin || 'noob',
                    pet: data.current_pet || 'none',
                    coins: data.coins || 0
                };
                updateUI();
                renderShop();
                document.getElementById('loginCard').style.display = 'none';
                resetGame();
                loadLeaderboard();
            } else {
                alert("Login fallito. Controlla i dati o gioca come ospite.");
            }
        }
        
        async function register() {
             const u = document.getElementById('username').value;
             const p = document.getElementById('password').value;
             if(!sb || !u || !p) return alert("Inserisci username e password");
             
             const { error } = await sb.from('leo_players').insert([{
                 username: u, password: p, coins: 0, 
                 inventory: 'noob', current_skin: 'noob',
                 pets: 'none', current_pet: 'none', best_score: 0
             }]);
             
             if(error) alert("Username preso!");
             else { alert("Account creato!"); login(); }
        }

        function playGuest() {
            user.username = "Guest " + Math.floor(Math.random()*999);
            updateUI();
            document.getElementById('loginCard').style.display = 'none';
            resetGame();
        }

        async function saveData() {
            if(user.id === 'guest') return;
            user.coins += sessionCoins;
            if(score > user.highscore) user.highscore = Math.floor(score);
            
            updateUI();
            
            await sb.from('leo_players').update({
                coins: user.coins,
                best_score: user.highscore
            }).eq('id', user.id);
            loadLeaderboard();
        }

        function updateUI() {
            document.getElementById('nameDisplay').innerText = user.username;
            document.getElementById('coinDisplay').innerText = user.coins;
            document.getElementById('shopBalance').innerText = user.coins;
            player.color = SKINS[user.skin].colors;
        }

        // --- SHOP SYSTEM ---
        function openShop() {
            document.getElementById('gameOverCard').style.display = 'none';
            document.getElementById('shopCard').style.display = 'block';
            renderShop();
        }
        function closeShop() {
             document.getElementById('shopCard').style.display = 'none';
             document.getElementById('gameOverCard').style.display = 'block';
        }

        function renderShop() {
            const grid = document.getElementById('shopGrid');
            grid.innerHTML = '';
            
            const DB = shopTab === 'skins' ? SKINS : PETS;
            const ownedList = shopTab === 'skins' ? user.inventory : user.pets;
            const currentItem = shopTab === 'skins' ? user.skin : user.pet;

            for(let key in DB) {
                let item = DB[key];
                let owned = ownedList.includes(key);
                let equipped = currentItem === key;
                
                let div = document.createElement('div');
                div.className = `shop-item ${equipped ? 'selected' : ''}`;
                
                // Preview Canvas
                let prevC = document.createElement('canvas');
                prevC.width=40; prevC.height=40; prevC.className='shop-preview';
                let pCtx = prevC.getContext('2d');
                if(shopTab==='skins') {
                    // Draw Mini Avatar
                    pCtx.fillStyle = item.colors[0]; pCtx.fillRect(10,5,20,15);
                    pCtx.fillStyle = item.colors[1]; pCtx.fillRect(5,20,30,15);
                } else {
                    if(item.color) { pCtx.fillStyle=item.color; pCtx.fillRect(10,10,20,20); }
                }
                
                let btnTxt = equipped ? "EQUIPPED" : (owned ? "EQUIP" : `${item.price} ⬢`);
                let btnClass = equipped ? "btn-green" : (owned ? "btn-blue" : "btn-shop");
                
                div.innerHTML = `<b>${item.name}</b><br>`;
                div.appendChild(prevC);
                div.innerHTML += `<button class="btn ${btnClass}" style="padding:5px; font-size:10px;" onclick="handleShopAction('${key}')">${btnTxt}</button>`;
                
                grid.appendChild(div);
            }
        }

        async function handleShopAction(key) {
            sfx('click');
            const isSkin = shopTab === 'skins';
            const DB = isSkin ? SKINS : PETS;
            const item = DB[key];
            let owned = isSkin ? user.inventory.includes(key) : user.pets.includes(key);

            if(owned) {
                // Equip
                if(isSkin) user.skin = key; else user.pet = key;
            } else {
                // Buy
                if(user.coins >= item.price) {
                    user.coins -= item.price;
                    if(isSkin) user.inventory.push(key); else user.pets.push(key);
                    // Auto equip
                    if(isSkin) user.skin = key; else user.pet = key;
                } else {
                    alert("Non hai abbastanza Robux!");
                    return;
                }
            }
            
            updateUI();
            renderShop();
            
            // Sync DB
            if(user.id !== 'guest') {
                let updatePayload = { coins: user.coins };
                if(isSkin) {
                    updatePayload.inventory = user.inventory.join(',');
                    updatePayload.current_skin = user.skin;
                } else {
                    updatePayload.pets = user.pets.join(',');
                    updatePayload.current_pet = user.pet;
                }
                await sb.from('leo_players').update(updatePayload).eq('id', user.id);
            }
        }

        async function loadLeaderboard() {
            const list = document.getElementById('leaderboardList');
            if(!sb) { list.innerHTML = '<div class="list-item">Offline Mode</div>'; return; }
            
            let { data } = await sb.from('leo_players').select('username, best_score').order('best_score', {ascending:false}).limit(5);
            if(data) {
                list.innerHTML = data.map(p => `
                    <div class="list-item">
                        <div style="display:flex;align-items:center;">
                            <div class="avatar-head"></div> ${p.username}
                        </div>
                        <span style="font-weight:bold; color:#ffeaa7;">${p.best_score}</span>
                    </div>
                `).join('');
            }
        }

        // Init
        window.onload = () => {
             draw(); // Draw BG immediately
             loadLeaderboard();
        };

    </script>
</body>
</html>
