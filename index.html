<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LEO WORLD: 3D ULTIMATE</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        body { margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #050505; font-family: 'Fredoka', sans-serif; overflow: hidden; user-select: none; touch-action: none; }
        
        canvas { 
            display: block; border-radius: 8px; 
            box-shadow: 0 0 50px rgba(0,0,0,0.8); 
            max-width: 100%; max-height: 100%; border: 4px solid #333; 
            transition: all 0.3s;
        }
        
        /* Effetto God Mode */
        canvas.god-active {
            border-color: #ffd700;
            box-shadow: 0 0 100px rgba(255, 215, 0, 0.6);
            animation: pulseGod 0.5s infinite alternate;
        }
        @keyframes pulseGod { from { transform: scale(1); } to { transform: scale(1.01); } }

        #uiLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; }
        .gui-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .badge { background: rgba(20,20,20,0.9); color: white; padding: 12px 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(8px); font-weight: 800; font-size: 16px; display: flex; align-items: center; gap: 10px; margin-bottom: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); backdrop-filter: blur(10px); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .card { background: #1e272e; padding: 35px; border-radius: 20px; width: 450px; text-align: center; border: 1px solid #485460; box-shadow: 0 30px 100px rgba(0,0,0,1); color: white; position: relative; }
        
        /* Shop */
        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; max-height: 300px; overflow-y: auto; }
        .shop-item { background: #2f3640; border-radius: 10px; padding: 10px; border: 2px solid #485460; cursor: pointer; display: flex; flex-direction: column; align-items: center; transition: 0.2s; }
        .shop-item:hover { background: #3a4150; border-color: #fff; }
        .shop-item.owned { border-color: #3498db; }
        .shop-item.equipped { border-color: #2ed573; background: rgba(46, 213, 115, 0.1); }
        .preview-canvas { width: 80px; height: 80px; margin: 10px; }

        .btn { width: 100%; padding: 15px; border: none; border-radius: 8px; font-family: inherit; font-weight: 900; font-size: 16px; cursor: pointer; margin-top: 10px; color: #fff; text-transform: uppercase; }
        .btn-green { background: #2ecc71; } .btn-blue { background: #3498db; } .btn-orange { background: #e67e22; }
        
        input { width: 100%; padding: 15px; margin: 10px 0; background: #000; border: 1px solid #555; color: white; border-radius: 8px; font-weight: bold; box-sizing: border-box; }

        #jumpBtn { position: absolute; bottom: 40px; right: 40px; width: 110px; height: 110px; background: rgba(255,255,255,0.1); border: 4px solid rgba(255,255,255,0.3); border-radius: 50%; display: flex; justify-content: center; align-items: center; pointer-events: auto; backdrop-filter: blur(5px); font-size: 40px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="uiLayer">
        <div class="gui-top">
            <div>
                <div class="badge" style="border-left: 4px solid #3498db;">👤 <span id="uiName">Guest</span></div>
                <div class="badge" style="border-left: 4px solid #f1c40f; color:#f1c40f;">⬢ <span id="uiCoins">0</span></div>
            </div>
            <div class="badge" style="background:rgba(0,0,0,0.6);">🏆 TOP HEROES: <span id="leaderList" style="margin-left:10px; font-size:12px;">Loading...</span></div>
        </div>
        <div id="powerMsg" style="display:none; position:absolute; top:30%; width:100%; text-align:center; font-size:40px; font-weight:900; color:#ffd700; text-shadow:0 0 20px #ff0000; animation:pulse 0.2s infinite;">ELEPHANT POWER!</div>
        <div class="badge" style="align-self: flex-end; font-size: 28px; background: #e74c3c; border:none;">SCORE: <span id="uiScore">0</span></div>
    </div>

    <canvas id="gameCanvas" width="900" height="500"></canvas>
    <div id="jumpBtn" onmousedown="handleInput(event)" ontouchstart="handleInput(event)">🚀</div>

    <div id="mainMenu" class="overlay">
        <div class="card">
            <h1>LEO WORLD 3D</h1>
            <h2 style="color:#3498db">ULTIMATE EDITION</h2>
            <input type="text" id="loginUser" placeholder="Username">
            <input type="password" id="loginPass" placeholder="Password">
            <button class="btn btn-green" onclick="doLogin()">ENTRA</button>
            <button class="btn btn-blue" onclick="playGuest()">OSPITE</button>
            <p onclick="doRegister()" style="cursor:pointer; margin-top:15px; font-size:12px; text-decoration:underline;">Registrati</p>
        </div>
    </div>

    <div id="shopMenu" class="overlay" style="display:none;">
        <div class="card" style="width: 500px;">
            <h1 style="color:#f1c40f">SHOP</h1>
            <div class="badge" style="margin: 0 auto 20px auto; width:fit-content;">SALDO: <span id="shopBalance">0</span> ⬢</div>
            <div style="display:flex; gap:10px; justify-content:center;">
                <button class="btn btn-blue" style="width:auto; margin:0;" onclick="switchShop('skins')">SKINS</button>
                <button class="btn btn-orange" style="width:auto; margin:0;" onclick="switchShop('pets')">PETS</button>
            </div>
            <div id="shopGrid" class="shop-grid"></div>
            <button class="btn btn-green" onclick="closeShop()">TORNA AL GIOCO</button>
        </div>
    </div>

    <div id="gameOverMenu" class="overlay" style="display:none;">
        <div class="card">
            <h1 style="color:#e74c3c">GAME OVER</h1>
            <p style="font-size:40px; font-weight:900;" id="finalScore">0</p>
            <p style="color:#f1c40f; font-size:20px; font-weight:bold;">+<span id="finalCoins">0</span> ⬢</p>
            <button class="btn btn-green" onclick="resetGame()">RIPROVA</button>
            <button class="btn btn-orange" onclick="openShop()">SHOP</button>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURAZIONE ---
        const SUPABASE_URL = 'https://jcylyutlybmbjrgghpzm.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpjeWx5dXRseWJtYmpyZ2docHptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA0NTc4NTYsImV4cCI6MjA4NjAzMzg1Nn0.X9xwESmsRJurzGODAb6V0x4QA_YODtKbATooYcC39Ew';
        let sb = null; try { if(typeof supabase !== 'undefined') sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e){}

        // --- ASSETS (Tutti i colori a 6 cifre) ---
        const SKINS = {
            'noob': { name: 'NOOB', price: 0, type: 'basic', c: ['#ffeaa7', '#0984e3', '#55efc4'] },
            'iron': { name: 'IRON MAN', price: 2500, type: 'iron', c: ['#c0392b', '#c0392b', '#f1c40f'] },
            'spider': { name: 'SPIDER', price: 5000, type: 'spider', c: ['#e74c3c', '#3498db', '#c0392b'] },
            'cap': { name: 'CAPTAIN', price: 7500, type: 'cap', c: ['#3498db', '#3498db', '#c0392b'] },
            'hulk': { name: 'HULK', price: 10000, type: 'hulk', c: ['#2ecc71', '#2ecc71', '#8e44ad'] }
        };
        const PETS = {
            'none': { name: 'NESSUNO', price: 0, type: 'none' },
            'cube': { name: 'CUBE', price: 1000, type: 'cube' },
            'doge': { name: 'DOGE', price: 3000, type: 'doge' },
            'ufo': { name: 'UFO', price: 6000, type: 'ufo' }
        };

        let user = { username: 'Guest', id: 'guest', coins: 0, highscore: 0, inventory: ['noob'], skin: 'noob', pets: ['none'], pet: 'none' };

        // --- AUDIO ---
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ac = new AudioCtx();
        function sfx(t) {
            if(ac.state==='suspended')ac.resume();
            const o=ac.createOscillator(), g=ac.createGain(), n=ac.currentTime;
            o.connect(g); g.connect(ac.destination);
            if(t==='jump'){o.frequency.setValueAtTime(300,n);o.frequency.linearRampToValueAtTime(600,n+0.1);g.gain.value=0.1;o.start(n);o.stop(n+0.15)}
            else if(t==='coin'){o.type='triangle';o.frequency.setValueAtTime(1200,n);g.gain.value=0.05;o.start(n);o.stop(n+0.1)}
            else if(t==='epic'){o.type='square';o.frequency.setValueAtTime(400,n);o.frequency.linearRampToValueAtTime(1000,n+0.5);g.gain.value=0.1;o.start(n);o.stop(n+0.5)}
            else if(t==='break'){o.type='sawtooth';o.frequency.setValueAtTime(100,n);g.gain.value=0.2;o.start(n);o.stop(n+0.2)}
            else if(t==='die'){o.type='sawtooth';o.frequency.setValueAtTime(200,n);o.frequency.linearRampToValueAtTime(50,n+0.5);g.gain.value=0.2;o.start(n);o.stop(n+0.5)}
        }

        // --- GRAPHICS ENGINE 3D ---
        const cvs = document.getElementById('gameCanvas');
        const ctx = cvs.getContext('2d');

        function shade(hex, percent) {
            if(!hex || hex.length < 7) return '#888888'; 
            let f=parseInt(hex.slice(1),16), t=percent<0?0:255, p=percent<0?percent*-1:percent, R=f>>16, G=f>>8&0x00FF, B=f&0x0000FF;
            return "#"+(0x1000000+(Math.round((t-R)*p)+R)*0x10000+(Math.round((t-G)*p)+G)*0x100+(Math.round((t-B)*p)+B)).toString(16).slice(1);
        }

        // Funzione base per disegnare un blocco 3D
        function draw3D(c, x, y, w, h, col, depth=5) {
            c.fillStyle = col; c.fillRect(x, y, w, h); // Fronte
            c.fillStyle = shade(col, 0.3); c.fillRect(x, y, w, depth); // Top (luce)
            c.fillStyle = shade(col, -0.3); c.fillRect(x+w-depth, y, depth, h); // Lato (ombra)
            c.fillRect(x, y+h-depth, w, depth); // Bottom
        }

        // Funzione avanzata per disegnare Skin 3D
        function renderSkin(c, x, y, key, scale, frame=0) {
            c.save(); c.translate(x, y); c.scale(scale, scale);
            const s = SKINS[key] || SKINS['noob'];
            const t = s.type;
            const cols = s.c || ['#ffffff','#888888','#444444'];
            let anim = Math.sin(frame*0.3)*3;

            if(t === 'iron') {
                draw3D(c, 4, 0, 22, 18, '#c0392b'); // Head
                c.fillStyle='#f1c40f'; c.fillRect(8, 4, 14, 14); // Face
                draw3D(c, 0, 18, 30, 18, '#c0392b'); // Body
                c.fillStyle='#3498db'; c.beginPath(); c.arc(15, 27, 4, 0, 6.28); c.fill(); // Arc
                draw3D(c, 2, 36, 12, 12+anim, '#c0392b'); draw3D(c, 16, 36, 12, 12-anim, '#c0392b'); // Legs
            } else if(t === 'spider') {
                draw3D(c, 4, 0, 22, 18, '#e74c3c'); // Head
                c.fillStyle='#fff'; c.beginPath(); c.ellipse(10, 8, 4, 2, 0.5, 0, 6.28); c.fill(); c.beginPath(); c.ellipse(20, 8, 4, 2, -0.5, 0, 6.28); c.fill();
                draw3D(c, 0, 18, 30, 18, '#3498db'); // Body Blue
                c.fillStyle='#e74c3c'; c.fillRect(8, 18, 14, 18); // Body Red
                draw3D(c, 2, 36, 12, 12+anim, '#3498db'); draw3D(c, 16, 36, 12, 12-anim, '#3498db'); // Legs
            } else if(t === 'hulk') {
                draw3D(c, 2, -4, 26, 22, '#2ecc71'); // Big Head
                c.fillStyle='#000'; c.fillRect(2, -4, 26, 6); // Hair
                draw3D(c, -2, 18, 34, 22, '#27ae60'); // Big Body
                draw3D(c, 2, 40, 12, 10+anim, '#8e44ad'); draw3D(c, 16, 40, 12, 10-anim, '#8e44ad'); // Pants
            } else {
                // Basic / Cap / Noob
                draw3D(c, 4, 0, 22, 18, cols[0]); // Head
                draw3D(c, 0, 18, 30, 18, cols[1]); // Body
                draw3D(c, 2, 36, 12, 12+anim, cols[2]); // Leg L
                draw3D(c, 16, 36, 12, 12-anim, cols[2]); // Leg R
            }
            c.restore();
        }

        // Funzione per disegnare Pet 3D
        function renderPet(c, x, y, key, scale) {
            c.save(); c.translate(x, y); c.scale(scale, scale);
            if(key === 'cube') { draw3D(c, 0, 0, 20, 20, '#3498db'); c.fillStyle='#fff'; c.fillRect(5,5,10,10); }
            else if(key === 'doge') { draw3D(c, 0, 0, 22, 18, '#f1c40f'); c.fillStyle='#000'; c.fillRect(4,6,3,3); c.fillRect(15,6,3,3); }
            else if(key === 'ufo') { c.fillStyle='#95a5a6'; c.beginPath(); c.ellipse(12,12,16,6,0,0,6.28); c.fill(); c.fillStyle='rgba(52,152,219,0.5)'; c.beginPath(); c.arc(12,10,8,0,6.28); c.fill(); }
            c.restore();
        }

        // --- GAME LOGIC ---
        let gameState='MENU', frames=0, speed=6, score=0, coins=0, godMode=0;
        let player={x:100, y:200, w:30, h:48, dy:0, ground:false}, pet={x:50,y:200};
        let entities=[], particles=[], texts=[];

        function update() {
            if(gameState!=='PLAY') return;
            frames++; score+=0.05; speed+=0.0005;
            if(godMode>0) godMode--;

            // Physics
            player.dy += 0.65; player.y += player.dy;
            if(player.y+player.h > 440) { player.y=440-player.h; player.dy=0; player.ground=true; } else { player.ground=false; }

            // God Mode Effects
            if(godMode > 0) {
                document.getElementById('gameCanvas').classList.add('god-active');
                document.getElementById('powerMsg').style.display = 'block';
            } else {
                document.getElementById('gameCanvas').classList.remove('god-active');
                document.getElementById('powerMsg').style.display = 'none';
            }

            // Spawn
            if(frames%Math.floor(100-speed*2)===0) {
                let r = Math.random();
                if(r<0.02) entities.push({x:900, y:100, w:30, h:30, t:'ele', c:'#3498db'}); // Elephant
                else if(r<0.3) entities.push({x:900, y:300+Math.random()*100, w:20, h:20, t:'coin', c:'#f1c40f'});
                else if(r<0.5) entities.push({x:900, y:400, w:40, h:40, t:'crate', c:'#e67e22'});
                else if(r<0.7) entities.push({x:900, y:400, w:40, h:40, t:'kill', c:'#ff4757'});
                else entities.push({x:900, y:420, w:40, h:20, t:'spring', c:'#a55eea'});
            }

            // Entities Loop
            entities.forEach(e => {
                e.x -= speed;
                
                // Magnet Effect
                if(godMode > 0 && (e.t === 'coin' || e.t === 'ele')) {
                    e.x += (player.x - e.x) * 0.2; e.y += (player.y - e.y) * 0.2;
                }

                // Collision
                if(player.x < e.x+e.w && player.x+player.w > e.x && player.y < e.y+e.h && player.y+player.h > e.y) {
                    if(e.t === 'coin') {
                        e.dead=true; coins+=1; score+=50; sfx('coin');
                        texts.push({x:e.x, y:e.y, t:'+50', c:'#fff', l:1});
                    } 
                    else if(e.t === 'ele') {
                        e.dead=true; coins+=50; score+=1000; godMode=300; sfx('epic'); // 5 SECONDS GOD MODE
                        texts.push({x:e.x, y:e.y, t:'GOD MODE!', c:'#ffd700', l:2});
                    }
                    else if(godMode > 0 && (e.t==='crate' || e.t==='kill')) {
                        // God Mode Smash
                        e.dead=true; score+=500; sfx('break');
                        spawnParticles(e.x, e.y, e.c);
                        texts.push({x:e.x, y:e.y, t:'SMASH!', c:'#ff4757', l:1});
                    }
                    else if(e.t === 'crate') {
                        // Normal Smash
                        if(player.dy>0 && player.y < e.y) { e.dead=true; player.dy=-12; score+=100; sfx('break'); spawnParticles(e.x, e.y, e.c); }
                        else if(player.dy<0 && player.y > e.y) { e.dead=true; player.dy=5; score+=100; sfx('break'); spawnParticles(e.x, e.y, e.c); }
                        else gameOver();
                    }
                    else if(e.t === 'spring') {
                        player.dy = -28; sfx('jump');
                    }
                    else { gameOver(); }
                }
            });

            // Update Arrays
            entities = entities.filter(e => !e.dead && e.x > -100);
            particles.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.vy+=0.5; p.l-=0.05; });
            particles = particles.filter(p => p.l > 0);
            texts.forEach(t => { t.y-=2; t.l-=0.02; });
            texts = texts.filter(t => t.l > 0);
        }

        function draw() {
            // Sky
            let grd=ctx.createLinearGradient(0,0,0,500); grd.addColorStop(0, godMode>0 ? '#330033' : '#48dbfb'); grd.addColorStop(1, godMode>0 ? '#550000' : '#c8d6e5');
            ctx.fillStyle=grd; ctx.fillRect(0,0,900,500);

            // Ground
            ctx.fillStyle='#1dd1a1'; ctx.fillRect(0,440,900,60);
            ctx.fillStyle='#10ac84'; for(let i=-(frames*speed)%40; i<900; i+=40) ctx.fillRect(i,440,36,6);

            // Entities
            entities.forEach(e => {
                if(e.t === 'ele') {
                    ctx.fillStyle='#3498db'; ctx.beginPath(); ctx.arc(e.x+15, e.y+15, 15, 0, 6.28); ctx.fill();
                    ctx.fillStyle='#fff'; ctx.font="bold 12px Arial"; ctx.fillText("E", e.x+11, e.y+20);
                } else if (e.t === 'coin') {
                    ctx.fillStyle='#f1c40f'; ctx.beginPath(); ctx.arc(e.x+10, e.y+10, 10, 0, 6.28); ctx.fill();
                } else {
                    draw3D(ctx, e.x, e.y, e.w, e.h, e.c);
                }
            });

            particles.forEach(p => { ctx.globalAlpha=p.l; ctx.fillStyle=p.c; ctx.fillRect(p.x, p.y, 8, 8); ctx.globalAlpha=1; });

            // Pet
            if(user.pet!=='none') {
                pet.x += ((player.x-40)-pet.x)*0.1; pet.y += ((player.y-20)-pet.y)*0.1;
                renderPet(ctx, pet.x, pet.y, user.pet, 1);
            }

            // Player
            if(gameState==='PLAY') renderSkin(ctx, player.x, player.y, user.skin, 1, frames);

            // Texts
            texts.forEach(t => { ctx.globalAlpha=Math.max(0,t.l); ctx.fillStyle=t.c; ctx.font="bold 24px Arial"; ctx.fillText(t.t, t.x, t.y); ctx.globalAlpha=1; });

            document.getElementById('uiScore').innerText = Math.floor(score);
            document.getElementById('uiCoins').innerText = user.coins + coins;
            if(gameState==='PLAY') requestAnimationFrame(function(){update();draw()});
        }

        // --- CORE & SHOP ---
        function spawnParticles(x,y,c){ for(let i=0;i<6;i++) particles.push({x:x,y:y,vx:(Math.random()-0.5)*10,vy:(Math.random()-1)*10,c:c,l:1}); }
        function gameOver() { gameState='END'; sfx('die'); document.getElementById('gameOverMenu').style.display='flex'; document.getElementById('finalScore').innerText=Math.floor(score); document.getElementById('finalCoins').innerText=coins; saveData(); }
        function resetGame() { entities=[]; particles=[]; texts=[]; score=0; coins=0; speed=6; frames=0; godMode=0; player.y=200; player.dy=0; document.getElementById('gameOverMenu').style.display='none'; document.getElementById('shopMenu').style.display='none'; document.getElementById('mainMenu').style.display='none'; gameState='PLAY'; update(); draw(); }

        let shopTab = 'skins';
        function switchShop(t) { shopTab=t; renderShop(); }
        function openShop() { document.getElementById('gameOverMenu').style.display='none'; document.getElementById('shopMenu').style.display='flex'; switchShop('skins'); }
        function closeShop() { document.getElementById('shopMenu').style.display='none'; document.getElementById('gameOverMenu').style.display='flex'; }
        
        function renderShop() {
            const g = document.getElementById('shopGrid'); g.innerHTML=''; 
            const isS=shopTab==='skins', DB=isS?SKINS:PETS, inv=isS?user.inventory:user.pets, eq=isS?user.skin:user.pet;
            document.getElementById('shopBalance').innerText = user.coins;

            for(let k in DB) {
                let item = DB[k]; let has=inv.includes(k), isEq=eq===k;
                let div = document.createElement('div'); div.className = `shop-item ${has?'owned':''} ${isEq?'equipped':''}`;
                
                // Anteprima su Canvas separato
                let cvs = document.createElement('canvas'); cvs.width=70; cvs.height=70; cvs.className='preview-canvas';
                let cx = cvs.getContext('2d');
                if(isS) renderSkin(cx, 15, 10, k, 1.5, 0); else renderPet(cx, 15, 15, k, 1.5);

                div.innerHTML = `<div style="font-size:12px; font-weight:bold; color:#fff; margin-bottom:5px;">${item.name}</div>`;
                div.appendChild(cvs);
                div.innerHTML += `<button class="btn ${isEq?'btn-green':(has?'btn-blue':'btn-orange')}" style="padding:5px; font-size:10px; margin-top:5px;" onclick="buyItem('${k}')">${isEq?'EQUIPPED':(has?'SELECT':item.price)}</button>`;
                g.appendChild(div);
            }
        }

        async function buyItem(k) {
            sfx('coin'); const isS=shopTab==='skins', DB=isS?SKINS:PETS, i=DB[k];
            let inv=isS?user.inventory:user.pets;
            if(inv.includes(k)) { if(isS) user.skin=k; else user.pet=k; }
            else { if(user.coins>=i.price) { user.coins-=i.price; if(isS)user.inventory.push(k); else user.pets.push(k); if(isS)user.skin=k; else user.pet=k; } else { alert("Soldi insufficienti!"); return; } }
            renderShop();
            if(user.id!=='guest'&&sb) { let p={coins:user.coins}; if(isS){p.inventory=user.inventory.join(',');p.current_skin=user.skin}else{p.pets=user.pets.join(',');p.current_pet=user.pet} await sb.from('leo_players').update(p).eq('id',user.id); }
        }

        // Auth
        async function doLogin(){const u=document.getElementById('loginUser').value,p=document.getElementById('loginPass').value;if(!sb)return playGuest();try{let{data}=await sb.from('leo_players').select('*').eq('username',u).eq('password',p).single();if(!data)throw 0;user.id=data.id;user.username=data.username;user.coins=data.coins||0;user.highscore=data.best_score||0;let s=data.current_skin||'noob';user.skin=SKINS[s]?s:'noob';let pt=data.current_pet||'none';user.pet=PETS[pt]?pt:'none';user.inventory=(data.inventory||'noob').split(',');user.pets=(data.pets||'none').split(',');startGame()}catch(e){playGuest()}}
        async function doRegister(){const u=document.getElementById('loginUser').value,p=document.getElementById('loginPass').value;if(sb)await sb.from('leo_players').insert([{username:u,password:p,coins:0,inventory:'noob',pets:'none'}]);alert("Registrato!");}
        function playGuest(){user.username="Guest"+Math.floor(Math.random()*99);startGame()}
        function startGame(){document.getElementById('uiName').innerText=user.username;document.getElementById('uiCoins').innerText=user.coins;document.getElementById('mainMenu').style.display='none';loadLeaderboard();resetGame();}
        async function saveData(){if(user.id!=='guest'&&sb)await sb.from('leo_players').update({coins:user.coins+coins,best_score:Math.max(user.highscore,Math.floor(score))}).eq('id',user.id);loadLeaderboard();}
        async function loadLeaderboard(){if(!sb){document.getElementById('leaderList').innerText="Offline";return}let{data}=await sb.from('leo_players').select('username,best_score').order('best_score',{ascending:false}).limit(1);if(data)document.getElementById('leaderList').innerText=`${data[0].username} (${data[0].best_score})`;}

        function handleInput(e){if(gameState!=='PLAY')return; if(e.type==='keydown'&&e.code!=='Space'&&e.code!=='ArrowUp')return;e.preventDefault(); if(player.ground){player.dy=-14;player.ground=false;sfx('jump');}}
        window.addEventListener('keydown',handleInput);
        window.onload=()=>{
            let grd=ctx.createLinearGradient(0,0,0,500); grd.addColorStop(0, '#48dbfb'); grd.addColorStop(1, '#c8d6e5');
            ctx.fillStyle=grd; ctx.fillRect(0,0,900,500); loadLeaderboard();
        }
    </script>
</body>
</html>
