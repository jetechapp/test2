<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MARVEL RUNNER 3D - REALISTIC EDITION</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Orbitron:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: radial-gradient(ellipse at center, #0a0a1a 0%, #000000 100%);
            font-family: 'Orbitron', sans-serif;
            color: white;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 69, 0, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 150, 255, 0.15) 0%, transparent 50%),
                url('data:image/svg+xml,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M 100 0 L 0 0 0 100" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="url(%23grid)"/></svg>');
            z-index: -2;
        }

        canvas {
            display: block;
            border: 2px solid rgba(255, 69, 0, 0.3);
            background: linear-gradient(to bottom, #0a0a1a 0%, #1a1a2e 30%, #16213e 100%);
            box-shadow: 
                0 0 80px rgba(255, 69, 0, 0.2),
                0 0 0 1px rgba(255, 255, 255, 0.05),
                inset 0 0 30px rgba(0, 0, 0, 0.8);
            max-width: 100%;
            max-height: 100%;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            image-rendering: auto;
            border-radius: 4px;
        }

        canvas.ironman-active {
            background: linear-gradient(to bottom, #2a0000 0%, #1a0000 30%, #0a0000 100%);
            box-shadow: 
                0 0 100px rgba(255, 69, 0, 0.5),
                0 0 0 1px rgba(255, 69, 0, 0.2);
            border-color: rgba(255, 69, 0, 0.6);
        }

        canvas.thor-active {
            background: linear-gradient(to bottom, #1a1a00 0%, #0a0a00 30%, #000000 100%);
            box-shadow: 
                0 0 100px rgba(255, 204, 0, 0.5),
                0 0 0 1px rgba(255, 204, 0, 0.2);
            border-color: rgba(255, 204, 0, 0.6);
            animation: thor-lightning 0.5s infinite alternate;
        }

        canvas.hulk-active {
            background: linear-gradient(to bottom, #001a00 0%, #000a00 30%, #000000 100%);
            box-shadow: 
                0 0 100px rgba(0, 255, 0, 0.5),
                0 0 0 1px rgba(0, 255, 0, 0.2);
            border-color: rgba(0, 255, 0, 0.6);
        }

        canvas.spiderman-active {
            background: linear-gradient(to bottom, #1a0000 0%, #0a0000 30%, #00001a 100%);
            box-shadow: 
                0 0 100px rgba(255, 0, 0, 0.5),
                0 0 0 1px rgba(0, 0, 255, 0.2);
            border-color: rgba(255, 0, 0, 0.6);
        }

        @keyframes thor-lightning {
            0% { filter: brightness(1) hue-rotate(0deg); }
            100% { filter: brightness(1.2) hue-rotate(10deg); }
        }

        .shake {
            animation: shake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        #ui {
            position: absolute;
            top: 20px;
            width: 100%;
            pointer-events: none;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
        }

        .hud-left, .hud-right {
            background: rgba(10, 10, 20, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px 20px;
            border: 1px solid rgba(255, 69, 0, 0.3);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .hud-left {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 200px;
        }

        .hud-right {
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: right;
            min-width: 180px;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 5px;
        }

        .player-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff4500, #ffd700);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 4px 15px rgba(255, 69, 0, 0.4);
        }

        .player-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 24px;
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            letter-spacing: 1px;
        }

        .stat-box {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
        }

        .stat-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 69, 0, 0.2);
            border-radius: 6px;
            font-size: 14px;
        }

        .stat-value {
            font-weight: 700;
            color: #fff;
            font-size: 16px;
        }

        .bank-value {
            color: #ffd700;
            font-weight: 900;
            font-size: 18px;
        }

        #damageMsg, #powerMsg, #comboMsg {
            display: none;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Bebas Neue', sans-serif;
            z-index: 20;
            text-align: center;
            width: 100%;
            pointer-events: none;
        }

        #damageMsg {
            top: 30%;
            color: #ff0000;
            font-size: 48px;
            animation: damageEffect 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-shadow: 
                0 0 20px rgba(255, 0, 0, 0.8),
                0 0 40px rgba(255, 0, 0, 0.6),
                0 0 60px rgba(255, 0, 0, 0.4);
        }

        #powerMsg {
            top: 40%;
            font-size: 42px;
            animation: powerEffect 0.8s ease-out;
            background: linear-gradient(45deg, #ff4500, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 
                0 0 30px rgba(255, 69, 0, 0.5),
                0 0 60px rgba(255, 69, 0, 0.3);
        }

        #comboMsg {
            top: 60%;
            font-size: 32px;
            color: #ffd700;
            animation: comboEffect 1.5s ease-out;
        }

        @keyframes damageEffect {
            0% { transform: translateX(-50%) scale(0.5) rotate(-10deg); opacity: 0; }
            50% { transform: translateX(-50%) scale(1.2) rotate(5deg); opacity: 1; }
            100% { transform: translateX(-50%) scale(1) rotate(0); opacity: 0; }
        }

        @keyframes powerEffect {
            0% { transform: translateX(-50%) translateY(100px) scale(0.3); opacity: 0; }
            100% { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; }
        }

        @keyframes comboEffect {
            0% { opacity: 0; transform: translateX(-50%) translateY(0); }
            20% { opacity: 1; transform: translateX(-50%) translateY(-20px); }
            80% { opacity: 1; transform: translateX(-50%) translateY(-50px); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-100px); }
        }

        #loginOverlay, #shopOverlay, #registerOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 15, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(20px);
        }

        #shopOverlay, #registerOverlay {
            display: none;
            z-index: 110;
        }

        .login-box, .shop-box, .register-box {
            background: rgba(20, 20, 35, 0.9);
            padding: 40px;
            border: 2px solid rgba(255, 69, 0, 0.4);
            border-radius: 20px;
            text-align: center;
            width: 450px;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .register-box {
            border-color: rgba(0, 150, 255, 0.4);
        }

        .shop-box {
            border-color: rgba(255, 215, 0, 0.4);
        }

        .login-box::before, .shop-box::before, .register-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #ff4500, #ffd700, #ff4500);
            border-radius: 20px 20px 0 0;
        }

        h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 36px;
            color: #ffd700;
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        input {
            width: 100%;
            padding: 16px 20px;
            margin: 12px 0;
            border: 1px solid rgba(255, 69, 0, 0.3);
            background: rgba(10, 10, 20, 0.8);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            border-radius: 10px;
            outline: none;
            transition: all 0.3s;
        }

        input:focus {
            border-color: #ff4500;
            box-shadow: 0 0 20px rgba(255, 69, 0, 0.3);
            background: rgba(20, 20, 35, 0.9);
        }

        button.main-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #ff4500, #e63e00);
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            letter-spacing: 1px;
        }

        button.main-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }

        button.main-btn:hover::before {
            left: 100%;
        }

        button.main-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 69, 0, 0.4);
            background: linear-gradient(135deg, #ff5500, #ff4500);
        }

        button.main-btn:active {
            transform: translateY(1px);
        }

        button.shop-btn {
            background: linear-gradient(135deg, #ffd700, #e6c200);
            color: #000;
        }

        button.shop-btn:hover {
            background: linear-gradient(135deg, #ffed4e, #ffd700);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.4);
        }

        .shop-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 25px 0;
        }

        .skin-card {
            background: rgba(15, 15, 30, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .skin-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 69, 0, 0.5);
            box-shadow: 0 10px 25px rgba(255, 69, 0, 0.2);
        }

        .skin-card.owned {
            border-color: rgba(0, 255, 0, 0.5);
            background: rgba(15, 30, 15, 0.8);
        }

        .skin-card.equipped {
            border-color: rgba(255, 215, 0, 0.8);
            background: rgba(30, 30, 15, 0.8);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }

        .skin-preview {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.5);
        }

        .skin-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 16px;
            color: #ffd700;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .skin-price {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 12px;
        }

        .buy-btn {
            width: 100%;
            padding: 10px;
            background: rgba(255, 69, 0, 0.2);
            color: #ff4500;
            border: 1px solid rgba(255, 69, 0, 0.3);
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            transition: all 0.3s;
        }

        .buy-btn:hover {
            background: rgba(255, 69, 0, 0.4);
            border-color: #ff4500;
        }

        #gameOver {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 35, 0.95);
            padding: 50px;
            border: 2px solid rgba(255, 69, 0, 0.5);
            border-radius: 20px;
            text-align: center;
            z-index: 120;
            width: 500px;
            box-shadow: 
                0 30px 80px rgba(0, 0, 0, 0.7),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        #jumpButton {
            display: none;
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, rgba(255, 69, 0, 0.3), rgba(200, 30, 0, 0.2));
            border: 2px solid rgba(255, 69, 0, 0.5);
            border-radius: 50%;
            color: white;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 20;
            transition: all 0.2s;
            user-select: none;
            letter-spacing: 2px;
            backdrop-filter: blur(10px);
        }

        #jumpButton:hover {
            transform: scale(1.05);
            border-color: rgba(255, 69, 0, 0.8);
            background: radial-gradient(circle, rgba(255, 69, 0, 0.4), rgba(200, 30, 0, 0.3));
        }

        #jumpButton:active {
            transform: scale(0.95);
        }

        #mobileControls {
            position: absolute;
            bottom: 40px;
            left: 40px;
            display: none;
            gap: 20px;
            z-index: 20;
        }

        .mobile-btn {
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(0, 150, 255, 0.3), rgba(0, 100, 200, 0.2));
            border: 2px solid rgba(0, 150, 255, 0.5);
            border-radius: 50%;
            color: white;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            backdrop-filter: blur(10px);
        }

        .mobile-btn:active {
            transform: scale(0.95);
        }

        #comboCounter {
            position: absolute;
            top: 150px;
            right: 30px;
            background: rgba(20, 20, 35, 0.8);
            padding: 15px 25px;
            border-radius: 15px;
            border: 1px solid rgba(255, 215, 0, 0.5);
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            color: #ffd700;
            display: none;
            z-index: 10;
            backdrop-filter: blur(10px);
        }

        #comboValue {
            font-size: 24px;
            font-weight: 900;
            color: #ff4500;
            margin-left: 10px;
        }

        .power-indicator {
            position: absolute;
            top: 150px;
            left: 30px;
            background: rgba(20, 20, 35, 0.8);
            padding: 12px 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 69, 0, 0.5);
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            color: #ffd700;
            display: none;
            z-index: 10;
            backdrop-filter: blur(10px);
        }

        .power-bar {
            width: 200px;
            height: 6px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }

        .power-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff4500, #ffd700);
            border-radius: 3px;
            transition: width 0.1s linear;
        }

        @media (max-width: 768px) {
            #ui {
                padding: 0 15px;
                flex-direction: column;
                gap: 15px;
            }
            
            .hud-left, .hud-right {
                width: 100%;
                padding: 12px 15px;
            }
            
            .login-box, .shop-box, .register-box, #gameOver {
                width: 95%;
                padding: 30px;
            }
            
            .shop-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            #jumpButton {
                width: 100px;
                height: 100px;
                bottom: 30px;
                right: 30px;
                font-size: 20px;
            }
            
            #mobileControls {
                display: flex;
                bottom: 30px;
                left: 30px;
            }
            
            .mobile-btn {
                width: 80px;
                height: 80px;
                font-size: 16px;
            }
        }

        @media (max-width: 480px) {
            .shop-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="ui">
        <div class="hud-left">
            <div class="player-info">
                <div class="player-avatar" id="playerAvatar">🦸</div>
                <div class="player-name" id="currentPlayerDisplay">HERO</div>
            </div>
            <div class="stat-box">
                <div class="stat-icon">💰</div>
                <div>COINS: <span class="stat-value bank-value" id="bankDisplay">0</span></div>
            </div>
        </div>
        <div class="hud-right">
            <div class="stat-box">
                <div class="stat-icon">⭐</div>
                <div>SCORE: <span class="stat-value" id="score">0</span></div>
            </div>
            <div class="stat-box">
                <div class="stat-icon">❤️</div>
                <div>LIVES: <span class="stat-value" id="livesDisplay">3</span></div>
            </div>
            <div class="stat-box">
                <div class="stat-icon">⚡</div>
                <div>POWER: <span class="stat-value" id="coinsDisplay">0</span></div>
            </div>
        </div>
    </div>

    <div id="damageMsg">DAMAGE!</div>
    <div id="powerMsg">POWER ACTIVATED!</div>
    <div id="comboMsg">COMBO!</div>

    <div id="comboCounter">COMBO: <span id="comboValue">0</span>x</div>
    <div class="power-indicator" id="powerIndicator">
        <div>POWER ACTIVE</div>
        <div class="power-bar"><div class="power-bar-fill" id="powerBarFill"></div></div>
    </div>

    <canvas id="gameCanvas"></canvas>
    
    <div id="mobileControls">
        <div class="mobile-btn" ontouchstart="slideLeft()" ontouchend="stopSlide()">←</div>
        <div class="mobile-btn" ontouchstart="slideRight()" ontouchend="stopSlide()">→</div>
    </div>
    
    <div id="jumpButton" ontouchstart="handleInput(event)" onmousedown="handleInput(event)">JUMP</div>

    <div id="loginOverlay">
        <div class="login-box">
            <h2>MARVERL RUNNER</h2>
            <input type="text" id="loginUser" placeholder="HERO NAME">
            <input type="password" id="loginPass" placeholder="PASSWORD">
            <button class="main-btn" onclick="attemptLogin()">ENTER UNIVERSE</button>
            <button class="main-btn" style="background: rgba(60, 60, 80, 0.8); margin-top: 10px;" onclick="playOffline()">PLAY AS GUEST</button>
            <div style="margin-top: 25px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1);">
                <button class="main-btn" style="background: rgba(40, 40, 60, 0.8); font-size: 12px;" onclick="showRegister()">NEW HERO REGISTRATION</button>
            </div>
        </div>
    </div>

    <div id="registerOverlay">
        <div class="register-box">
            <h2>JOIN AVENGERS</h2>
            <input type="text" id="regUser" placeholder="CHOOSE HERO NAME">
            <input type="password" id="regPass" placeholder="CREATE PASSWORD">
            <input type="password" id="regPassConfirm" placeholder="CONFIRM PASSWORD">
            <button class="main-btn" onclick="registerUser()">BECOME HERO</button>
            <button class="main-btn" style="background: rgba(60, 60, 80, 0.8); margin-top: 10px;" onclick="showLogin()">BACK TO LOGIN</button>
        </div>
    </div>

    <div id="shopOverlay">
        <div class="shop-box">
            <h2>HERO ARMORY</h2>
            <div style="text-align: center; margin-bottom: 20px; font-size: 18px; color: #ffd700;">COINS: <span id="shopBankDisplay">0</span></div>
            <div class="shop-grid" id="skinGrid"></div>
            <button class="main-btn" style="background: rgba(60, 60, 80, 0.8);" onclick="closeShop()">BACK TO BATTLE</button>
        </div>
    </div>

    <div id="gameOver">
        <h2 style="color: #ff4500; margin-bottom: 30px;">MISSION FAILED</h2>
        <div style="font-size: 24px; margin-bottom: 20px; color: #ffd700;">SCORE: <span id="finalScore">0</span></div>
        <div style="font-size: 20px; margin-bottom: 30px; color: #aaa;">COINS EARNED: <span id="earnedCoins">0</span></div>
        <button class="main-btn" onclick="resetGame()">RETRY MISSION</button>
        <button class="main-btn shop-btn" style="margin-top: 15px;" onclick="openShop()">VISIT ARMORY</button>
    </div>

    <script>

        async function loadSound(url) {
            try {
                const response = await fetch(url);
                const arrayBuffer = await response.arrayBuffer();
                return await audioContext.decodeAudioData(arrayBuffer);
            } catch (error) {
                console.warn("Could not load sound:", url);
                return null;
            }

        function playSound(type) {
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }

            const now = audioContext.currentTime;
            
            if (type === 'jump') {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.setValueAtTime(150, now);
                oscillator.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                
                oscillator.start(now);
                oscillator.stop(now + 0.1);
                
            } else if (type === 'coin') {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.setValueAtTime(800, now);
                oscillator.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                gainNode.gain.setValueAtTime(0.05, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                
                oscillator.start(now);
                oscillator.stop(now + 0.1);
                
            } else if (type === 'powerup') {
                const oscillator1 = audioContext.createOscillator();
                const oscillator2 = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator1.connect(gainNode);
                oscillator2.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator1.frequency.setValueAtTime(200, now);
                oscillator1.frequency.exponentialRampToValueAtTime(800, now + 0.5);
                oscillator2.frequency.setValueAtTime(300, now);
                oscillator2.frequency.exponentialRampToValueAtTime(600, now + 0.5);
                gainNode.gain.setValueAtTime(0.15, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                
                oscillator1.start(now);
                oscillator2.start(now);
                oscillator1.stop(now + 0.5);
                oscillator2.stop(now + 0.5);
            }
        }

        // ================= GAME OBJECTS =================
        class Obstacle {
            constructor() {
                this.width = 40 + Math.random() * 20;
                this.height = 40 + Math.random() * 20;
                this.x = canvas.width;
                this.y = canvas.height - 100 - this.height;
                this.type = this.getRandomType();
                this.color = this.getColor();
                this.speed = gameSpeed;
                this.rotation = 0;
                this.rotationSpeed = (Math.random() - 0.5) * 0.1;
            }
            
            getRandomType() {
                const types = ['cube', 'pyramid', 'cylinder', 'sphere'];
                return types[Math.floor(Math.random() * types.length)];
            }
            
            getColor() {
                const colors = ['#ff4500', '#ff9900', '#ff0000', '#cc0000'];
                return colors[Math.floor(Math.random() * colors.length)];
            }
            
            update() {
                this.x -= this.speed;
                this.rotation += this.rotationSpeed;
                
                // Add some vertical movement
                this.y += Math.sin(frames * 0.05) * 0.5;
            }
            
            draw() {
                ctx.save();
                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
                ctx.rotate(this.rotation);
                
                // Shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.fillRect(-this.width / 2 + 5, -this.height / 2 + 5, this.width, this.height);
                
                // Main shape
                const gradient = ctx.createLinearGradient(
                    -this.width / 2, -this.height / 2,
                    this.width / 2, this.height / 2
                );
                gradient.addColorStop(0, this.color);
                gradient.addColorStop(1, this.darkenColor(this.color, 0.3));
                
                ctx.fillStyle = gradient;
                
                if (this.type === 'cube') {
                    ctx.fillRect(-this.width / 2, -this.height / 2, this.width, this.height);
                    
                    // 3D effect
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(-this.width / 2, -this.height / 2, this.width, this.height);
                    
                } else if (this.type === 'pyramid') {
                    ctx.beginPath();
                    ctx.moveTo(0, -this.height / 2);
                    ctx.lineTo(-this.width / 2, this.height / 2);
                    ctx.lineTo(this.width / 2, this.height / 2);
                    ctx.closePath();
                    ctx.fill();
                }
                
                ctx.restore();
            }
            
            darkenColor(color, amount) {
                const num = parseInt(color.slice(1), 16);
                const amt = Math.round(2.55 * amount * 100);
                const R = (num >> 16) - amt;
                const G = (num >> 8 & 0x00FF) - amt;
                const B = (num & 0x0000FF) - amt;
                return `#${(0x1000000 + (R < 255 ? R < 1 ? 0 : R : 255) * 0x10000 +
                    (G < 255 ? G < 1 ? 0 : G : 255) * 0x100 +
                    (B < 255 ? B < 1 ? 0 : B : 255)).toString(16).slice(1)}`;
            }
        }

        class Coin {
            constructor() {
                this.size = 15;
                this.x = canvas.width;
                this.y = canvas.height - 150 - Math.random() * 100;
                this.type = Math.random() > 0.9 ? 'power' : 'normal';
                this.color = this.type === 'power' ? '#ffd700' : '#ff9900';
                this.rotation = 0;
                this.floatOffset = Math.random() * Math.PI * 2;
            }
            
            update() {
                this.x -= gameSpeed;
                this.rotation += 0.1;
                this.floatOffset += 0.05;
                
                // Floating animation
                this.y += Math.sin(this.floatOffset) * 2;
                
                // Magnetic effect if power mode is active
                if (powerMode) {
                    const dx = player.x + player.width / 2 - this.x;
                    const dy = player.y + player.height / 2 - this.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < 200) {
                        this.x += dx * 0.1;
                        this.y += dy * 0.1;
                    }
                }
            }
            
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                // Glow effect
                if (this.type === 'power') {
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 20;
                }
                
                // Outer ring
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                ctx.fill();
                
                // Inner part
                ctx.fillStyle = this.type === 'power' ? '#ffff00' : '#ffffff';
                ctx.beginPath();
                ctx.arc(0, 0, this.size * 0.7, 0, Math.PI * 2);
                ctx.fill();
                
                // Icon
                ctx.fillStyle = '#000000';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.type === 'power' ? '⚡' : '$', 0, 0);
                
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color, velocityX, velocityY, size, life) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.velocityX = velocityX;
                this.velocityY = velocityY;
                this.size = size;
                this.life = life;
                this.maxLife = life;
                this.gravity = 0.1;
                this.decay = 0.02;
            }
            
            update() {
                this.x += this.velocityX;
                this.y += this.velocityY;
                this.velocityY += this.gravity;
                this.life -= this.decay;
                this.size *= 0.95;
            }
            
            draw() {
                ctx.save();
                ctx.globalAlpha = this.life / this.maxLife;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

            setTimeout(() => powerMsg.style.display = 'none', 2000);

            for (let i = 0; i < 50; i++) {

                const speed = 3 + Math.random() * 4;
                particles.push(new Particle(
                    player.x + player.width / 2,
                    player.y + player.height / 2,
                    type === 'ironman' ? '#ff0000' : 
                    type === 'thor' ? '#ffff00' : 
                    type === 'hulk' ? '#00ff00' : '#0000ff',
                    Math.cos(angle) * speed,
                    Math.sin(angle) * speed,
                    4 + Math.random() * 3,
                    1.5
                ));
            }
        }

        function checkCollision(rect1, rect2) {
            const padding = 5;
            return rect1.x + padding < rect2.x + rect2.width - padding &&
                   rect1.x + rect1.width - padding > rect2.x + padding &&
                   rect1.y + padding < rect2.y + rect2.height - padding &&
                   rect1.y + rect1.height - padding > rect2.y + padding;
        }

        function updateGame() {
            frames++;
            
            // Update background
            backgroundLayers.forEach(layer => {
                layer.x -= layer.speed * (gameSpeed / 6);
                if (layer.x < -canvas.width) layer.x = 0;
            });
            
            // Update power mode
            if (powerMode) {
                powerTimer--;
                if (powerTimer <= 0) {
                    powerMode = null;
                    canvas.classList.remove('ironman-active', 'thor-active', 'hulk-active', 'spiderman-active');
                    document.getElementById('powerIndicator').style.display = 'none';
                } else {
                    document.getElementById('powerBarFill').style.width = `${(powerTimer / 300) * 100}%`;
                }
            }
            
            // Update invincibility
            if (player.invincible) {
                player.invincibleTimer--;
                if (player.invincibleTimer <= 0) {
                    player.invincible = false;
                }
            }
            
            // Physics
            player.velocityY += 0.8; // Gravity
            player.y += player.velocityY;
            player.x += player.slideSpeed;
            
            // Keep player on screen
            player.x = Math.max(10, Math.min(canvas.width - player.width - 10, player.x));
            
            // Ground collision
            const groundLevel = canvas.height - 80;
            if (player.y + player.height > groundLevel) {
                player.y = groundLevel - player.height;
                player.velocityY = 0;
                player.grounded = true;
                player.rotationSpeed *= 0.9;
                
                // Landing particles
                if (!player.grounded) {
                    for (let i = 0; i < 15; i++) {
                        particles.push(new Particle(
                            player.x + player.width / 2,
                            groundLevel,
                            '#ff9900',
                            (Math.random() - 0.5) * 8,
                            -Math.random() * 4,
                            2 + Math.random() * 3,
                            1
                        ));
                    }
                }
            } else {
                player.grounded = false;
            }
            
            // Rotation
            player.rotation += player.rotationSpeed;
            player.rotationSpeed *= 0.95;
            
            // Trail effect
            if (frames % 3 === 0) {
                trails.push({
                    x: player.x,
                    y: player.y,
                    rotation: player.rotation,
                    alpha: 0.5,
                    size: player.width * 0.8
                });
            }
            
            trails.forEach(trail => {
                trail.alpha -= 0.02;
                trail.size *= 0.95;
            });
            trails = trails.filter(trail => trail.alpha > 0);
            
            // Spawn obstacles
            if (frames % Math.max(60, 120 - Math.floor(score / 1000)) === 0) {
                obstacles.push(new Obstacle());
            }
            
            // Spawn coins
            if (frames % 45 === 0) {
                coins.push(new Coin());
            }
            
            // Update obstacles
            obstacles.forEach(obstacle => {
                obstacle.update();
                obstacle.speed = gameSpeed;
                
                // Check collision with player
                if (checkCollision(player, obstacle)) {
                    if (powerMode) {
                        // Destroy obstacle with power
                        obstacle.x = -1000; // Remove it
                        score += 100;
                        
                        // Explosion particles
                        for (let i = 0; i < 20; i++) {
                            particles.push(new Particle(
                                obstacle.x + obstacle.width / 2,
                                obstacle.y + obstacle.height / 2,
                                obstacle.color,
                                (Math.random() - 0.5) * 10,
                                (Math.random() - 0.5) * 10,
                                4 + Math.random() * 3,
                                1
                            ));
                        }
                        
                        floatingTexts.push({
                            text: '+100',
                            x: obstacle.x,
                            y: obstacle.y,
                            color: '#ffff00',
                            size: 20,
                            life: 1,
                            velocityY: -2
                        });
                        
                    } else if (!player.invincible) {
                        hitPlayer();
                    }
                }
            });
            
            // Remove off-screen obstacles
            obstacles = obstacles.filter(obstacle => obstacle.x > -100);
            
            // Update coins
            coins.forEach(coin => {
                coin.update();
                
                // Check collection
                const dx = player.x + player.width / 2 - coin.x;
                const dy = player.y + player.height / 2 - coin.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < 25) {
                    coin.x = -1000; // Remove it
                    
                    if (coin.type === 'power') {
                        sessionCoins += 5;
                        score += 500;
                        activatePower(['ironman', 'thor', 'hulk', 'spiderman'][Math.floor(Math.random() * 4)]);
                    } else {
                        sessionCoins++;
                        score += 100;
                    }
                    
                    playSound('coin');
                    
                    // Collection particles
                    for (let i = 0; i < 10; i++) {
                        particles.push(new Particle(
                            coin.x,
                            coin.y,
                            coin.color,
                            (Math.random() - 0.5) * 4,
                            -Math.random() * 3,
                            2 + Math.random() * 2,
                            1
                        ));
                    }
                    
                    floatingTexts.push({
                        text: coin.type === 'power' ? '+500 ⚡' : '+100',
                        x: coin.x,
                        y: coin.y,
                        color: coin.color,
                        size: 16,
                        life: 1,
                        velocityY: -1.5
                    });
                }
            });
            
            // Remove off-screen coins
            coins = coins.filter(coin => coin.x > -50);
            
            // Update particles
            particles.forEach(particle => particle.update());
            particles = particles.filter(particle => particle.life > 0);
            
            // Update floating texts
            floatingTexts.forEach(text => {
                text.y += text.velocityY;
                text.life -= 0.02;
            });
            floatingTexts = floatingTexts.filter(text => text.life > 0);
            
            // Increase difficulty
            if (frames % 600 === 0) {
                gameSpeed = Math.min(15, gameSpeed + 0.5);
            }
            
            // Update score
            score += gameSpeed * 0.1;
            
            // Update UI
            document.getElementById('score').innerText = Math.floor(score);
            document.getElementById('coinsDisplay').innerText = sessionCoins;
            document.getElementById('livesDisplay').innerText = lives;
            
            // Update combo counter
            if (currentCombo > 1) {
                document.getElementById('comboCounter').style.display = 'block';
                document.getElementById('comboValue').innerText = currentCombo;
            } else {
                document.getElementById('comboCounter').style.display = 'none';
            }
        }

        function hitPlayer() {
            if (player.invincible) return;
            
            lives--;
            playSound('powerup');
            canvas.classList.add('shake');
            setTimeout(() => canvas.classList.remove('shake'), 500);
            
            player.invincible = true;
            player.invincibleTimer = 60;
            
            // Hit particles
            for (let i = 0; i < 30; i++) {
                particles.push(new Particle(
                    player.x + player.width / 2,
                    player.y + player.height / 2,
                    '#ff0000',
                    (Math.random() - 0.5) * 8,
                    (Math.random() - 0.5) * 8,
                    3 + Math.random() * 3,
                    1
                ));
            }
            
            // Reset combo
            if (currentCombo > 1) {
                floatingTexts.push({
                    text: `COMBO BROKEN!`,
                    x: player.x,
                    y: player.y - 50,
                    color: '#ff0000',
                    size: 24,
                    life: 1,
                    velocityY: -2
                });
            }
            currentCombo = 0;
            
            // Damage message
            const damageMsg = document.getElementById('damageMsg');
            damageMsg.style.display = 'block';
            setTimeout(() => damageMsg.style.display = 'none', 1000);
            
            if (lives <= 0) {
                gameOver();
            }
        }

        function gameOver() {
            gameRunning = false;
            
            document.getElementById('finalScore').innerText = Math.floor(score);
            document.getElementById('earnedCoins').innerText = sessionCoins;
            document.getElementById('gameOver').style.display = 'block';
            document.getElementById('jumpButton').style.display = 'none';
            document.getElementById('mobileControls').style.display = 'none';
            
            // Save score
            if (currentUser && sb && currentUser.id !== 'offline') {
                try {
                    const newBest = Math.max(currentUser.best_score || 0, Math.floor(score));
                    sb.from('leo_players')
                        .update({ 
                            coins: (currentUser.coins || 0) + sessionCoins,
                            best_score: newBest 
                        })
                        .eq('id', currentUser.id);
                } catch (e) {
                    console.error("Save error:", e);
                }
            }
            
            // Game over explosion
            for (let i = 0; i < 100; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 8;
                particles.push(new Particle(
                    player.x + player.width / 2,
                    player.y + player.height / 2,
                    ['#ff0000', '#ff9900', '#ffff00'][Math.floor(Math.random() * 3)],
                    Math.cos(angle) * speed,
                    Math.sin(angle) * speed,
                    5 + Math.random() * 5,
                    2
                ));
            }
        }

        // ================= RENDERING =================
        function drawPlayer() {
            const skin = SKINS[currentUser?.current_skin || 'ironman'];
            
            ctx.save();
            ctx.translate(player.x + player.width / 2, player.y + player.height / 2);
            
            // Draw trail
            trails.forEach(trail => {
                ctx.save();
                ctx.translate(trail.x + player.width / 2 - player.x - player.width / 2, 
                            trail.y + player.height / 2 - player.y - player.height / 2);
                ctx.rotate(trail.rotation);
                ctx.globalAlpha = trail.alpha;
                
                // Trail body
                const trailGradient = ctx.createRadialGradient(
                    0, 0, 0,
                    0, 0, trail.size / 2
                );
                trailGradient.addColorStop(0, skin.colors.primary + '80');
                trailGradient.addColorStop(1, 'transparent');
                
                ctx.fillStyle = trailGradient;
                ctx.fillRect(-trail.size / 2, -trail.size / 2, trail.size, trail.size);
                
                ctx.restore();
            });
            
            // Apply invincibility blink
            if (player.invincible && Math.floor(frames / 3) % 2 === 0) {
                ctx.globalAlpha = 0.5;
            }
            
            // Rotate player
            ctx.rotate(player.rotation);
            
            // Shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(-player.width / 2 + 3, -player.height / 2 + 3, player.width, player.height);
            
            // Main body with gradient
            const bodyGradient = ctx.createLinearGradient(
                -player.width / 2, -player.height / 2,
                player.width / 2, player.height / 2
            );
            bodyGradient.addColorStop(0, skin.colors.primary);
            bodyGradient.addColorStop(0.5, skin.colors.secondary);
            bodyGradient.addColorStop(1, skin.colors.primary);
            
            ctx.fillStyle = bodyGradient;
            
            // Draw based on skin
            if (currentUser?.current_skin === 'ironman') {
                // Iron Man suit
                ctx.fillRect(-player.width / 2, -player.height / 2, player.width, player.height);
                
                // Arc reactor
                ctx.fillStyle = skin.effects.arc;
                ctx.beginPath();
                ctx.arc(0, 0, 5, 0, Math.PI * 2);
                ctx.fill();
                
                // Armor details
                ctx.strokeStyle = skin.colors.metal;
                ctx.lineWidth = 2;
                ctx.strokeRect(-player.width / 2, -player.height / 2, player.width, player.height);
                
            } else if (currentUser?.current_skin === 'captain') {
                // Captain America
                ctx.fillRect(-player.width / 2, -player.height / 2, player.width, player.height);
                
                // Star
                ctx.fillStyle = skin.effects.star;
                ctx.beginPath();
                ctx.moveTo(0, -5);
                for (let i = 0; i < 5; i++) {
                    const angle = (i * Math.PI * 2) / 5;
                    const spike = 5;
                    const dent = 2;
                    
                    ctx.lineTo(Math.cos(angle) * spike, Math.sin(angle) * spike);
                    ctx.lineTo(Math.cos(angle + Math.PI / 5) * dent, Math.sin(angle + Math.PI / 5) * dent);
                }
                ctx.closePath();
                ctx.fill();
                
            } else {
                // Default cube
                ctx.fillRect(-player.width / 2, -player.height / 2, player.width, player.height);
                
                // Face
                ctx.fillStyle = skin.colors.accent;
                ctx.fillRect(-5, -8, 10, 4); // Eyes
                ctx.fillRect(-3, 5, 6, 3); // Mouth
            }
            
            // Power effects
            if (powerMode) {
                ctx.strokeStyle = powerMode === 'ironman' ? '#ff0000' :
                                powerMode === 'thor' ? '#ffff00' :
                                powerMode === 'hulk' ? '#00ff00' : '#0000ff';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, player.width / 2 + 5, 0, Math.PI * 2);
                ctx.stroke();
                
                // Energy particles
                for (let i = 0; i < 3; i++) {
                    const angle = frames * 0.1 + (i * Math.PI * 2 / 3);
                    const radius = player.width / 2 + 10;
                    ctx.fillStyle = ctx.strokeStyle;
                    ctx.beginPath();
                    ctx.arc(
                        Math.cos(angle) * radius,
                        Math.sin(angle) * radius,
                        3,
                        0,
                        Math.PI * 2
                    );
                    ctx.fill();
                }
            }
            
            ctx.restore();
        }

        function drawGround() {
            // Road surface
            const roadGradient = ctx.createLinearGradient(0, canvas.height - 80, 0, canvas.height);
            roadGradient.addColorStop(0, '#333344');
            roadGradient.addColorStop(0.5, '#222233');
            roadGradient.addColorStop(1, '#111122');
            
            ctx.fillStyle = roadGradient;
            ctx.fillRect(0, canvas.height - 80, canvas.width, 80);
            
            // Road lines
            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 3;
            ctx.setLineDash([20, 30]);
            ctx.lineDashOffset = -frames * 2;
            
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - 40);
            ctx.lineTo(canvas.width, canvas.height - 40);
            ctx.stroke();
            
            ctx.setLineDash([]);
            
            // Road edges
            ctx.strokeStyle = '#ff4500';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - 80);
            ctx.lineTo(canvas.width, canvas.height - 80);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(0, canvas.height);
            ctx.lineTo(canvas.width, canvas.height);
            ctx.stroke();
        }

        function drawGame() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw background layers
            backgroundLayers.forEach(layer => layer.draw());
            
            // Draw ground
            drawGround();
            
            // Draw obstacles
            obstacles.forEach(obstacle => obstacle.draw());
            
            // Draw coins
            coins.forEach(coin => coin.draw());
            
            // Draw particles
            particles.forEach(particle => particle.draw());
            
            // Draw player
            drawPlayer();
            
            // Draw floating texts
            floatingTexts.forEach(text => {
                ctx.save();
                ctx.globalAlpha = text.life;
                ctx.fillStyle = text.color;
                ctx.font = `bold ${text.size}px 'Bebas Neue', sans-serif`;
                ctx.textAlign = 'center';
                ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                ctx.shadowBlur = 10;
                ctx.fillText(text.text, text.x, text.y);
                ctx.restore();
            });
        }

        // ================= GAME LOOP =================
        function gameLoop() {
            if (!gameRunning) return;
            
            updateGame();
            drawGame();
            
            requestAnimationFrame(gameLoop);
        }

        function resetGame() {
            // Reset player
            player.x = 150;
            player.y = canvas.height - 150;
            player.velocityY = 0;
            player.velocityX = 0;
            player.rotation = 0;
            player.rotationSpeed = 0;
            player.grounded = true;
            player.invincible = false;
            player.invincibleTimer = 0;
            player.slideSpeed = 0;
            
            // Reset game state
            frames = 0;
            score = 0;
            sessionCoins = 0;
            lives = 3;
            gameSpeed = 6;
            currentCombo = 0;
            
            // Clear arrays
            obstacles = [];
            coins = [];
            particles = [];
            trails = [];
            floatingTexts = [];
            
            // Reset power mode
            powerMode = null;
            powerTimer = 0;
            canvas.classList.remove('ironman-active', 'thor-active', 'hulk-active', 'spiderman-active');
            
            // Reset UI
            document.getElementById('gameOver').style.display = 'none';
            document.getElementById('jumpButton').style.display = 'flex';
            document.getElementById('powerIndicator').style.display = 'none';
            
            if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
                document.getElementById('mobileControls').style.display = 'flex';
            }
            
            // Start game
            gameRunning = true;
            requestAnimationFrame(gameLoop);
        }

        // ================= EVENT LISTENERS =================
        window.addEventListener('keydown', (e) => {
            if (!gameRunning) return;
            
            switch(e.code) {
                case 'Space':
                case 'ArrowUp':
                case 'KeyW':
                    e.preventDefault();
                    jump();
                    break;
                    
                case 'ArrowLeft':
                case 'KeyA':
                    slideLeft();
                    break;
                    
                case 'ArrowRight':
                case 'KeyD':
                    slideRight();
                    break;
            }
        });

        window.addEventListener('keyup', (e) => {
            switch(e.code) {
                case 'ArrowLeft':
                case 'ArrowRight':
                case 'KeyA':
                case 'KeyD':
                    stopSlide();
                    break;
            }
        });

        // Prevent default touch behavior
        document.addEventListener('touchstart', (e) => {
            if (e.target === canvas || e.target.id === 'jumpButton') {
                e.preventDefault();
            }
        }, { passive: false });

        document.addEventListener('touchmove', (e) => {
            if (e.target === canvas) {
                e.preventDefault();
            }
        }, { passive: false });

        // Window resize handler
        window.addEventListener('resize', () => {
            const oldWidth = canvas.width;
            const oldHeight = canvas.height;
            
            canvas.width = Math.min(1200, window.innerWidth * 0.95);
            canvas.height = Math.min(600, window.innerHeight * 0.85);
            
            // Scale player position
            if (oldWidth > 0 && oldHeight > 0) {
                player.x = (player.x / oldWidth) * canvas.width;
                player.y = (player.y / oldHeight) * canvas.height;
            }
            
            initBackground();
        });

        // Initialize on load
        window.onload = () => {
            document.getElementById('loginOverlay').style.display = 'flex';
        };
    </script>
</body>
</html>
