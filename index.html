<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LEO GAME - Hardcore</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #222;
            font-family: 'Verdana', sans-serif;
            color: white;
            overflow: hidden;
            user-select: none; /* Impedisce la selezione del testo */
        }

        canvas {
            border: 4px solid #fff;
            background: linear-gradient(to bottom, #333, #111);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            max-width: 100%;
            max-height: 100%;
        }

        #ui {
            position: absolute;
            top: 20px;
            text-align: center;
            width: 100%;
            pointer-events: none;
            z-index: 5;
        }

        h1 { 
            margin: 0; 
            text-shadow: 3px 3px 0 #000; 
            font-size: 40px; 
            color: #ffcc00; /* Oro per Leo Game */
        }
        
        p { margin: 5px 0; font-size: 14px; opacity: 0.8; }

        /* Schermata Game Over */
        #gameOver {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 30px;
            border: 4px solid #ffcc00;
            border-radius: 15px;
            text-align: center;
            z-index: 10;
            min-width: 300px;
        }

        button.retry-btn {
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 20px;
            cursor: pointer;
            background: #ffcc00;
            color: #000;
            border: none;
            font-family: inherit;
            font-weight: bold;
            border-radius: 8px;
            transition: transform 0.1s;
        }
        button.retry-btn:active { transform: scale(0.95); }

        /* Bottone Salto (Mobile) */
        #jumpButton {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 80px;
            height: 80px;
            background-color: rgba(255, 165, 0, 0.8);
            border: 4px solid white;
            border-radius: 50%;
            font-size: 14px;
            font-weight: bold;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 20;
            -webkit-tap-highlight-color: transparent;
        }
        #jumpButton:active {
            background-color: rgba(255, 69, 0, 0.9);
            transform: scale(0.9);
        }

        /* Tabella Classifica */
        .leaderboard-container {
            margin-top: 20px;
            text-align: left;
            color: white;
        }
        .leaderboard-container h3 {
            border-bottom: 1px solid #555;
            padding-bottom: 5px;
            color: #ffcc00;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        li {
            padding: 5px 0;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
        }
        li span:first-child { font-weight: bold; color: #aaa; } /* Posizione */
        li span:last-child { color: #fff; } /* Punteggio */

    </style>
</head>
<body>

    <div id="ui">
        <h1>LEO GAME</h1>
        <h2 id="score" style="color: white;">Punti: 0</h2>
    </div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <div id="jumpButton">SALTA</div>

    <div id="gameOver">
        <h1 style="color:red">SEI MORTO!</h1>
        <p style="font-size: 18px;">Il tuo punteggio: <strong id="finalScore" style="color:white">0</strong></p>
        
        <div class="leaderboard-container">
            <h3>🏆 TOP 5 SCORE</h3>
            <ul id="highScoresList">
                </ul>
        </div>

        <button class="retry-btn" onclick="resetGame()">GIOCA ANCORA</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const finalScoreEl = document.getElementById('finalScore');
        const gameOverScreen = document.getElementById('gameOver');
        const highScoresList = document.getElementById('highScoresList');
        const jumpBtn = document.getElementById('jumpButton');

        // Variabili di Gioco
        let gameRunning = false;
        let frames = 0;
        let score = 0;
        let gameSpeed = 5;
        let obstacles = [];
        const GRAVITY = 0.6;

        // Giocatore
        const player = {
            x: 50,
            y: 300,
            width: 30,
            height: 30,
            dy: 0,
            jumpForce: 12,
            grounded: false,
            color: '#00ff00'
        };

        // Gestione Classifica (LocalStorage)
        function updateLeaderboard(newScore) {
            // Recupera punteggi salvati o crea array vuoto
            let scores = JSON.parse(localStorage.getItem('leoGameScores')) || [];
            
            // Aggiungi nuovo punteggio
            scores.push(Math.floor(newScore));
            
            // Ordina dal più alto al più basso
            scores.sort((a, b) => b - a);
            
            // Tieni solo i top 5
            scores = scores.slice(0, 5);
            
            // Salva di nuovo
            localStorage.setItem('leoGameScores', JSON.stringify(scores));
            
            // Disegna la tabella
            renderLeaderboard(scores);
        }

        function renderLeaderboard(scores) {
            highScoresList.innerHTML = ""; // Pulisci lista
            scores.forEach((s, index) => {
                let li = document.createElement('li');
                let medal = index === 0 ? "🥇" : (index === 1 ? "🥈" : (index === 2 ? "🥉" : `#${index + 1}`));
                li.innerHTML = `<span>${medal}</span> <span>${s}</span>`;
                highScoresList.appendChild(li);
            });
        }

        // Ostacoli
        class Obstacle {
            constructor() {
                this.width = 30 + Math.random() * 20;
                this.x = canvas.width;
                this.markedForDeletion = false;
                
                const type = Math.random();

                if (type < 0.5) { 
                    // Terra
                    this.type = 'ground';
                    this.height = 30 + Math.random() * 30;
                    this.y = canvas.height - this.height;
                    this.color = '#ff4444'; 
                    this.dy = 0;
                } else if (type < 0.8) { 
                    // Aria
                    this.type = 'air';
                    this.height = 30;
                    this.y = canvas.height - 110; 
                    this.color = '#4488ff'; 
                    this.dy = 0;
                } else {
                    // Mobile
                    this.type = 'moving';
                    this.height = 40;
                    this.y = canvas.height - 50;
                    this.color = '#bf44ff'; 
                    this.dy = Math.random() < 0.5 ? 2 : -2;
                    this.minY = canvas.height - 150;
                    this.maxY = canvas.height - 40;
                }
            }

            update() {
                this.x -= gameSpeed;
                if (this.type === 'moving') {
                    this.y += this.dy;
                    if (this.y < this.minY || this.y > this.maxY) this.dy *= -1;
                }
                if (this.x + this.width < 0) this.markedForDeletion = true;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.strokeStyle = "white";
                ctx.lineWidth = 2;
                ctx.strokeRect(this.x, this.y, this.width, this.height);
            }
        }

        // Input
        function jump() {
            if (player.grounded) {
                player.dy = -player.jumpForce;
                player.grounded = false;
            }
        }

        // Eventi Tastiera
        window.addEventListener('keydown', e => {
            if (e.code === 'Space' || e.code === 'ArrowUp') jump();
            if (!gameRunning && e.code === 'KeyR') resetGame();
        });

        // Eventi Touch/Mouse sul bottone
        jumpBtn.addEventListener('mousedown', (e) => { e.preventDefault(); jump(); });
        jumpBtn.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); });
        
        // Eventi Touch sul canvas (opzionale, se si vuole saltare toccando ovunque)
        canvas.addEventListener('touchstart', (e) => {
             // Se non si tocca il bottone, salta comunque (opzionale)
             if(e.target !== jumpBtn) { e.preventDefault(); jump(); }
        });

        function updatePlayer() {
            player.dy += GRAVITY;
            player.y += player.dy;

            if (player.y + player.height > canvas.height) {
                player.y = canvas.height - player.height;
                player.dy = 0;
                player.grounded = true;
            } else {
                player.grounded = false;
            }
        }

        function drawPlayer() {
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillStyle = "black"; // Occhio
            ctx.fillRect(player.x + 20, player.y + 5, 5, 5);
        }

        function handleObstacles() {
            let spawnRate = Math.max(50, 120 - Math.floor(gameSpeed * 5)); 
            if (frames % spawnRate === 0 && Math.random() > 0.1) {
                obstacles.push(new Obstacle());
            }

            for (let i = 0; i < obstacles.length; i++) {
                let o = obstacles[i];
                o.update();
                o.draw();

                // Collisione
                if (
                    player.x < o.x + o.width &&
                    player.x + player.width > o.x &&
                    player.y < o.y + o.height &&
                    player.y + player.height > o.y
                ) {
                    endGame();
                }
            }
            obstacles = obstacles.filter(o => !o.markedForDeletion);
        }

        function endGame() {
            gameRunning = false;
            finalScoreEl.innerText = Math.floor(score);
            updateLeaderboard(score); // Salva e aggiorna classifica
            gameOverScreen.style.display = 'block';
            jumpBtn.style.display = 'none'; // Nascondi bottone salto
        }

        function resetGame() {
            player.y = 300;
            player.dy = 0;
            obstacles = [];
            score = 0;
            frames = 0;
            gameSpeed = 5;
            gameRunning = true;
            gameOverScreen.style.display = 'none';
            jumpBtn.style.display = 'flex'; // Mostra bottone salto
            scoreEl.innerText = "Punti: 0";
            requestAnimationFrame(animate);
        }

        function animate() {
            if (!gameRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Linea Suolo
            ctx.strokeStyle = "white";
            ctx.beginPath();
            ctx.moveTo(0, canvas.height);
            ctx.lineTo(canvas.width, canvas.height);
            ctx.stroke();

            updatePlayer();
            drawPlayer();
            handleObstacles();

            frames++;
            score += 0.1;
            scoreEl.innerText = "Punti: " + Math.floor(score);

            if (frames % 500 === 0) gameSpeed += 0.5;

            requestAnimationFrame(animate);
        }

        // Mostra la classifica iniziale (anche se vuota) al caricamento per test
        // ma non avvia il gioco finché non si preme o si chiama resetGame
        // Qui avviamo subito il gioco
        resetGame();

    </script>
</body>
</html>
