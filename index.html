<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LEO GAME - STABLE EDITION</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
            background-color: #050505;
            font-family: 'Verdana', sans-serif;
            color: white;
            overflow: hidden;
            user-select: none; -webkit-user-select: none; touch-action: none;
        }

        /* Scanline Effect */
        body::after {
            content: " "; display: block; position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px; z-index: 2; pointer-events: none;
        }

        canvas {
            border: 3px solid #333;
            background: #111;
            box-shadow: 0 0 40px rgba(0, 200, 255, 0.15); 
            max-width: 100%; max-height: 100%;
            transition: background 1s ease, border-color 0.5s ease;
        }
        
        canvas.fire-sky { background: linear-gradient(to bottom, #ff3300, #4a0000) !important; border-color: #ff3300 !important; box-shadow: 0 0 60px #ff0000 !important; }
        canvas.shield-sky { animation: strobe 0.2s infinite; border-color: #00ffff !important; box-shadow: 0 0 50px #00ffff !important; }

        @keyframes strobe { 0% { background: #001133; } 50% { background: #003366; } 100% { background: #001133; } }

        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-5px, 0, 0); }
            20%, 80% { transform: translate3d(8px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-10px, 0, 0); }
            40%, 60% { transform: translate3d(10px, 0, 0); }
        }

        #ui { position: absolute; top: 10px; width: 100%; pointer-events: none; z-index: 5; display:flex; justify-content:space-between; padding: 0 20px; box-sizing: border-box;}
        .hud-left, .hud-right { text-align: left; }
        .hud-right { text-align: right; }

        h1 { font-family: 'Press Start 2P'; font-size: 20px; margin: 0; background: -webkit-linear-gradient(#00dbde, #fc00ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .stat-box { font-family: 'Press Start 2P'; font-size: 12px; margin-top: 8px; color: #fff; text-shadow: 2px 2px 0 #000; }

        #damageMsg, #powerMsg {
            display: none; position: absolute; left: 50%; transform: translate(-50%, -50%);
            font-family: 'Press Start 2P'; z-index: 15; text-shadow: 3px 3px 0 #000; pointer-events: none; text-align: center; width: 100%;
        }
        #damageMsg { top: 30%; color: red; font-size: 20px; animation: fadeUp 1s forwards; }
        #powerMsg { top: 40%; font-size: 25px; animation: pulse 0.3s infinite alternate; }

        @keyframes fadeUp { from { opacity: 1; top: 30%; } to { opacity: 0; top: 20%; } }
        @keyframes pulse { from { transform: translate(-50%, -50%) scale(1); } to { transform: translate(-50%, -50%) scale(1.1); } }

        #loginOverlay, #shopOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(5px);
        }
        #shopOverlay { display: none; z-index: 110; }

        .login-box, .shop-box {
            background: #151515; padding: 25px; border: 2px solid #00dbde; border-radius: 10px; text-align: center; width: 350px; box-shadow: 0 0 40px rgba(0, 219, 222, 0.2);
            max-height: 90vh; overflow-y: auto;
        }

        input { width: 85%; padding: 10px; margin: 10px 0; border: 1px solid #444; background: #000; color: #00dbde; font-family: 'Verdana'; font-weight: bold; text-align: center; outline: none; }
        
        button.main-btn {
            width: 100%; padding: 12px; background: linear-gradient(90deg, #00dbde, #fc00ff);
            color: white; font-family: 'Press Start 2P'; font-size: 12px; border: none; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 15px rgba(252, 0, 255, 0.4);
        }
        button.main-btn:active { transform: scale(0.95); }
        button.shop-btn { background: #ffd700; color: black; box-shadow: 0 0 15px rgba(255, 215, 0, 0.4); }

        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .skin-card { background: #222; border: 1px solid #444; padding: 10px; border-radius: 5px; }
        .skin-card.owned { border-color: #00ff00; }
        .skin-card.equipped { border-color: #ffd700; box-shadow: 0 0 10px #ffd700; }
        
        .skin-preview { width: 40px; height: 40px; margin: 0 auto 10px auto; display: block; border-radius: 4px; }
        .skin-name { font-size: 10px; color: #fff; font-weight: bold; display: block; }
        .buy-btn { width: 100%; padding: 5px; margin-top: 5px; font-size: 10px; cursor: pointer; border: none; font-weight: bold; }

        /* CLASSIFICA STYLES */
        .leaderboard-container { margin-top: 15px; border-top: 1px dashed #444; padding-top: 10px; width: 100%; }
        .leaderboard-container h4 { color: #ffd700; font-size: 12px; margin-bottom: 10px; font-family: 'Press Start 2P'; }
        
        ul.ranking-list { list-style: none; padding: 0; margin: 0; } 
        li.ranking-item { 
            padding: 8px 0; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; font-size: 10px; color:white; 
        }
        .leader-rank-area { display: flex; align-items: center; }
        .leader-skin-icon {
            width: 12px; height: 12px; display: inline-block; margin-right: 8px; margin-left: 8px;
            border: 1px solid rgba(255,255,255,0.3); border-radius: 2px;
        }

        #gameOver { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(15, 15, 15, 0.98); padding: 30px; border: 2px solid #ff0055; border-radius: 15px; text-align: center; z-index: 10; min-width: 350px; }
        #jumpButton { display: none; position: absolute; bottom: 30px; right: 30px; width: 90px; height: 90px; background: rgba(255, 255, 255, 0.1); border: 2px solid #00dbde; border-radius: 50%; color: #00dbde; display: flex; justify-content: center; align-items: center; font-family: 'Press Start 2P'; font-size: 10px; cursor: pointer; z-index: 20; }

    </style>
</head>
<body>

    <div id="ui">
        <div class="hud-left">
            <h1>LEO GAME</h1>
            <div class="stat-box">PLAYER: <span id="currentPlayerDisplay" style="color:#00dbde;">---</span></div>
            <div class="stat-box" style="color:#ffd700;">BANK: <span id="bankDisplay">0</span> $</div>
        </div>
        <div class="hud-right">
            <div class="stat-box">SCORE: <span id="score">0</span></div>
            <div class="stat-box">❤️ <span id="livesDisplay">1</span></div>
            <div class="stat-box">💎 <span id="coinsDisplay">0</span></div>
        </div>
    </div>

    <div id="damageMsg">-1 VITA!</div>
    <div id="powerMsg">POWER UP!</div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <div id="jumpButton" onmousedown="handleInput(event)" ontouchstart="handleInput(event)">JUMP</div>

    <div id="loginOverlay">
        <div class="login-box">
            <h2 style="color: #fff; font-family:'Press Start 2P'; font-size:16px;">LOGIN</h2>
            
            <input type="text" id="loginUser" placeholder="NOME UTENTE">
            <input type="password" id="loginPass" placeholder="PASSWORD">
            <button class="main-btn" onclick="attemptLogin()">GIOCA ONLINE</button>
            <button class="main-btn" style="background:#555; margin-top:5px;" onclick="playOffline()">GIOCA OFFLINE (OSPITE)</button>
            
            <p id="loginMsg" style="color:#ff0055; font-size:10px; height:15px; margin-top:5px;"></p>
            
            <div style="margin-top:10px; padding-top:5px;">
                <button class="main-btn" style="background:#333; box-shadow:none; font-size:10px; padding:8px;" onclick="registerUser()">REGISTRATI NEL DB</button>
            </div>

            <div class="leaderboard-container">
                <h4>TOP 5 GLOBAL</h4>
                <ul id="preGameLeaderboard" class="ranking-list">
                    <li class="ranking-item" style="color:#666; justify-content:center;">Caricamento...</li>
                </ul>
            </div>
        </div>
    </div>

    <div id="shopOverlay">
        <div class="shop-box">
            <h2 style="color: #ffd700; font-family:'Press Start 2P'; font-size:16px;">SKIN STORE</h2>
            <div class="stat-box">I TUOI SOLDI: <span id="shopBankDisplay">0</span> $</div>
            <div class="shop-grid" id="skinGrid"></div>
            <button class="main-btn" onclick="closeShop()">CHIUDI NEGOZIO</button>
        </div>
    </div>

    <div id="gameOver">
        <h1 style="color:#ff0055; font-size: 24px;">GAME OVER</h1>
        <p style="font-size: 16px;">SCORE: <strong id="finalScore" style="color:#fff">0</strong></p>
        <p style="font-size: 12px; color:#ffd700;">GUADAGNATO: +<span id="earnedCoins">0</span> $</p>
        
        <div class="leaderboard-container" style="background:#111; padding:10px; border-radius:5px;">
            <h4>TOP 5 GLOBAL</h4>
            <ul id="highScoresList" class="ranking-list">
                <li class="ranking-item" style="color:#666; justify-content:center;">Caricamento...</li>
            </ul>
        </div>

        <button class="main-btn" onclick="resetGame()">RITENTA</button>
        <button class="main-btn shop-btn" onclick="openShop()">NEGOZIO SKIN</button>
    </div>

    <script>
        // --- CONFIGURAZIONE SUPABASE ---
        // INSERISCI QUI LE TUE CHIAVI!
        const SUPABASE_URL = 'https://jcylyutlybmbjrgghpzm.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpjeWx5dXRseWJtYmpyZ2docHptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA0NTc4NTYsImV4cCI6MjA4NjAzMzg1Nn0.X9xwESmsRJurzGODAb6V0x4QA_YODtKbATooYcC39Ew';

        let sb = null;
        try { 
            if(!SUPABASE_URL.includes('INSERISCI')) {
                sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }
        } catch(e){ console.error("Supabase Init Error:", e); }

        // --- ASSETS & CONFIG ---
        const SKINS = {
            'default': { name: 'NEON CORE', price: 0, css: 'linear-gradient(135deg, #00ff00, #003300)', top: '#00ff00', side: '#005500', front: '#00aa00' },
            'magma':   { name: 'MAGMA', price: 500, css: 'linear-gradient(135deg, #ffdd00, #ff0000)', top: '#ffcc00', side: '#990000', front: '#ff4400' },
            'ice':     { name: 'FROST', price: 1500, css: 'linear-gradient(135deg, #ffffff, #00ffff)', top: '#ffffff', side: '#0088aa', front: '#00ccff' },
            'ninja':   { name: 'STEALTH', price: 3000, css: 'linear-gradient(135deg, #333, #000)', top: '#333333', side: '#000000', front: '#1a1a1a' },
            'gold':    { name: 'GOLD', price: 10000, css: 'linear-gradient(135deg, #fff700, #ffaa00)', top: '#ffffaa', side: '#cc8800', front: '#ffcc00' },
            'matrix':  { name: 'HACKER', price: 50000, css: 'black; border:1px solid #0f0', top: '#003300', side: '#001100', front: '#00ff00' }
        };

        let currentUser = null; 
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // --- AUDIO ---
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'jump') { osc.frequency.setValueAtTime(150, now); osc.frequency.linearRampToValueAtTime(300, now + 0.1); gain.gain.setValueAtTime(0.05, now); osc.start(now); osc.stop(now + 0.1); }
            else if (type === 'coin') { osc.type = 'sine'; osc.frequency.setValueAtTime(1500, now); gain.gain.setValueAtTime(0.05, now); osc.start(now); osc.stop(now + 0.1); }
            else if (type === 'coin_epic') { osc.type = 'triangle'; osc.frequency.setValueAtTime(2000, now); osc.frequency.linearRampToValueAtTime(3000, now + 0.3); gain.gain.setValueAtTime(0.1, now); osc.start(now); osc.stop(now + 0.3); }
            else if (type === 'break') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(80, now); gain.gain.setValueAtTime(0.15, now); osc.start(now); osc.stop(now + 0.2); }
            else if (type === 'hit') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.linearRampToValueAtTime(50, now + 0.3); gain.gain.setValueAtTime(0.1, now); osc.start(now); osc.stop(now + 0.3); }
            else if (type === 'buy') { osc.type = 'square'; osc.frequency.setValueAtTime(400, now); osc.frequency.linearRampToValueAtTime(800, now + 0.2); gain.gain.setValueAtTime(0.1, now); osc.start(now); osc.stop(now + 0.2); }
            else if (type === 'splash') { osc.type = 'noise'; gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.4); osc.start(now); osc.stop(now + 0.4); } 
            else if (type === 'powerup') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, now); osc.frequency.linearRampToValueAtTime(800, now + 0.5); gain.gain.setValueAtTime(0.2, now); osc.start(now); osc.stop(now + 0.5); }
        }

        // --- DATABASE SAFEGUARD ---
        function playOffline() {
            currentUser = { username: "OSPITE", coins: 0, best_score: 0, inventory: 'default', current_skin: 'default', id: 'offline' };
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('currentPlayerDisplay').innerText = "OSPITE";
            document.getElementById('jumpButton').style.display = 'flex';
            resetGame();
        }

        async function registerUser() {
            if(!sb) return alert("DB non configurato!");
            const u = document.getElementById('regUser').value.trim();
            const p = document.getElementById('regPass').value.trim();
            const msg = document.getElementById('regMsg');
            if(!u || !p) { msg.innerText = "Dati mancanti"; msg.style.color = "red"; return; }
            
            const { error } = await sb.from('leo_players').insert([{ username: u, password: p, coins: 0, inventory: 'default', current_skin: 'default' }]);
            if(error) { msg.innerText = "Nome occupato!"; msg.style.color = "red"; }
            else { msg.innerText = "OK! Ora fai il Login"; msg.style.color = "#0f0"; document.getElementById('loginUser').value = u; }
        }

        async function attemptLogin() {
            if(!sb) return alert("DB non configurato!");
            const u = document.getElementById('loginUser').value.trim();
            const p = document.getElementById('loginPass').value.trim();
            const msg = document.getElementById('loginMsg'); msg.innerText = "Attendere...";
            
            try {
                const { data, error } = await sb.from('leo_players').select('*').eq('username', u).eq('password', p).single();
                if(error || !data) { msg.innerText = "Dati errati"; msg.style.color = "red"; }
                else {
                    currentUser = data;
                    if(!currentUser.inventory) currentUser.inventory = "default";
                    if(!currentUser.current_skin) currentUser.current_skin = "default";
                    if(currentUser.coins === null) currentUser.coins = 0;
                    
                    document.getElementById('loginOverlay').style.display = 'none';
                    document.getElementById('currentPlayerDisplay').innerText = currentUser.username.toUpperCase();
                    updateBankUI();
                    document.getElementById('jumpButton').style.display = 'flex';
                    resetGame();
                }
            } catch(err) { msg.innerText = "Errore rete"; }
        }

        async function saveGameData(scoreToAdd, coinsToAdd) {
            if(!currentUser) return;
            // Se ospite, salva solo in locale (volatile)
            currentUser.coins = (currentUser.coins || 0) + coinsToAdd;
            const newBest = Math.max(currentUser.best_score || 0, Math.floor(scoreToAdd));
            currentUser.best_score = newBest;
            updateBankUI();

            if(sb && currentUser.id !== 'offline') {
                try {
                    await sb.from('leo_players').update({ coins: currentUser.coins, best_score: newBest }).eq('id', currentUser.id);
                    renderLeaderboard();
                } catch(e) { console.error("Save Error", e); }
            }
        }

        async function renderLeaderboard() {
            const lists = [document.getElementById('highScoresList'), document.getElementById('preGameLeaderboard')];
            if(!sb) { lists.forEach(l => l.innerHTML = "<li class='ranking-item' style='color:#666'>Gioca Offline</li>"); return; }

            const { data, error } = await sb.from('leo_players').select('username, best_score, current_skin').order('best_score', { ascending: false }).limit(5);
            
            if(data) {
                const html = data.map((u, i) => {
                    let skinKey = u.current_skin || 'default';
                    let skinColor = SKINS[skinKey] ? SKINS[skinKey].front : '#00ff00';
                    let rankColor = i === 0 ? "#ffd700" : (i === 1 ? "#c0c0c0" : "#cd7f32");
                    return `
                    <li class="ranking-item">
                        <div class="leader-rank-area">
                            <span style="color:${rankColor}; width:15px;">${i+1}.</span>
                            <div class="leader-skin-icon" style="background:${skinColor}"></div>
                            <span style="color:${rankColor}">${u.username}</span>
                        </div>
                        <span>${u.best_score}</span>
                    </li>`;
                }).join('');
                lists.forEach(l => l.innerHTML = html);
            }
        }

        window.onload = function() { if(sb) renderLeaderboard(); };

        function updateBankUI() {
            if(currentUser) {
                document.getElementById('bankDisplay').innerText = currentUser.coins;
                document.getElementById('shopBankDisplay').innerText = currentUser.coins;
            }
        }

        // --- SHOP ---
        function openShop() { document.getElementById('shopOverlay').style.display='flex'; document.getElementById('gameOver').style.display='none'; renderShop(); }
        function closeShop() { document.getElementById('shopOverlay').style.display='none'; document.getElementById('gameOver').style.display='block'; }

        function renderShop() {
            const grid = document.getElementById('skinGrid'); grid.innerHTML = "";
            const owned = (currentUser.inventory || "").split(',');
            for (const [key, skin] of Object.entries(SKINS)) {
                const isOwned = owned.includes(key);
                const isEquipped = currentUser.current_skin === key;
                let btnHtml = isEquipped ? `<button class="buy-btn" style="background:#444;color:#fff">EQUIPAGGIATO</button>` :
                             isOwned ? `<button class="buy-btn" style="background:#00ff00;color:#000" onclick="equipSkin('${key}')">EQUIPAGGIA</button>` :
                             `<button class="buy-btn" style="background:#ffd700;color:#000" onclick="buySkin('${key}')">${skin.price}$</button>`;
                
                grid.innerHTML += `<div class="skin-card ${isOwned?'owned':''} ${isEquipped?'equipped':''}"><div class="skin-preview" style="background:${skin.front}; border-top:5px solid ${skin.top}; border-right:5px solid ${skin.side}"></div><span class="skin-name">${skin.name}</span>${btnHtml}</div>`;
            }
        }

        async function buySkin(key) {
            if(currentUser.id === 'offline') return alert("Registrati per comprare skin!");
            const skin = SKINS[key];
            if (currentUser.coins >= skin.price) {
                currentUser.coins -= skin.price; currentUser.inventory += "," + key; playSound('buy'); updateBankUI();
                await sb.from('leo_players').update({ coins: currentUser.coins, inventory: currentUser.inventory }).eq('id', currentUser.id);
                renderShop();
            } else alert("Non hai abbastanza soldi!");
        }

        async function equipSkin(key) {
            if(currentUser.id === 'offline') { currentUser.current_skin = key; renderShop(); return; }
            currentUser.current_skin = key;
            await sb.from('leo_players').update({ current_skin: key }).eq('id', currentUser.id);
            renderShop();
        }

        // --- GAME ENGINE ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const FLOOR_HEIGHT = 40; // Altezza visiva del pavimento
        const HITBOX_PADDING = 14; 
        
        let gameRunning = false;
        let frames = 0;
        let score = 0;
        let sessionCoins = 0;
        let lives = 1;
        let gameSpeed = 6;
        let currentCombo = 0;

        let obstacles = [];
        let particles = [];
        let coins = [];
        let blocks = []; 
        let trail = [];
        let floatingTexts = [];
        let stars = []; 
        const GRAVITY = 0.65;

        let powerMode = false; // Elephant/Red Mode
        let shieldMode = false; // Blue/Magnet Mode
        let powerTimer = 0;

        const player = { x: 60, y: 300, width: 30, height: 30, dy: 0, jumpForce: 13, grounded: false, angle: 0, spinSpeed: 0, invincible: false, invTimer: 0 };

        // 3D DRAWING HELPER
        function drawCube3D(ctx, x, y, size, colorFront, colorTop, colorSide) {
            let depth = size/4;
            // Side
            ctx.fillStyle = colorSide; ctx.beginPath(); ctx.moveTo(x+size, y); ctx.lineTo(x+size+depth, y-depth); ctx.lineTo(x+size+depth, y+size-depth); ctx.lineTo(x+size, y+size); ctx.fill();
            // Top
            ctx.fillStyle = colorTop; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x+depth, y-depth); ctx.lineTo(x+size+depth, y-depth); ctx.lineTo(x+size, y); ctx.fill();
            // Front
            ctx.fillStyle = colorFront; ctx.fillRect(x, y, size, size);
        }

        class FloatingText {
            constructor(text, x, y, color, size) { this.text = text; this.x = x; this.y = y; this.color = color || '#fff'; this.size = size || 15; this.life = 1.0; this.vy = -2; }
            update() { this.y += this.vy; this.life -= 0.02; }
            draw() { ctx.save(); ctx.globalAlpha = Math.max(0, this.life); ctx.fillStyle = this.color; ctx.font = `bold ${this.size}px "Press Start 2P"`; ctx.shadowColor = "black"; ctx.shadowBlur = 4; ctx.fillText(this.text, this.x, this.y); ctx.restore(); }
        }

        class Particle {
            constructor(x, y, type, color) {
                this.x = x; this.y = y; this.type = type; this.size = Math.random()*6+4;
                let angle = Math.random()*Math.PI*2; let speed = Math.random()*5+2;
                if(type==='explosion') { this.vx = Math.cos(angle)*speed; this.vy = Math.sin(angle)*speed; this.life=1.5; this.color=color; }
                else { this.vx = Math.random()*6-3; this.vy = Math.random()*6-3; this.life=1.0; this.color=color||'#fff'; }
            }
            update() { this.x+=this.vx; this.y+=this.vy; this.life-=0.03; this.size*=0.95; }
            draw() { ctx.globalAlpha=Math.max(0, this.life); ctx.fillStyle=this.color; ctx.fillRect(this.x, this.y, this.size, this.size); ctx.globalAlpha=1.0; }
        }

        class Obstacle {
            constructor(score) {
                this.x = canvas.width; this.markedForDeletion = false;
                const r = Math.random();
                // FIX Y POSITION based on new Floor
                let groundY = canvas.height - FLOOR_HEIGHT;
                
                if(score > 1000 && r > 0.85) { this.type='water'; this.width=120; this.height=20; this.y=groundY+20; this.color='#0088ff'; } // Water is low
                else if(score > 500 && r > 0.7) { this.type='spike'; this.width=30; this.height=30; this.y=groundY-30; this.color='#aaaaaa'; }
                else if(r < 0.5) { this.type='ground'; this.width=40; this.height=40; this.y=groundY-40; this.color='#ff0055'; }
                else { this.type='air'; this.width=40; this.height=40; this.y=groundY-100; this.color='#fc00ff'; }
            }
            update() { this.x -= gameSpeed; if(this.x < -100) this.markedForDeletion=true; }
            draw() {
                if(this.type==='water') { ctx.fillStyle=this.color; ctx.fillRect(this.x, canvas.height-FLOOR_HEIGHT, this.width, FLOOR_HEIGHT); }
                else if(this.type==='spike') { 
                    ctx.fillStyle=this.color; ctx.beginPath(); ctx.moveTo(this.x,this.y+this.height); ctx.lineTo(this.x+this.width/2,this.y); ctx.lineTo(this.x+this.width,this.y+this.height); ctx.fill();
                    ctx.fillStyle="#666"; ctx.beginPath(); ctx.moveTo(this.x+this.width/2, this.y); ctx.lineTo(this.x+this.width, this.y+this.height); ctx.lineTo(this.x+this.width+5, this.y+this.height-5); ctx.fill(); 
                }
                else { drawCube3D(ctx, this.x, this.y, this.width, this.color, '#ff99cc', '#aa0033'); }
            }
        }

        class DestructibleBlock {
            constructor() { this.width=60; this.height=20; this.x=canvas.width; this.y=canvas.height-170; this.color='#ffaa00'; }
            update() { this.x -= gameSpeed; if(this.x < -100) this.markedForDeletion=true; }
            draw() { 
                drawCube3D(ctx, this.x, this.y, 20, this.color, '#ffff00', '#cc8800'); 
                drawCube3D(ctx, this.x+20, this.y, 20, this.color, '#ffff00', '#cc8800');
                drawCube3D(ctx, this.x+40, this.y, 20, this.color, '#ffff00', '#cc8800');
            }
        }

        class Gem {
            constructor(tier, sx, sy) {
                this.x = sx || canvas.width; this.tier = tier; this.rot = 0;
                let groundY = canvas.height - FLOOR_HEIGHT;
                
                if(tier===6) { this.y=groundY-180; this.color='#00ffff'; this.points=500; this.size=24; } // SHIELD ELEPHANT
                else if(tier===5) { this.y=groundY-160; this.color='#ff0000'; this.points=2000; this.size=22; } // RED ELEPHANT
                else if(tier===4) { this.y=sy; this.color='#ffffff'; this.points=1000; this.size=16; } // DIAMOND
                else { this.y=groundY-60-Math.random()*60; this.color=tier===2?'#00dbde':'#00ff00'; this.points=tier===2?150:50; this.size=12; }
            }
            update() { 
                this.x -= gameSpeed; this.rot+=0.05; if(this.x<-50) this.markedForDeletion=true; 
                if(shieldMode) { this.x += (player.x - this.x) * 0.1; this.y += (player.y - this.y) * 0.1; }
            }
            draw() {
                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rot);
                if(this.tier===5 || this.tier===6) { 
                    ctx.fillStyle=this.color; ctx.shadowBlur=20; ctx.shadowColor=this.color;
                    ctx.fillRect(-10,-8,20,16); ctx.fillRect(-16,-6,6,12); ctx.fillRect(10,-6,6,12); ctx.fillRect(-2,4,4,10); 
                } else {
                    ctx.fillStyle=this.color; ctx.shadowBlur=15; ctx.shadowColor=this.color;
                    ctx.beginPath(); ctx.moveTo(0,-this.size); ctx.lineTo(this.size,0); ctx.lineTo(0,this.size); ctx.lineTo(-this.size,0); ctx.fill();
                }
                ctx.restore();
            }
        }

        function initStars() { stars=[]; for(let i=0; i<50; i++) stars.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, size: Math.random()*2}); }
        function drawStars() {
            ctx.fillStyle = "#fff";
            stars.forEach(s => {
                s.x -= gameSpeed * 0.1; 
                if(s.x < 0) s.x = canvas.width;
                ctx.fillRect(s.x, s.y, s.size, s.size);
            });
        }

        function createExplosion(x, y, color) { playSound('break'); for(let i=0;i<15;i++) particles.push(new Particle(x, y, 'explosion', color)); }
        
        function activatePower(type) {
            powerTimer = 300; 
            playSound('powerup');
            let msg = document.getElementById('powerMsg');
            let txt = document.getElementById('elephantMsg'); 
            txt.style.display = 'block';
            
            if(type === 'red') {
                powerMode = true; shieldMode = false;
                canvas.classList.add('fire-sky'); canvas.classList.remove('shield-sky');
                txt.innerText = "RED ELEPHANT!"; txt.style.color = "#ff0000";
            } else {
                shieldMode = true; powerMode = false;
                canvas.classList.add('shield-sky'); canvas.classList.remove('fire-sky');
                txt.innerText = "SHIELD MAGNET!"; txt.style.color = "#00ffff";
            }
            setTimeout(()=> txt.style.display='none', 2000);
        }

        function handleInput(e) { if(e.cancelable) e.preventDefault(); if(gameRunning) jump(); }
        function jump() { 
            if(player.grounded) { 
                player.dy = -player.jumpForce; player.grounded=false; playSound('jump'); 
                for(let i=0;i<5;i++) particles.push(new Particle(player.x+15, player.y+30, 'dust', '#fff'));
            }
        }
        window.addEventListener('keydown', e => { if(gameRunning && (e.code==='Space'||e.code==='ArrowUp')) jump(); });

        function updateGame() {
            if(powerMode || shieldMode) {
                powerTimer--;
                if(powerTimer<=0) { powerMode=false; shieldMode=false; canvas.classList.remove('fire-sky'); canvas.classList.remove('shield-sky'); }
            }
            if(player.invincible) { player.invTimer--; if(player.invTimer<=0) player.invincible=false; }

            player.dy += GRAVITY; player.y += player.dy;

            // FIX: GROUND COLLISION MATCHES VISUAL FLOOR (40px)
            let groundLevel = canvas.height - FLOOR_HEIGHT;
            
            if(player.y + player.height > groundLevel) { 
                player.y = groundLevel - player.height; player.dy = 0; player.grounded=true; player.angle=0; player.spinSpeed=0; 
                if(currentCombo > 1) floatingTexts.push(new FloatingText("COMBO END", player.x, player.y-50, "#aaa", 10));
                currentCombo = 0;
            } else { player.grounded=false; }

            // BLOCKS
            blocks.forEach(b => {
                b.update();
                if(player.x+HITBOX_PADDING < b.x+b.width && player.x+player.width-HITBOX_PADDING > b.x) {
                    if((powerMode || shieldMode) && player.y < b.y+b.height && player.y+player.height > b.y) {
                        b.markedForDeletion=true; score+=200; createExplosion(b.x, b.y, '#ffaa00');
                        floatingTexts.push(new FloatingText("SMASH!", b.x, b.y, "#ffd700", 15));
                    }
                    else if(player.dy>=0 && player.y+player.height >= b.y && player.y+player.height <= b.y+25) { 
                        player.y=b.y-player.height; player.dy=0; player.grounded=true; currentCombo=0; 
                    }
                    else if(player.dy<0 && player.y <= b.y+b.height && player.y > b.y) { 
                        b.markedForDeletion=true; player.dy=-24; player.spinSpeed=0.8; createExplosion(b.x, b.y, '#ffaa00');
                        floatingTexts.push(new FloatingText("BOOST!", b.x, b.y, "#fff", 12));
                    }
                    else if(player.y+player.height > b.y+HITBOX_PADDING && !player.invincible && !powerMode && !shieldMode) {
                        hitPlayer();
                    }
                }
            });

            if(player.spinSpeed>0) { player.angle+=player.spinSpeed; player.spinSpeed*=0.96; } else if(player.angle>0) player.angle*=0.8;

            if(frames%3===0) {
                let tColor = powerMode ? '#f00' : shieldMode ? '#0ff' : '#0f0';
                if(!powerMode && !shieldMode && currentUser && currentUser.current_skin && SKINS[currentUser.current_skin]) {
                    tColor = SKINS[currentUser.current_skin].front;
                }
                trail.push({x: player.x, y: player.y, angle: player.angle, color: tColor});
                if(trail.length > 8) trail.shift();
            }
            trail.forEach(t => t.x -= gameSpeed);

            let spawnRate = Math.max(50, 100 - Math.floor(gameSpeed*4));
            if(frames%spawnRate===0) obstacles.push(new Obstacle(score));

            if(frames%220===0 && Math.random()>0.3) {
                let b = new DestructibleBlock(); blocks.push(b);
                for(let k=0; k<3; k++) coins.push(new Gem(4, b.x+100+(k*90), 40+(k*10))); 
            }
            if(frames%80===0) {
                let t=1; if(Math.random()>0.7) t=2;
                if(frames%400===0 && Math.random()>0.4) t=5; // Red Elephant
                if(frames%600===0 && Math.random()>0.5) t=6; // Blue Shield Elephant (Rare)
                coins.push(new Gem(t));
            }

            obstacles.forEach(o => {
                o.update();
                if(player.x+HITBOX_PADDING < o.x+o.width-HITBOX_PADDING && 
                   player.x+player.width-HITBOX_PADDING > o.x+HITBOX_PADDING &&
                   player.y+HITBOX_PADDING < o.y+o.height-HITBOX_PADDING &&
                   player.y+player.height-HITBOX_PADDING > o.y+HITBOX_PADDING) {
                    
                    if(powerMode || shieldMode) {
                        o.markedForDeletion=true; score+=100; createExplosion(o.x, o.y, o.color);
                        floatingTexts.push(new FloatingText("BOOM!", o.x, o.y, powerMode?"#f00":"#0ff", 14));
                    }
                    else if(o.type === 'water') { lives=0; hitPlayer(); } 
                    else if(o.type === 'spike') { if(!player.invincible) hitPlayer(); }
                    else {
                        let isStomp = player.dy > 0 && (player.y+player.height) < (o.y + o.height * 0.8);
                        let isHeadbutt = player.dy < 0 && player.y > o.y + o.height * 0.2;
                        
                        if(isStomp || isHeadbutt) {
                            o.markedForDeletion=true; currentCombo++;
                            let pts = 100 * currentCombo; score += pts;
                            createExplosion(o.x, o.y, o.color);
                            floatingTexts.push(new FloatingText(`+${pts} x${currentCombo}`, o.x, o.y, "#ff0", 12));
                            if(isStomp) player.dy = -12; else player.dy = 5;
                        } else if(!player.invincible) hitPlayer();
                    }
                }
            });

            coins.forEach(c => {
                c.update();
                let dist = Math.hypot(player.x - c.x, player.y - c.y);
                if (dist < 50 || (shieldMode && dist < 300)) { 
                     if(dist < 50) { 
                        c.markedForDeletion=true; score+=c.points; sessionCoins++; 
                        playSound(c.points>=500?'coin_epic':'coin');
                        floatingTexts.push(new FloatingText(`+${c.points}`, c.x, c.y, c.color, 10));
                        if(c.tier===5) activatePower('red');
                        if(c.tier===6) { activatePower('blue'); score+=500; floatingTexts.push(new FloatingText("+500", c.x, c.y, "#0ff", 20)); }
                     }
                }
            });

            particles.forEach(p => p.update());
            floatingTexts.forEach(t => t.update());
            obstacles=obstacles.filter(o=>!o.markedForDeletion); blocks=blocks.filter(b=>!b.markedForDeletion); 
            coins=coins.filter(c=>!c.markedForDeletion); particles=particles.filter(p=>p.life>0); floatingTexts=floatingTexts.filter(t=>t.life>0);
            
            document.getElementById('score').innerText = Math.floor(score);
            document.getElementById('coinsDisplay').innerText = sessionCoins;
            document.getElementById('livesDisplay').innerText = lives;
        }

        // FIX: Game Over Logic Order - Show UI FIRST
        function hitPlayer() {
            lives--; playSound('hit'); canvas.classList.add('shake'); setTimeout(()=>canvas.classList.remove('shake'), 500);
            currentCombo = 0;
            if(lives<=0) {
                gameRunning = false;
                // SHOW UI IMMEDIATELY
                document.getElementById('finalScore').innerText = Math.floor(score);
                document.getElementById('earnedCoins').innerText = sessionCoins;
                document.getElementById('gameOver').style.display = 'block';
                document.getElementById('jumpButton').style.display = 'none';
                
                // SAVE IN BACKGROUND
                try { saveGameData(score, sessionCoins); } catch(e) { console.error("Save failed", e); }
            } else {
                player.invincible=true; player.invTimer=120; document.getElementById('damageMsg').style.display='block'; setTimeout(()=>document.getElementById('damageMsg').style.display='none', 1000);
            }
        }

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawStars();

            // Player Drawing
            if(!player.invincible || frames%4===0) {
                ctx.save(); ctx.translate(player.x+player.width/2, player.y+player.height/2); ctx.rotate(player.angle);
                
                if(powerMode || shieldMode) {
                    let c1 = powerMode ? '#f00' : '#0ff';
                    let c2 = powerMode ? '#800' : '#008';
                    drawCube3D(ctx, -15, -15, 30, c1, '#fff', c2);
                    // Ears
                    ctx.fillStyle=c1; ctx.fillRect(-20,-10,5,15); ctx.fillRect(15,-10,5,15);
                } else {
                    let skinKey = (currentUser && currentUser.current_skin) ? currentUser.current_skin : 'default';
                    let skin = SKINS[skinKey] || SKINS['default'];
                    drawCube3D(ctx, -15, -15, 30, skin.front, skin.top, skin.side);
                    if(skinKey==='ninja') { ctx.fillStyle="red"; ctx.fillRect(-15,-5,30,5); }
                    else { ctx.fillStyle="black"; ctx.fillRect(5,-5,6,6); }
                }
                ctx.restore();
            }
            
            trail.forEach(t => {
                ctx.save(); ctx.translate(t.x+player.width/2, t.y+player.height/2); ctx.rotate(t.angle);
                ctx.fillStyle = t.color; ctx.globalAlpha=0.3; ctx.fillRect(-15,-15,30,30); ctx.globalAlpha=1.0; ctx.restore();
            });

            blocks.forEach(b=>b.draw()); coins.forEach(c=>c.draw()); obstacles.forEach(o=>o.draw()); 
            particles.forEach(p=>p.draw()); floatingTexts.forEach(t=>t.draw());
            
            // 3D FLOOR DRAWING (40px high)
            ctx.fillStyle = "#333"; ctx.fillRect(0, canvas.height, canvas.width, -FLOOR_HEIGHT); // Side
            ctx.fillStyle = "#ff0055"; ctx.fillRect(0, canvas.height-FLOOR_HEIGHT, canvas.width, 5); // Top Line
        }

        function resetGame() {
            // FIX: Reset Y to new ground level
            player.y = canvas.height - FLOOR_HEIGHT - player.height; 
            player.dy=0; obstacles=[]; coins=[]; blocks=[]; particles=[]; floatingTexts=[];
            score=0; sessionCoins=0; lives=1; frames=0; powerMode=false; shieldMode=false; currentCombo=0; canvas.classList.remove('fire-sky'); canvas.classList.remove('shield-sky');
            gameRunning=true; document.getElementById('gameOver').style.display='none'; document.getElementById('jumpButton').style.display='flex';
            initStars();
            requestAnimationFrame(loop);
        }
        function loop() { if(!gameRunning) return; updateGame(); drawGame(); frames++; score+=0.1; if(frames%600===0) gameSpeed+=0.5; requestAnimationFrame(loop); }
    </script>
</body>
</html>
