<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LEO ARCADE: FINAL STABLE</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Fredoka:wght@600&display=swap" rel="stylesheet">

    <style>
        :root { --neon-blue: #00f3ff; --neon-pink: #ff00ff; --neon-gold: #ffd700; --bg: #111; }
        body { 
            margin: 0; padding: 0; background: var(--bg); overflow: hidden; 
            display: flex; justify-content: center; align-items: center; height: 100vh;
            font-family: 'Fredoka', sans-serif; touch-action: none; user-select: none;
        }

        canvas { 
            background: #1a1a1a; 
            border: 4px solid #333; 
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            max-width: 100%; max-height: 100%; 
            image-rendering: pixelated; /* Stile Arcade Nitido */
        }

        /* UI */
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; }
        .hud-top { display: flex; justify-content: space-between; align-items: flex-start; }
        
        .stat-box { 
            background: rgba(0,0,0,0.8); border: 2px solid #555; 
            color: #fff; padding: 10px 15px; border-radius: 8px; margin-bottom: 10px;
            font-family: 'Press Start 2P', cursive; font-size: 10px; line-height: 1.5;
            box-shadow: 4px 4px 0 #000;
        }
        .stat-value { color: var(--neon-gold); font-size: 12px; }

        /* Powerup Overlay Text */
        #godModeText {
            position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%);
            font-family: 'Press Start 2P'; font-size: 24px; color: var(--neon-gold);
            text-shadow: 4px 4px 0 #ff0000; display: none; animation: flash 0.2s infinite;
            text-align: center; width: 100%;
        }
        @keyframes flash { 0% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 50% { opacity: 0.5; transform: translate(-50%, -50%) scale(1.1); } }

        /* Menus */
        .modal { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); display: flex; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 100; pointer-events: auto;
        }
        .panel { 
            background: #222; border: 4px solid #fff; padding: 30px; 
            text-align: center; max-width: 400px; width: 90%; 
            box-shadow: 10px 10px 0 #000; 
        }
        
        h1 { font-family: 'Press Start 2P'; color: var(--neon-blue); font-size: 20px; margin-bottom: 20px; line-height: 1.5; text-shadow: 4px 4px 0 #000; }
        
        input { 
            width: 100%; padding: 15px; margin: 10px 0; background: #000; 
            border: 2px solid #555; color: #fff; font-family: 'Press Start 2P'; font-size: 10px; 
            box-sizing: border-box; 
        }
        
        button { 
            width: 100%; padding: 15px; margin-top: 10px; 
            font-family: 'Press Start 2P'; font-size: 12px; border: none; cursor: pointer; 
            background: var(--neon-blue); color: #000; box-shadow: 4px 4px 0 #0056b3; 
            transition: transform 0.1s; 
        }
        button:active { transform: translate(4px, 4px); box-shadow: 0 0 0; }
        .btn-shop { background: var(--neon-pink); box-shadow: 4px 4px 0 #800080; }
        .btn-close { background: #555; color: #fff; box-shadow: 4px 4px 0 #222; }

        /* Shop Grid */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; max-height: 250px; overflow-y: auto; }
        .item { 
            border: 2px solid #444; padding: 10px; background: #111; 
            display: flex; flex-direction: column; align-items: center; 
        }
        .item.owned { border-color: #0f0; }
        .item.equipped { border-color: var(--neon-gold); background: #333; }
        .preview { width: 40px; height: 40px; margin-bottom: 10px; }

        #jumpBtn {
            position: absolute; bottom: 30px; right: 30px; width: 90px; height: 90px;
            background: rgba(255,255,255,0.2); border: 4px solid #fff; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; font-size: 30px;
            pointer-events: auto; touch-action: manipulation;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div class="hud-top">
            <div>
                <div class="stat-box">PLAYER: <span id="hudName" class="stat-value">GUEST</span></div>
                <div class="stat-box">BANK: <span id="hudCoins" class="stat-value">0</span> $</div>
            </div>
            <div class="stat-box">
                TOP PLAYERS<br>
                <div id="leaderboard" style="margin-top:5px; color:#aaa;">Loading...</div>
            </div>
        </div>
        <div id="godModeText">ELEPHANT POWER!</div>
        <div class="stat-box" style="align-self: flex-end; font-size:14px;">SCORE: <span id="hudScore" class="stat-value">0</span></div>
    </div>

    <canvas id="game" width="800" height="450"></canvas>
    <div id="jumpBtn" onmousedown="game.jump()" ontouchstart="game.jump()">⬆️</div>

    <div id="menuLogin" class="modal">
        <div class="panel">
            <h1>LEO ARCADE</h1>
            <input type="text" id="inpUser" placeholder="USERNAME">
            <input type="password" id="inpPass" placeholder="PASSWORD">
            <button onclick="auth.login()">LOGIN / GIOCA</button>
            <button class="btn-close" onclick="auth.guest()">GIOCA OSPITE</button>
            <p style="font-size:10px; color:#666; margin-top:15px; cursor:pointer;" onclick="auth.register()">REGISTRATI (NUOVO)</p>
        </div>
    </div>

    <div id="menuShop" class="modal" style="display:none;">
        <div class="panel" style="width: 500px; max-width:95%;">
            <h1>SHOP</h1>
            <div style="font-family:'Press Start 2P'; font-size:10px; margin-bottom:10px;">SOLDI: <span id="shopMoney" style="color:gold">0</span></div>
            <div style="display:flex; gap:10px; justify-content:center;">
                <button style="width:auto; padding:10px;" onclick="shop.render('skins')">SKINS</button>
                <button style="width:auto; padding:10px;" onclick="shop.render('pets')">PETS</button>
            </div>
            <div id="shopGrid" class="grid"></div>
            <button class="btn-close" onclick="ui.showGame()">TORNA AL GIOCO</button>
        </div>
    </div>

    <div id="menuOver" class="modal" style="display:none;">
        <div class="panel">
            <h1 style="color:#ff4444">GAME OVER</h1>
            <p style="font-family:'Press Start 2P'; font-size:12px; margin-bottom:10px;">SCORE: <span id="endScore" style="color:#fff">0</span></p>
            <p style="font-family:'Press Start 2P'; font-size:12px; margin-bottom:20px; color:gold;">EARNED: +<span id="endCoins">0</span> $</p>
            <button onclick="game.reset()">RIPROVA</button>
            <button class="btn-shop" onclick="ui.showShop()">NEGOZIO</button>
        </div>
    </div>

    <script>
        // --- CONFIG & SUPABASE ---
        const SB_URL = 'https://jcylyutlybmbjrgghpzm.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpjeWx5dXRseWJtYmpyZ2docHptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA0NTc4NTYsImV4cCI6MjA4NjAzMzg1Nn0.X9xwESmsRJurzGODAb6V0x4QA_YODtKbATooYcC39Ew';
        let sb = null;
        try { if(typeof supabase !== 'undefined') sb = supabase.createClient(SB_URL, SB_KEY); } catch(e){}

        // --- DATA ---
        const SKINS = {
            'noob': { name: 'NOOB', price: 0, c: '#00ff00' },
            'iron': { name: 'IRON MAN', price: 2000, c: '#ff0000', detail: 'gold' },
            'spider': { name: 'SPIDER', price: 4000, c: '#cc0000', detail: 'blue' },
            'cap': { name: 'CAPTAIN', price: 6000, c: '#0000ff', detail: 'white' },
            'hulk': { name: 'HULK', price: 8000, c: '#00aa00', detail: 'purple' }
        };
        const PETS = {
            'none': { name: 'NESSUNO', price: 0 },
            'cube': { name: 'CUBO', price: 1000, c: '#00ffff' },
            'doge': { name: 'DOGE', price: 3000, c: '#ffcc00' },
            'ufo': { name: 'UFO', price: 5000, c: '#aaaaaa' }
        };

        let user = { id:'guest', name:'GUEST', coins:0, high:0, skins:['noob'], curSkin:'noob', pets:['none'], curPet:'none' };

        // --- AUDIO ---
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ac = new AudioCtx();
        function beep(freq, type, dur) {
            if(ac.state === 'suspended') ac.resume();
            const o=ac.createOscillator(); const g=ac.createGain();
            o.type=type; o.frequency.value=freq;
            o.connect(g); g.connect(ac.destination);
            o.start(); g.gain.exponentialRampToValueAtTime(0.00001, ac.currentTime + dur); o.stop(ac.currentTime + dur);
        }

        // --- GAME ENGINE ---
        const cvs = document.getElementById('game');
        const ctx = cvs.getContext('2d');
        
        const game = {
            active: false, frames: 0, speed: 6, score: 0, sessionCoins: 0,
            shake: 0, godMode: 0,
            player: { x:100, y:300, w:30, h:30, dy:0, ground:false },
            pet: { x:60, y:300 },
            camY: 0,
            entities: [],
            particles: [],
            texts: [],

            start: function() {
                this.active = true; this.frames = 0; this.speed = 6; this.score = 0; this.sessionCoins = 0;
                this.godMode = 0; this.entities = []; this.particles = []; this.texts = [];
                this.player.y = 350; this.player.dy = 0;
                ui.hideAll();
                loop();
            },

            reset: function() { this.start(); },

            update: function() {
                this.frames++; this.score += 0.1; this.speed += 0.002;
                if(this.godMode > 0) this.godMode--;

                // Physics
                const p = this.player;
                p.dy += 0.8; p.y += p.dy;
                if(p.y > 400 - p.h) { p.y = 400 - p.h; p.dy = 0; p.ground = true; } else { p.ground = false; }

                // Pet Follow
                this.pet.x += ((p.x - 40) - this.pet.x) * 0.1;
                this.pet.y += ((p.y - 20) - this.pet.y) * 0.1;

                // Spawning (Simplified & Smart)
                if(this.frames % Math.floor(1000/this.speed) === 0) {
                    let r = Math.random();
                    // ELEPHANT LOGIC: Solo in alto, raramente
                    if(r < 0.05) this.spawn(900, 100, 30, 30, 'coin_ele'); 
                    else if(r < 0.3) this.spawn(900, 350, 15, 15, 'coin'); // Monete basse
                    else if(r < 0.6) this.spawn(900, 360, 40, 40, 'crate'); // Casse
                    else if(r < 0.8) this.spawn(900, 370, 30, 30, 'spike'); // Spine
                    else this.spawn(900, 250, 40, 10, 'plat'); // Piattaforme aeree
                }

                // Entity Loop
                this.entities.forEach(e => {
                    e.x -= this.speed;
                    
                    // MAGNET (God Mode)
                    if(this.godMode > 0 && (e.t.includes('coin'))) {
                        e.x += (p.x - e.x) * 0.2; e.y += (p.y - e.y) * 0.2;
                    }

                    // Collision
                    if(p.x < e.x + e.w && p.x + p.w > e.x && p.y < e.y + e.h && p.y + p.h > e.y) {
                        if(e.t === 'coin') {
                            e.dead = true; this.sessionCoins += 10; this.score += 100;
                            this.text("+10", e.x, e.y, '#ffd700'); beep(1200, 'sine', 0.1);
                        } 
                        else if(e.t === 'coin_ele') {
                            e.dead = true; this.sessionCoins += 100; this.score += 1000;
                            this.godMode = 300; // 5 SECONDS GOD MODE
                            this.text("ELEPHANT POWER!", 400, 200, '#00ffff'); beep(400, 'square', 0.5);
                        }
                        else if(e.t === 'plat') {
                            // Land on platform
                            if(p.dy > 0 && p.y + p.h < e.y + 15) {
                                p.y = e.y - p.h; p.dy = 0; p.ground = true;
                            }
                        }
                        else {
                            // Bad things (Crate, Spike)
                            if(this.godMode > 0) {
                                // GOD SMASH
                                e.dead = true; this.score += 500;
                                this.text("SMASH!", e.x, e.y, '#fff'); this.explode(e.x, e.y, e.c); beep(100, 'sawtooth', 0.2);
                            } else {
                                // Break Crate from top/bottom
                                if(e.t === 'crate' && (p.dy > 0 || p.dy < 0)) {
                                    e.dead = true; this.score += 100; p.dy = -10;
                                    this.explode(e.x, e.y, e.c); beep(100, 'sawtooth', 0.1);
                                } else {
                                    this.over();
                                }
                            }
                        }
                    }
                });

                // Updates
                this.entities = this.entities.filter(e => !e.dead && e.x > -100);
                this.texts.forEach(t => { t.y--; t.life-=0.02; });
                this.texts = this.texts.filter(t => t.life > 0);
                this.particles.forEach(pt => { pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.5; pt.life-=0.05; });
                this.particles = this.particles.filter(pt => pt.life > 0);

                if(this.shake > 0) { ctx.translate((Math.random()-.5)*this.shake, (Math.random()-.5)*this.shake); this.shake*=0.9; }
                
                // UI Sync
                document.getElementById('hudScore').innerText = Math.floor(this.score);
                document.getElementById('hudCoins').innerText = user.coins + this.sessionCoins;
                document.getElementById('godModeText').style.display = this.godMode > 0 ? 'block' : 'none';
            },

            draw: function() {
                // Clear
                ctx.fillStyle = this.godMode > 0 ? '#220022' : '#1a1a1a'; // Purple BG in God Mode
                ctx.fillRect(0, 0, 800, 450);
                
                // Reset Matrix for Shake
                ctx.setTransform(1,0,0,1,0,0);
                if(this.godMode > 0) ctx.translate(Math.random()*4-2, Math.random()*4-2);

                // Ground
                ctx.fillStyle = '#333'; ctx.fillRect(0, 400, 800, 50);
                ctx.fillStyle = '#444'; for(let i=-(this.frames*this.speed)%50; i<800; i+=50) ctx.fillRect(i, 400, 40, 5);

                // Entities
                this.entities.forEach(e => {
                    ctx.fillStyle = e.c;
                    if(e.t.includes('coin')) {
                        ctx.beginPath(); ctx.arc(e.x+e.w/2, e.y+e.h/2, e.w/2, 0, Math.PI*2); ctx.fill();
                        if(e.t==='coin_ele') { ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.stroke(); }
                    } else {
                        ctx.fillRect(e.x, e.y, e.w, e.h);
                        // Detail for crate
                        if(e.t==='crate') { ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fillRect(e.x+5, e.y+5, e.w-10, e.h-10); }
                    }
                });

                // Particles
                this.particles.forEach(p => { ctx.fillStyle=p.c; ctx.fillRect(p.x, p.y, 6, 6); });

                // Pet
                if(user.curPet !== 'none') {
                    let pData = PETS[user.curPet];
                    ctx.fillStyle = pData.c; ctx.fillRect(this.pet.x, this.pet.y, 20, 20);
                }

                // Player
                let skin = SKINS[user.curSkin] || SKINS['noob'];
                ctx.fillStyle = skin.c; ctx.fillRect(this.player.x, this.player.y, 30, 30);
                if(skin.detail) { 
                    ctx.fillStyle = skin.detail; 
                    ctx.fillRect(this.player.x+10, this.player.y+5, 10, 5); // Visor/Detail
                }

                // Texts
                this.texts.forEach(t => {
                    ctx.fillStyle = t.c; ctx.font = "bold 20px 'Fredoka'"; ctx.fillText(t.str, t.x, t.y);
                });
            },

            spawn: function(x, y, w, h, t) {
                let c = '#fff';
                if(t==='coin') c='#ffd700';
                if(t==='coin_ele') c='#00ffff';
                if(t==='crate') c='#ff8800';
                if(t==='spike') c='#ff0000';
                if(t==='plat') c='#00ff00';
                this.entities.push({x, y, w, h, t, c, dead:false});
            },

            jump: function() {
                if(this.active && this.player.ground) {
                    this.player.dy = -15; this.player.ground = false; beep(300, 'sine', 0.1);
                }
            },

            explode: function(x, y, c) {
                for(let i=0; i<8; i++) this.particles.push({x, y, vx:(Math.random()-0.5)*10, vy:(Math.random()-1)*10, c, life:1});
                this.shake = 10;
            },

            text: function(str, x, y, c) {
                this.texts.push({str, x, y, c, life:1});
            },

            over: function() {
                this.active = false; beep(100, 'sawtooth', 0.5);
                auth.save();
                document.getElementById('endScore').innerText = Math.floor(this.score);
                document.getElementById('endCoins').innerText = this.sessionCoins;
                ui.showOver();
            }
        };

        function loop() {
            if(game.active) {
                game.update();
                game.draw();
                requestAnimationFrame(loop);
            }
        }

        // --- SHOP & UI SYSTEM ---
        const ui = {
            hideAll: () => document.querySelectorAll('.modal').forEach(e => e.style.display = 'none'),
            showGame: () => { ui.hideAll(); },
            showShop: () => { document.getElementById('menuOver').style.display='none'; document.getElementById('menuShop').style.display='flex'; shop.render('skins'); },
            showOver: () => { document.getElementById('menuOver').style.display='flex'; }
        };

        const shop = {
            tab: 'skins',
            render: function(type) {
                this.tab = type;
                const list = document.getElementById('shopGrid'); list.innerHTML = '';
                const db = type === 'skins' ? SKINS : PETS;
                const owned = type === 'skins' ? user.skins : user.pets;
                const curr = type === 'skins' ? user.curSkin : user.curPet;
                document.getElementById('shopMoney').innerText = user.coins;

                for(let k in db) {
                    let item = db[k];
                    let isOwned = owned.includes(k);
                    let isEq = curr === k;
                    
                    let div = document.createElement('div');
                    div.className = `item ${isOwned?'owned':''} ${isEq?'equipped':''}`;
                    
                    // Simple Box Preview using Canvas
                    let cvs = document.createElement('canvas');
                    cvs.width=40; cvs.height=40; 
                    let cx = cvs.getContext('2d');
                    cx.fillStyle = item.c || '#fff';
                    cx.fillRect(0,0,40,40);
                    if(item.detail) { cx.fillStyle=item.detail; cx.fillRect(10,10,20,10); }

                    div.innerHTML = `<div style="font-size:10px; color:#fff; margin-bottom:5px;">${item.name}</div>`;
                    div.appendChild(cvs);
                    
                    let btnText = isEq ? "USATO" : (isOwned ? "USA" : item.price);
                    let btnStyle = isEq ? "background:#0f0" : (isOwned ? "background:#00f" : "background:#f90");
                    
                    div.innerHTML += `<button style="padding:5px; margin:0; font-size:8px; ${btnStyle}" onclick="shop.buy('${k}')">${btnText}</button>`;
                    list.appendChild(div);
                }
            },
            buy: function(k) {
                const db = this.tab === 'skins' ? SKINS : PETS;
                const item = db[k];
                let isSkin = this.tab === 'skins';
                let owned = isSkin ? user.skins : user.pets;

                if(owned.includes(k)) {
                    if(isSkin) user.curSkin = k; else user.curPet = k;
                } else {
                    if(user.coins >= item.price) {
                        user.coins -= item.price;
                        if(isSkin) user.skins.push(k); else user.pets.push(k);
                        if(isSkin) user.curSkin = k; else user.curPet = k;
                        beep(1000, 'square', 0.1);
                    } else { alert("Soldi insufficienti!"); return; }
                }
                this.render(this.tab);
                auth.save();
            }
        };

        // --- AUTH & DB ---
        const auth = {
            login: async () => {
                let u = document.getElementById('inpUser').value;
                let p = document.getElementById('inpPass').value;
                if(!sb || !u) return auth.guest();
                try {
                    let {data} = await sb.from('leo_players').select('*').eq('username',u).eq('password',p).single();
                    if(!data) throw 0;
                    user = {
                        id: data.id, name: data.username, coins: data.coins, high: data.best_score,
                        skins: (data.inventory||'noob').split(','), curSkin: SKINS[data.current_skin]?data.current_skin:'noob',
                        pets: (data.pets||'none').split(','), curPet: PETS[data.current_pet]?data.current_pet:'none'
                    };
                    auth.start();
                } catch(e) { alert("Errore login"); }
            },
            register: async () => {
                let u = document.getElementById('inpUser').value;
                let p = document.getElementById('inpPass').value;
                if(sb && u) await sb.from('leo_players').insert([{username:u, password:p, coins:0, best_score:0, inventory:'noob', pets:'none'}]);
                alert("Registrato!");
            },
            guest: () => { user.name = "GUEST_"+Math.floor(Math.random()*999); auth.start(); },
            start: () => {
                document.getElementById('hudName').innerText = user.name;
                document.getElementById('hudCoins').innerText = user.coins;
                auth.loadLeader();
                game.start();
            },
            save: async () => {
                if(user.id === 'guest') return;
                user.coins += game.sessionCoins;
                user.high = Math.max(user.high, Math.floor(game.score));
                document.getElementById('hudCoins').innerText = user.coins;
                if(sb) await sb.from('leo_players').update({
                    coins: user.coins, best_score: user.high,
                    inventory: user.skins.join(','), current_skin: user.curSkin,
                    pets: user.pets.join(','), current_pet: user.curPet
                }).eq('id', user.id);
                auth.loadLeader();
            },
            loadLeader: async () => {
                let html = "Offline";
                if(sb) {
                    let {data} = await sb.from('leo_players').select('username,best_score').order('best_score',{ascending:false}).limit(5);
                    if(data) html = data.map((p,i)=>`<div>${i+1}. ${p.username} - ${p.best_score}</div>`).join('');
                }
                document.getElementById('leaderboard').innerHTML = html;
            }
        };

        // --- INIT ---
        window.onload = () => {
            // Draw initial BG
            ctx.fillStyle = '#111'; ctx.fillRect(0,0,800,450);
            ctx.fillStyle = '#fff'; ctx.font = "20px 'Press Start 2P'"; ctx.fillText("READY?", 350, 220);
            auth.loadLeader();
        };
    </script>
</body>
</html>
