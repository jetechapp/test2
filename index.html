<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LEO WORLD: PRO ENGINE</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
            background: #000; /* Gestito dal Canvas ora */
            font-family: 'Fredoka', sans-serif;
            overflow: hidden; user-select: none; touch-action: none;
        }

        canvas {
            display: block; border-radius: 4px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            max-width: 100%; max-height: 100%;
        }

        /* UI LAYER (Solo HUD e Menu, il resto è in Canvas) */
        #uiLayer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
            padding: 20px; box-sizing: border-box;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        .gui-top { display: flex; justify-content: space-between; align-items: flex-start; }
        
        .badge {
            background: rgba(20, 20, 20, 0.85); color: white; padding: 10px 18px; 
            border-radius: 12px; border: 2px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(4px); font-weight: 800; font-size: 16px;
            display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-transform: uppercase; letter-spacing: 1px;
        }

        .leaderboard-box {
            background: rgba(20, 20, 20, 0.85); border-radius: 12px; padding: 15px;
            min-width: 180px; color: #fff; font-size: 12px; pointer-events: auto;
            border: 2px solid rgba(255,255,255,0.1);
        }

        /* MENU STYLES */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            display: flex; justify-content: center; align-items: center; z-index: 100;
        }
        
        .card {
            background: #1e272e; padding: 30px; border-radius: 24px;
            width: 360px; text-align: center; border: 4px solid #485460;
            box-shadow: 0 20px 80px rgba(0,0,0,0.6); color: white;
        }

        h1 { margin: 0 0 5px 0; color: #fff; font-weight: 900; font-size: 32px; letter-spacing: -1px; }
        h2 { color: #00d2d3; margin-top: 0; font-size: 14px; letter-spacing: 2px; }
        
        input { 
            width: 100%; padding: 14px; margin: 10px 0; 
            background: #000; border: 2px solid #485460; color: white;
            border-radius: 12px; box-sizing: border-box; font-family: inherit; font-weight: bold;
        }
        input:focus { border-color: #00d2d3; outline: none; }
        
        .btn {
            width: 100%; padding: 16px; border: none; border-radius: 12px;
            font-family: 'Fredoka', sans-serif; font-weight: 900; font-size: 16px; cursor: pointer;
            margin-top: 10px; color: #1e272e; transition: transform 0.1s, filter 0.1s;
            text-transform: uppercase;
        }
        .btn:active { transform: translateY(4px); filter: brightness(0.9); }
        .btn-green { background: #00d2d3; box-shadow: 0 6px 0 #009798; color: #000; }
        .btn-blue { background: #54a0ff; box-shadow: 0 6px 0 #2e86de; color: #000; }
        .btn-orange { background: #ff9f43; box-shadow: 0 6px 0 #ee5253; color: #000; }
        
        /* SHOP */
        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; max-height: 240px; overflow-y: auto; }
        .shop-item { 
            background: #2f3640; border-radius: 12px; padding: 12px; 
            border: 2px solid #485460; cursor: pointer; position: relative;
        }
        .shop-item.owned { border-color: #54a0ff; }
        .shop-item.equipped { border-color: #00d2d3; background: rgba(0, 210, 211, 0.1); box-shadow: 0 0 15px rgba(0, 210, 211, 0.2); }

        /* CONTROLS */
        #jumpBtn {
            position: absolute; bottom: 40px; right: 40px;
            width: 90px; height: 90px; background: rgba(255,255,255,0.1);
            border: 4px solid rgba(255,255,255,0.8); border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            pointer-events: auto; backdrop-filter: blur(4px); cursor: pointer;
            transition: transform 0.1s;
        }
        #jumpBtn:active { background: rgba(255,255,255,0.3); transform: scale(0.9); }
    </style>
</head>
<body>

    <div id="uiLayer">
        <div class="gui-top">
            <div>
                <div class="badge" style="border-color:#54a0ff;">👤 <span id="uiName">...</span></div>
                <div class="badge" style="border-color:#ff9f43; color:#ff9f43;">⬢ <span id="uiCoins">0</span></div>
            </div>
            <div class="leaderboard-box">
                <div style="border-bottom:2px solid #ffffff20; margin-bottom:8px; font-weight:900; letter-spacing:1px; color:#00d2d3;">TOP PLAYERS</div>
                <div id="leaderList">Connecting...</div>
            </div>
        </div>
        <div class="badge" style="align-self: flex-end; font-size:24px; background:#00d2d3; color:#000; border:none; box-shadow:0 10px 20px rgba(0,210,211,0.4);">
            SCORE: <span id="uiScore">0</span>
        </div>
    </div>

    <canvas id="gameCanvas" width="900" height="500"></canvas>
    
    <div id="jumpBtn" onmousedown="handleInput(event)" ontouchstart="handleInput(event)">
        <span style="font-size:40px;">🚀</span>
    </div>

    <div id="mainMenu" class="overlay">
        <div class="card">
            <h1>LEO WORLD</h1>
            <h2>ENGINE UPDATE v2.0</h2>
            <input type="text" id="loginUser" placeholder="NOME UTENTE">
            <input type="password" id="loginPass" placeholder="PASSWORD">
            <button class="btn btn-green" onclick="doLogin()">ENTRA E GIOCA</button>
            <button class="btn btn-blue" onclick="playGuest()">MODALITÀ OSPITE</button>
            <div style="margin-top:20px; font-size:12px; opacity:0.6; cursor:pointer; text-decoration:underline;" onclick="doRegister()">Crea un nuovo account</div>
        </div>
    </div>

    <div id="shopMenu" class="overlay" style="display:none;">
        <div class="card" style="width: 400px;">
            <h1>SHOP</h1>
            <h2>PERSONALIZZA IL TUO EROE</h2>
            <div class="badge" style="justify-content:center; margin:10px auto; background:#2f3640;">SALDO: ⬢ <span id="shopBalance">0</span></div>
            <div style="display:flex; gap:10px; margin:20px 0; justify-content:center;">
                <button class="btn btn-blue" style="width:auto; padding:10px 20px; margin:0;" onclick="switchShop('skins')">SKINS</button>
                <button class="btn btn-orange" style="width:auto; padding:10px 20px; margin:0;" onclick="switchShop('pets')">PETS</button>
            </div>
            <div class="shop-grid" id="shopGrid"></div>
            <button class="btn btn-green" style="margin-top:20px;" onclick="closeShop()">TORNA AL GIOCO</button>
        </div>
    </div>

    <div id="gameOverMenu" class="overlay" style="display:none;">
        <div class="card">
            <h1 style="color:#ff6b6b; font-size: 48px;">OOF!</h1>
            <p style="opacity:0.7;">SEI STATO ELIMINATO</p>
            <div style="font-size:28px; font-weight:900; margin:10px 0;">SCORE: <span id="finalScore">0</span></div>
            <div style="color:#ff9f43; font-weight:800; font-size:20px; margin-bottom:20px;">+<span id="finalCoins">0</span> ⬢</div>
            <button class="btn btn-green" onclick="resetGame()">RIPROVA SUBITO</button>
            <button class="btn btn-blue" onclick="openShop()">VAI ALLO SHOP</button>
        </div>
    </div>

    <script>
        // --- CONFIGURAZIONE MONDI (PREPARAZIONE FUTURA) ---
        // Qui aggiungeremo i nuovi mondi. Per ora c'è il "Mondo 1"
        const WORLDS = {
            1: {
                name: "Sky Kingdom",
                skyTop: '#48dbfb', skyBot: '#c8d6e5',
                ground: '#1dd1a1', studs: '#10ac84'
            }
        };
        let currentWorldId = 1;

        // --- SUPABASE CONFIG ---
        const SUPABASE_URL = 'https://jcylyutlybmbjrgghpzm.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpjeWx5dXRseWJtYmpyZ2docHptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA0NTc4NTYsImV4cCI6MjA4NjAzMzg1Nn0.X9xwESmsRJurzGODAb6V0x4QA_YODtKbATooYcC39Ew';
        let sb = null;
        try { if(typeof supabase !== 'undefined') sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e) {}

        // --- ASSETS ---
        const SKINS = {
            'noob': { name: 'NOOB', price: 0, colors: ['#ffeaa7', '#0984e3', '#55efc4'] },
            'guest': { name: 'GUEST', price: 200, colors: ['#dfe6e9', '#2d3436', '#2d3436'] },
            'bacon': { name: 'BACON', price: 500, colors: ['#fab1a0', '#74b9ff', '#636e72'] },
            'gold': { name: 'MIDAS', price: 2500, colors: ['#fdcb6e', '#ffeaa7', '#e17055'] },
            'void': { name: 'VOID', price: 5000, colors: ['#000000', '#2d3436', '#636e72'] },
            'neon': { name: 'CYBER', price: 8000, colors: ['#00d2d3', '#2e86de', '#ff9f43'] }
        };
        const PETS = {
            'none': { name: 'NESSUNO', price: 0, color: null },
            'cube': { name: 'CUBO', price: 1000, color: '#ff6b6b' },
            'doge': { name: 'DOGE', price: 3000, color: '#feca57' },
            'ufo': { name: 'UFO', price: 6000, color: '#54a0ff' }
        };

        let user = { username: 'Guest', id: 'guest', coins: 0, highscore: 0, inventory: ['noob'], skin: 'noob', pets: ['none'], pet: 'none' };

        // --- AUDIO ENGINE PRO ---
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const audio = AudioCtx ? new AudioCtx() : null;

        function playSound(name) {
            if(!audio || audio.state === 'suspended') audio?.resume().catch(()=>{});
            const osc = audio.createOscillator();
            const gain = audio.createGain();
            osc.connect(gain); gain.connect(audio.destination);
            const t = audio.currentTime;

            const sounds = {
                'jump': () => {
                    osc.type='sine'; osc.frequency.setValueAtTime(300, t); osc.frequency.linearRampToValueAtTime(600, t+0.1);
                    gain.gain.setValueAtTime(0.1, t); gain.gain.linearRampToValueAtTime(0, t+0.15);
                    osc.start(t); osc.stop(t+0.15);
                },
                'coin': () => {
                    osc.type='triangle'; osc.frequency.setValueAtTime(1500, t); osc.frequency.setValueAtTime(2000, t+0.05);
                    gain.gain.setValueAtTime(0.05, t); gain.gain.linearRampToValueAtTime(0, t+0.1);
                    osc.start(t); osc.stop(t+0.1);
                },
                'coin_ele': () => { // Suono epico
                    osc.type='square'; osc.frequency.setValueAtTime(400, t); osc.frequency.linearRampToValueAtTime(1200, t+0.4);
                    gain.gain.setValueAtTime(0.1, t); gain.gain.linearRampToValueAtTime(0, t+0.4);
                    osc.start(t); osc.stop(t+0.4);
                },
                'break': () => { // Esplosione cassa
                    osc.type='sawtooth'; osc.frequency.setValueAtTime(100, t); osc.frequency.exponentialRampToValueAtTime(10, t+0.2);
                    gain.gain.setValueAtTime(0.2, t); gain.gain.linearRampToValueAtTime(0, t+0.2);
                    osc.start(t); osc.stop(t+0.2);
                },
                'spring': () => { // Catapulta
                    osc.type='sine'; osc.frequency.setValueAtTime(200, t); osc.frequency.linearRampToValueAtTime(800, t+0.3);
                    gain.gain.setValueAtTime(0.2, t); gain.gain.linearRampToValueAtTime(0, t+0.3);
                    osc.start(t); osc.stop(t+0.3);
                },
                'die': () => {
                    osc.type='triangle'; osc.frequency.setValueAtTime(300, t); osc.frequency.exponentialRampToValueAtTime(50, t+0.5);
                    gain.gain.setValueAtTime(0.3, t); gain.gain.linearRampToValueAtTime(0, t+0.5);
                    osc.start(t); osc.stop(t+0.5);
                }
            };
            if(sounds[name]) sounds[name]();
        }

        // --- ENGINE GRAFICO & FISICA ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Helper Shading
        function shade(hex, percent) {
            if(!hex) return '#000';
            let f=parseInt(hex.slice(1),16),t=percent<0?0:255,p=percent<0?percent*-1:percent,R=f>>16,G=f>>8&0x00FF,B=f&0x0000FF;
            return "#"+(0x1000000+(Math.round((t-R)*p)+R)*0x10000+(Math.round((t-G)*p)+G)*0x100+(Math.round((t-B)*p)+B)).toString(16).slice(1);
        }

        function drawVoxel(x, y, w, h, color, studs=true) {
            // Main Face
            ctx.fillStyle = color; ctx.fillRect(x, y, w, h);
            // Highlights (Plastic Effect)
            ctx.fillStyle = shade(color, 0.3); ctx.fillRect(x, y, w, 4); // Top edge
            ctx.fillStyle = shade(color, -0.2); ctx.fillRect(x+w-5, y, 5, h); ctx.fillRect(x, y+h-5, w, 5); // Shadow edges
            // Studs
            if(studs) {
                ctx.fillStyle = shade(color, 0.15);
                for(let i=6; i<w-6; i+=12) {
                    ctx.beginPath(); ctx.arc(x+i+3, y+3, 3, 0, Math.PI*2); ctx.fill();
                }
            }
        }

        // --- ENTITIES & CLASSES ---
        
        // Sistema Particellare per Debris (Esplosioni Casse)
        class Debris {
            constructor(x, y, color) {
                this.x = x; this.y = y;
                this.w = Math.random()*8+4; this.h = this.w;
                this.vx = (Math.random()-0.5)*12;
                this.vy = (Math.random()-1)*12;
                this.color = color;
                this.life = 1.0;
                this.gravity = 0.8;
            }
            update() {
                this.vy += this.gravity;
                this.x += this.vx; this.y += this.vy;
                this.life -= 0.02;
            }
            draw(ctx) {
                ctx.globalAlpha = Math.max(0, this.life);
                drawVoxel(this.x, this.y, this.w, this.h, this.color, false);
                ctx.globalAlpha = 1.0;
            }
        }

        // Sistema Testi Fluttuanti su Canvas (Più performante del DOM)
        class FloatingText {
            constructor(text, x, y, color, size=20) {
                this.text = text; this.x = x; this.y = y; this.color = color; this.size = size;
                this.life = 1.0; this.vy = -3;
            }
            update() {
                this.y += this.vy; this.life -= 0.02;
            }
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.font = `900 ${this.size}px 'Fredoka'`;
                ctx.fillStyle = this.color;
                ctx.shadowColor = 'black'; ctx.shadowBlur = 0; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
                ctx.textAlign = "center";
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }

        // --- GAME VARIABLES ---
        let gameState = 'MENU'; // MENU, PLAY, GAMEOVER
        let frames = 0;
        let gameSpeed = 6;
        let score = 0;
        let sessionCoins = 0;
        let shake = 0; // Screen shake magnitude

        let player = { x: 100, y: 200, w: 30, h: 48, dy: 0, grounded: false };
        let pet = { x: 50, y: 200 };
        
        let obstacles = [];
        let coins = [];
        let debrisList = [];
        let textsList = [];
        let clouds = [];

        // --- GAME LOOP ---
        function update() {
            if(gameState !== 'PLAY') return;
            frames++;
            score += 0.05; 
            gameSpeed += 0.0005; // Difficoltà progressiva lenta

            // Fisica Player
            player.dy += 0.65; // Gravità
            player.y += player.dy;
            
            let groundY = canvas.height - 60;
            
            // Atterraggio Pavimento
            if(player.y + player.h > groundY) {
                player.y = groundY - player.h;
                player.dy = 0;
                player.grounded = true;
            } else {
                player.grounded = false;
            }

            // Generazione Nuvole & Elefanti (Solo in alto!)
            if(Math.random() < 0.02) {
                let cy = Math.random() * 150; // Solo cielo alto
                clouds.push({x: canvas.width, y: cy, w: Math.random()*60+40});
                // 30% probabilità moneta elefante su nuvola
                if(Math.random() < 0.3) {
                    coins.push({x: canvas.width + 20, y: cy - 20, type: 'elephant'});
                }
            }

            // Generazione Ostacoli
            if(frames % Math.floor(100 - Math.min(40, gameSpeed)) === 0) {
                let r = Math.random();
                let ox = canvas.width;
                // Logica spawn:
                if(r < 0.35) obstacles.push({x:ox, y:0, w:45, h:45, type:'crate', color:'#e58e26'}); // Cassa
                else if(r < 0.55) obstacles.push({x:ox, y:0, w:40, h:40, type:'kill', color:'#ff4757'}); // Killbrick
                else if(r < 0.70) obstacles.push({x:ox, y:0, w:50, h:15, type:'spring', color:'#a55eea'}); // Catapulta
                else obstacles.push({x:ox, y:0, w:40, h:80, type:'truss', color:'#2f3542'}); // Muro
            }

            // Generazione Monete Terra
            if(frames % 60 === 0) {
                coins.push({x: canvas.width, y: groundY - 30 - Math.random()*50, type: 'normal'});
            }

            // Update Liste
            clouds.forEach(c => c.x -= gameSpeed * 0.4);
            obstacles.forEach(o => o.x -= gameSpeed);
            coins.forEach(c => c.x -= gameSpeed);
            debrisList.forEach(d => d.update());
            textsList.forEach(t => t.update());

            // --- COLLISIONI ---
            
            // Ostacoli
            for(let i = obstacles.length-1; i>=0; i--) {
                let o = obstacles[i];
                let oy = groundY - o.h; // Y base ostacolo
                // Hitbox Player (AABB)
                if (player.x < o.x + o.w && player.x + player.w > o.x &&
                    player.y < oy + o.h && player.y + player.h > oy) {
                    
                    if(o.type === 'crate') {
                        // Logica Distruzione Avanzata
                        let hitTop = player.dy > 0 && (player.y + player.h) < (oy + 25);
                        let hitBot = player.dy < 0 && player.y > (oy + o.h - 25);
                        
                        if(hitTop || hitBot) {
                            // DISTRUZIONE!
                            o.dead = true;
                            if(hitTop) player.dy = -12; // Rimbalzo
                            if(hitBot) player.dy = 5;   // Rimbalzo giù
                            
                            score += 100;
                            playSound('break');
                            textsList.push(new FloatingText("+100", o.x, oy, '#fff'));
                            
                            // Spawn Debris
                            for(let k=0; k<6; k++) debrisList.push(new Debris(o.x+o.w/2, oy+o.h/2, o.color));
                        } else {
                            gameOver();
                        }
                    } else if(o.type === 'spring') {
                        // CATAPULTA
                        player.dy = -28; // Super salto verso le nuvole
                        shake = 5;
                        playSound('spring');
                        textsList.push(new FloatingText("BOING!", player.x, player.y, '#a55eea', 30));
                    } else {
                        // Killbrick o Muro
                        gameOver();
                    }
                }
            }

            // Monete
            for(let i = coins.length-1; i>=0; i--) {
                let c = coins[i];
                let hit = Math.hypot((player.x+player.w/2) - c.x, (player.y+player.h/2) - c.y) < 40;
                if(hit) {
                    c.dead = true;
                    if(c.type === 'elephant') {
                        sessionCoins += 5; score += 500;
                        playSound('coin_ele');
                        textsList.push(new FloatingText("ELEPHANT! +5", c.x, c.y, '#00d2d3', 24));
                    } else {
                        sessionCoins += 1; score += 50;
                        playSound('coin');
                        textsList.push(new FloatingText("+50", c.x, c.y, '#feca57'));
                    }
                }
            }

            // Clean Arrays
            clouds = clouds.filter(c => c.x > -100);
            obstacles = obstacles.filter(o => !o.dead && o.x > -100);
            coins = coins.filter(c => !c.dead && c.x > -50);
            debrisList = debrisList.filter(d => d.life > 0);
            textsList = textsList.filter(t => t.life > 0);

            // Shake decay
            if(shake > 0) shake *= 0.9;
        }

        function draw() {
            // Setup Mondo
            const theme = WORLDS[currentWorldId];
            
            // Background Sky Gradient
            let grd = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grd.addColorStop(0, theme.skyTop);
            grd.addColorStop(1, theme.skyBot);
            ctx.fillStyle = grd;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            // Screen Shake
            if(shake > 0.5) {
                ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
            }

            // Nuvole
            ctx.fillStyle = "rgba(255,255,255,0.7)";
            clouds.forEach(c => {
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.w/2, 0, Math.PI*2);
                ctx.arc(c.x+20, c.y-10, c.w/2, 0, Math.PI*2);
                ctx.arc(c.x+40, c.y, c.w/2, 0, Math.PI*2);
                ctx.fill();
            });

            // Terreno
            let groundH = 60;
            ctx.fillStyle = theme.ground;
            ctx.fillRect(0, canvas.height - groundH, canvas.width, groundH);
            // Terreno Studs (Effetto scorrimento)
            ctx.fillStyle = theme.studs;
            let offset = (frames * gameSpeed) % 40;
            for(let i = -40; i < canvas.width; i+=40) {
                ctx.fillRect(i - offset, canvas.height - groundH, 36, 6);
            }

            let groundY = canvas.height - groundH;

            // Ostacoli
            obstacles.forEach(o => {
                let oy = groundY - o.h;
                if(o.type === 'truss') {
                    // Disegno Truss (traliccio)
                    ctx.fillStyle = o.color;
                    ctx.fillRect(o.x, oy, 10, o.h); ctx.fillRect(o.x+30, oy, 10, o.h);
                    for(let k=0; k<o.h; k+=12) ctx.fillRect(o.x, oy+k, 40, 6);
                } else if (o.type === 'spring') {
                    // Catapulta
                    drawVoxel(o.x, oy, o.w, o.h, o.color);
                    ctx.fillStyle = '#fff'; ctx.fillRect(o.x+5, oy+2, o.w-10, 4); // Molla
                } else {
                    // Cassa o Killbrick
                    drawVoxel(o.x, oy, o.w, o.h, o.color);
                    if(o.type === 'crate') {
                         ctx.fillStyle = "rgba(0,0,0,0.15)";
                         ctx.fillRect(o.x+5, oy+5, o.w-10, o.h-10);
                         ctx.fillStyle = "rgba(255,255,255,0.2)"; // X
                         ctx.beginPath(); ctx.moveTo(o.x+5, oy+5); ctx.lineTo(o.x+o.w-5, oy+o.h-5); ctx.stroke();
                    }
                }
            });

            // Monete
            coins.forEach(c => {
                let cy = c.y + Math.sin(frames*0.15)*6;
                if(c.type === 'elephant') {
                    // Elephant Coin (Blu e Grossa)
                    ctx.fillStyle = "#54a0ff";
                    ctx.beginPath();
                    for(let i=0; i<8; i++) ctx.lineTo(c.x + 20 * Math.cos(i*Math.PI/4), cy + 20 * Math.sin(i*Math.PI/4));
                    ctx.fill();
                    ctx.fillStyle = "#fff"; ctx.font = "bold 12px Arial"; ctx.textAlign="center"; ctx.fillText("E", c.x, cy+4);
                    // Glow
                    ctx.shadowColor = "#54a0ff"; ctx.shadowBlur = 15; ctx.stroke(); ctx.shadowBlur = 0;
                } else {
                    // Normal Coin (Gialla)
                    ctx.fillStyle = "#feca57";
                    ctx.beginPath(); ctx.arc(c.x, cy, 12, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = "#ff9f43"; ctx.beginPath(); ctx.arc(c.x, cy, 8, 0, Math.PI*2); ctx.fill();
                }
            });

            // Debris
            debrisList.forEach(d => d.draw(ctx));

            // Pet
            if(user.pet !== 'none' && PETS[user.pet]) {
                let pCol = PETS[user.pet].color;
                let px = player.x - 40;
                let py = player.y - 20 + Math.sin(frames*0.08)*10;
                // Pet lerp
                pet.x += (px - pet.x) * 0.1;
                pet.y += (py - pet.y) * 0.1;
                drawVoxel(pet.x, pet.y, 16, 16, pCol);
            }

            // Player
            if(gameState === 'PLAY') {
                let cols = SKINS[user.skin] ? SKINS[user.skin].colors : SKINS['noob'].colors;
                
                // Head
                drawVoxel(player.x+4, player.y, 22, 18, cols[0]);
                // Torso
                drawVoxel(player.x, player.y+18, 30, 18, cols[1]);
                // Legs
                let lH = 12; let anim = !player.grounded ? -4 : Math.sin(frames*0.3)*4;
                drawVoxel(player.x+2, player.y+36, 12, lH+anim, cols[2]);
                drawVoxel(player.x+16, player.y+36, 12, lH-anim, cols[2]);
            }

            // Floating Texts (Renderizzati sopra a tutto)
            textsList.forEach(t => t.draw(ctx));

            ctx.restore();
            
            // HUD Update
            document.getElementById('uiScore').innerText = Math.floor(score);
            document.getElementById('uiCoins').innerText = user.coins + sessionCoins;

            if(gameState === 'PLAY') requestAnimationFrame(updateGame);
        }

        function updateGame() { update(); draw(); }

        // --- INPUT ---
        function jump() {
            if(player.grounded) { 
                player.dy = -14; 
                player.grounded = false; 
                playSound('jump');
            }
        }
        function handleInput(e) {
            if(gameState !== 'PLAY') return;
            if(e.type === 'keydown' && e.code !== 'Space' && e.code !== 'ArrowUp') return;
            e.preventDefault(); jump();
        }
        window.addEventListener('keydown', handleInput);

        // --- CORE STATE MANAGEMENT ---
        function gameOver() {
            gameState = 'GAMEOVER';
            playSound('die');
            shake = 20; draw(); // Last frame shake
            
            document.getElementById('gameOverMenu').style.display = 'flex';
            document.getElementById('finalScore').innerText = Math.floor(score);
            document.getElementById('finalCoins').innerText = sessionCoins;
            document.getElementById('jumpBtn').style.display = 'none';
            saveData();
        }

        function resetGame() {
            // Reset Vars
            obstacles=[]; coins=[]; debrisList=[]; textsList=[]; clouds=[];
            score=0; sessionCoins=0; gameSpeed=6; frames=0;
            player.y = 200; player.dy = 0;
            
            // UI
            document.getElementById('gameOverMenu').style.display = 'none';
            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById('shopMenu').style.display = 'none';
            document.getElementById('jumpBtn').style.display = 'flex';
            
            gameState = 'PLAY';
            updateGame();
        }

        // --- DATABASE & AUTH ---
        async function doLogin() {
            const u = document.getElementById('loginUser').value;
            const p = document.getElementById('loginPass').value;
            if(!sb || !u) return playGuest();

            try {
                let { data, error } = await sb.from('leo_players').select('*').eq('username', u).eq('password', p).single();
                if(error || !data) { alert("Credenziali Errate"); return; }

                // Load Data Safe
                user.id = data.id;
                user.username = data.username;
                user.coins = data.coins || 0;
                user.highscore = data.best_score || 0;
                user.inventory = (data.inventory || 'noob').split(',');
                user.skin = SKINS[data.current_skin] ? data.current_skin : 'noob';
                user.pets = (data.pets || 'none').split(',');
                user.pet = PETS[data.current_pet] ? data.current_pet : 'none';

                startGameSession();
            } catch(e) { console.error(e); playGuest(); }
        }

        async function doRegister() {
            const u = document.getElementById('loginUser').value;
            const p = document.getElementById('loginPass').value;
            if(!sb || !u || !p) { alert("Inserisci dati!"); return; }
            
            const newUser = { username: u, password: p, coins: 0, best_score: 0, inventory: 'noob', current_skin: 'noob', pets: 'none', current_pet: 'none' };
            const { error } = await sb.from('leo_players').insert([newUser]);
            if(error) alert("Username esistente"); else { alert("Registrato! Ora fai Login."); }
        }

        function playGuest() {
            user.username = "Guest_" + Math.floor(Math.random()*9999);
            startGameSession();
        }

        function startGameSession() {
            document.getElementById('uiName').innerText = user.username;
            document.getElementById('uiCoins').innerText = user.coins;
            document.getElementById('mainMenu').style.display = 'none';
            loadLeaderboard();
            resetGame();
        }

        async function saveData() {
            if(user.id === 'guest') return;
            user.coins += sessionCoins;
            if(score > user.highscore) user.highscore = Math.floor(score);
            document.getElementById('uiCoins').innerText = user.coins; // Instant UI update
            
            if(sb) {
                await sb.from('leo_players').update({ coins: user.coins, best_score: user.highscore }).eq('id', user.id);
                loadLeaderboard();
            }
        }

        async function loadLeaderboard() {
            const list = document.getElementById('leaderList');
            if(!sb) { list.innerHTML = "Offline Mode"; return; }
            const { data } = await sb.from('leo_players').select('username, best_score').order('best_score', {ascending:false}).limit(5);
            if(data) {
                list.innerHTML = data.map((p,i) => `
                    <div style="display:flex; justify-content:space-between; margin-bottom:5px; font-size:11px;">
                        <span>${i+1}. ${p.username}</span>
                        <span style="color:#00d2d3">${p.best_score}</span>
                    </div>
                `).join('');
            }
        }

        // --- SHOP SYSTEM ---
        let currentShopTab = 'skins';
        function openShop() { document.getElementById('gameOverMenu').style.display='none'; document.getElementById('shopMenu').style.display='flex'; switchShop('skins'); }
        function closeShop() { document.getElementById('shopMenu').style.display='none'; document.getElementById('gameOverMenu').style.display='flex'; }
        function switchShop(tab) { currentShopTab = tab; renderShop(); }

        function renderShop() {
            const grid = document.getElementById('shopGrid'); grid.innerHTML = '';
            document.getElementById('shopBalance').innerText = user.coins;
            
            const isSkin = currentShopTab === 'skins';
            const DB = isSkin ? SKINS : PETS;
            const owned = isSkin ? user.inventory : user.pets;
            const equipped = isSkin ? user.skin : user.pet;

            for(let key in DB) {
                let item = DB[key];
                let isOwned = owned.includes(key);
                let isEquipped = equipped === key;
                
                let div = document.createElement('div');
                div.className = `shop-item ${isOwned?'owned':''} ${isEquipped?'equipped':''}`;
                
                // Mini Preview
                let cvs = document.createElement('canvas'); cvs.width=40; cvs.height=40; cvs.className='preview-canvas';
                let cx = cvs.getContext('2d');
                if(isSkin) { cx.fillStyle=item.colors[0]; cx.fillRect(10,5,20,15); cx.fillStyle=item.colors[1]; cx.fillRect(5,20,30,15); }
                else if(item.color) { cx.fillStyle=item.color; cx.fillRect(10,10,20,20); }
                
                let btnTxt = isEquipped ? "EQUIPPED" : (isOwned ? "SELECT" : item.price);
                let btnClass = isEquipped ? "btn-green" : (isOwned ? "btn-blue" : "btn-orange");

                div.innerHTML = `<div style="font-weight:bold; font-size:12px; color:#fff">${item.name}</div>`;
                div.appendChild(cvs);
                div.innerHTML += `<button class="btn ${btnClass}" style="padding:8px; font-size:10px; margin-top:5px;" onclick="buyItem('${key}')">${btnTxt}</button>`;
                grid.appendChild(div);
            }
        }

        async function buyItem(k) {
            playSound('coin');
            const isSkin = currentShopTab === 'skins';
            const DB = isSkin ? SKINS : PETS;
            let item = DB[k];
            let inv = isSkin ? user.inventory : user.pets;

            if(inv.includes(k)) {
                if(isSkin) user.skin = k; else user.pet = k;
            } else {
                if(user.coins >= item.price) {
                    user.coins -= item.price;
                    if(isSkin) user.inventory.push(k); else user.pets.push(k);
                    if(isSkin) user.skin = k; else user.pet = k;
                } else { alert("Non hai abbastanza monete!"); return; }
            }
            renderShop();
            if(user.id !== 'guest' && sb) {
                let payload = { coins: user.coins };
                if(isSkin) { payload.inventory = user.inventory.join(','); payload.current_skin = user.skin; }
                else { payload.pets = user.pets.join(','); payload.current_pet = user.pet; }
                await sb.from('leo_players').update(payload).eq('id', user.id);
            }
        }

        // --- INIT ---
        window.onload = () => {
            // Draw initial background
            const theme = WORLDS[1];
            let grd = ctx.createLinearGradient(0,0,0,canvas.height);
            grd.addColorStop(0, theme.skyTop); grd.addColorStop(1, theme.skyBot);
            ctx.fillStyle = grd; ctx.fillRect(0,0,canvas.width,canvas.height);
            
            loadLeaderboard();
        };

    </script>
</body>
</html>
