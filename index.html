<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LEO GAME - Level 2 Update</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #222;
            font-family: 'Verdana', sans-serif;
            color: white;
            overflow: hidden;
            user-select: none;
        }

        canvas {
            border: 4px solid #fff;
            /* Sfondo iniziale Livello 1 */
            background: linear-gradient(to bottom, #333, #111);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            max-width: 100%;
            max-height: 100%;
            transition: background 1s ease; /* Transizione morbida colore */
        }

        /* --- UI DI GIOCO --- */
        #ui {
            position: absolute;
            top: 20px;
            text-align: center;
            width: 100%;
            pointer-events: none;
            z-index: 5;
        }

        h1 { margin: 0; text-shadow: 3px 3px 0 #000; font-size: 40px; color: #ffcc00; }
        
        /* --- MESSAGGIO LIVELLO 2 --- */
        #levelUpMsg {
            display: none;
            position: absolute;
            top: 40%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
            font-weight: 900;
            color: #ff00ff; /* Fucsia Neon */
            text-shadow: 0 0 20px white, 4px 4px 0 #000;
            z-index: 20;
            animation: pulse 0.5s infinite alternate;
            pointer-events: none;
        }

        @keyframes pulse {
            from { transform: translate(-50%, -50%) scale(1); }
            to { transform: translate(-50%, -50%) scale(1.2); }
        }
        
        /* --- LOGIN SCREEN & ADMIN --- */
        #loginOverlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        
        .login-box {
            background: #333;
            padding: 30px;
            border: 4px solid #ffcc00;
            border-radius: 15px;
            text-align: center;
            width: 300px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ffcc00;
            background: #111;
            color: white;
            font-size: 16px;
        }

        button.main-btn {
            width: 100%;
            padding: 10px;
            background: #ffcc00;
            color: black;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
        }
        button.main-btn:active { transform: scale(0.95); }

        .admin-section {
            margin-top: 30px;
            border-top: 1px dashed #666;
            padding-top: 10px;
        }
        .admin-section h4 { color: #aaa; font-size: 14px; margin-bottom: 5px; }

        /* --- GAME OVER --- */
        #gameOver {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 30px;
            border: 4px solid #ffcc00;
            border-radius: 15px;
            text-align: center;
            z-index: 10;
            min-width: 300px;
        }

        /* --- BOTTONE SALTO --- */
        #jumpButton {
            display: none; /* Nascosto nel login */
            position: absolute;
            bottom: 30px; right: 30px;
            width: 80px; height: 80px;
            background-color: rgba(255, 165, 0, 0.8);
            border: 4px solid white;
            border-radius: 50%;
            font-size: 14px; font-weight: bold; color: white;
            justify-content: center; align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 20;
            -webkit-tap-highlight-color: transparent;
        }
        #jumpButton:active { transform: scale(0.9); background-color: rgba(255, 69, 0, 0.9); }

        #logoutBtn {
            position: absolute;
            top: 10px; right: 10px;
            background: red; color: white;
            border: none; padding: 5px 10px;
            font-size: 12px; cursor: pointer;
            z-index: 30;
            display: none;
            border-radius: 5px;
        }

        /* Classifica */
        ul { list-style: none; padding: 0; margin: 0; text-align: left; }
        li { padding: 8px 0; border-bottom: 1px solid #444; display: flex; justify-content: space-between; font-size: 14px; }
        li span.u-name { color: #ffcc00; font-weight: bold; }
        li span.u-score { color: white; }

    </style>
</head>
<body>

    <button id="logoutBtn" onclick="logout()">LOGOUT</button>

    <div id="ui">
        <h1>LEO GAME</h1>
        <p>Giocatore: <span id="currentPlayerDisplay" style="color:#ffcc00;">---</span> | Livello: <span id="levelDisplay">1</span></p>
        <h2 id="score" style="color: white;">Punti: 0</h2>
    </div>

    <div id="levelUpMsg">LEVEL 2!</div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <div id="jumpButton">SALTA</div>

    <div id="loginOverlay">
        <div class="login-box">
            <h2 style="color: #ffcc00;">LOGIN GIOCATORE</h2>
            <input type="text" id="loginUser" placeholder="Nome Utente">
            <input type="password" id="loginPass" placeholder="Password">
            <button class="main-btn" onclick="attemptLogin()">GIOCA</button>
            <p id="loginMsg" style="color:red; font-size:12px; height:15px;"></p>

            <div class="admin-section">
                <h4>AREA ADMIN: Crea Amico</h4>
                <input type="text" id="regUser" placeholder="Nuovo Nome Amico">
                <input type="text" id="regPass" placeholder="Nuova Password">
                <button class="main-btn" style="background:#444; color:white; font-size:14px;" onclick="registerUser()">REGISTRA AMICO</button>
                <p id="regMsg" style="color:lime; font-size:12px;"></p>
            </div>
        </div>
    </div>

    <div id="gameOver">
        <h1 style="color:red">SEI MORTO!</h1>
        <p>Score: <strong id="finalScore" style="color:white">0</strong></p>
        <div style="margin-top: 15px; text-align: left;">
            <h3 style="color:#ffcc00; border-bottom:1px solid #555; padding-bottom:5px;">🏆 CLASSIFICA AMICI</h3>
            <ul id="highScoresList"></ul>
        </div>
        <button class="main-btn" onclick="resetGame()">GIOCA ANCORA</button>
    </div>

    <script>
        // --- GESTIONE UTENTI (LOCAL STORAGE) ---
        let usersDB = JSON.parse(localStorage.getItem('leoGameUsers')) || [];
        let currentUser = null;

        if(usersDB.length === 0) {
            usersDB.push({user: "leo", pass: "admin", bestScore: 0});
            localStorage.setItem('leoGameUsers', JSON.stringify(usersDB));
        }

        function registerUser() {
            const u = document.getElementById('regUser').value.trim();
            const p = document.getElementById('regPass').value.trim();
            const msg = document.getElementById('regMsg');

            if(!u || !p) { msg.style.color = 'red'; msg.innerText = "Inserisci nome e password!"; return; }
            if(usersDB.find(x => x.user === u)) { msg.style.color = 'red'; msg.innerText = "Nome già esistente!"; return; }

            usersDB.push({user: u, pass: p, bestScore: 0});
            localStorage.setItem('leoGameUsers', JSON.stringify(usersDB));
            msg.style.color = 'lime'; msg.innerText = "Amico registrato!";
            document.getElementById('regUser').value = '';
            document.getElementById('regPass').value = '';
        }

        function attemptLogin() {
            const u = document.getElementById('loginUser').value.trim();
            const p = document.getElementById('loginPass').value.trim();
            const msg = document.getElementById('loginMsg');

            const found = usersDB.find(x => x.user === u && x.pass === p);

            if(found) {
                currentUser = found;
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('currentPlayerDisplay').innerText = currentUser.user.toUpperCase();
                document.getElementById('logoutBtn').style.display = 'block';
                document.getElementById('jumpButton').style.display = 'flex';
                resetGame();
            } else {
                msg.innerText = "Utente o Password errati!";
            }
        }

        function logout() { location.reload(); }

        function saveScore(newScore) {
            if(!currentUser) return;
            if(newScore > currentUser.bestScore) {
                currentUser.bestScore = Math.floor(newScore);
                const idx = usersDB.findIndex(x => x.user === currentUser.user);
                usersDB[idx] = currentUser;
                localStorage.setItem('leoGameUsers', JSON.stringify(usersDB));
            }
            renderLeaderboard();
        }

        function renderLeaderboard() {
            const list = document.getElementById('highScoresList');
            list.innerHTML = "";
            let sortedUsers = [...usersDB].sort((a, b) => b.bestScore - a.bestScore).slice(0, 5);
            sortedUsers.forEach((u, i) => {
                let li = document.createElement('li');
                let medal = i === 0 ? "🥇" : (i === 1 ? "🥈" : (i === 2 ? "🥉" : ""));
                li.innerHTML = `<span class="u-name">${i+1}. ${u.user} ${medal}</span> <span class="u-score">${u.bestScore}</span>`;
                list.appendChild(li);
            });
        }

        // --- MOTORE DI GIOCO ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const levelEl = document.getElementById('levelDisplay');
        const jumpBtn = document.getElementById('jumpButton');
        const levelMsg = document.getElementById('levelUpMsg');

        let gameRunning = false;
        let frames = 0;
        let score = 0;
        let gameSpeed = 5;
        let obstacles = [];
        let level = 1; // Variabile livello
        const GRAVITY = 0.6;

        const player = {
            x: 50, y: 300, width: 30, height: 30, dy: 0, jumpForce: 12, grounded: false, color: '#00ff00'
        };

        class Obstacle {
            constructor() {
                this.width = 30 + Math.random() * 20;
                this.x = canvas.width;
                this.markedForDeletion = false;
                const type = Math.random();

                if (type < 0.5) { 
                    this.type = 'ground';
                    this.height = 30 + Math.random() * 30;
                    this.y = canvas.height - this.height;
                    this.color = '#ff4444'; 
                    this.dy = 0;
                } else if (type < 0.8) { 
                    this.type = 'air';
                    this.height = 30;
                    this.y = canvas.height - 110; 
                    this.color = '#4488ff'; 
                    this.dy = 0;
                } else {
                    this.type = 'moving';
                    this.height = 40;
                    this.y = canvas.height - 50;
                    this.color = '#bf44ff'; 
                    this.dy = Math.random() < 0.5 ? 2 : -2;
                    this.minY = canvas.height - 150;
                    this.maxY = canvas.height - 40;
                }
            }
            update() {
                this.x -= gameSpeed;
                if (this.type === 'moving') {
                    this.y += this.dy;
                    if (this.y < this.minY || this.y > this.maxY) this.dy *= -1;
                }
                if (this.x + this.width < 0) this.markedForDeletion = true;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.strokeStyle = "white"; ctx.lineWidth = 2; ctx.strokeRect(this.x, this.y, this.width, this.height);
            }
        }

        function jump() {
            if (player.grounded) {
                player.dy = -player.jumpForce;
                player.grounded = false;
            }
        }

        window.addEventListener('keydown', e => {
            if (gameRunning && (e.code === 'Space' || e.code === 'ArrowUp')) jump();
        });
        jumpBtn.addEventListener('touchstart', (e) => { e.preventDefault(); if(gameRunning) jump(); });
        jumpBtn.addEventListener('mousedown', (e) => { e.preventDefault(); if(gameRunning) jump(); });

        function updateGame() {
            player.dy += GRAVITY;
            player.y += player.dy;

            if (player.y + player.height > canvas.height) {
                player.y = canvas.height - player.height;
                player.dy = 0;
                player.grounded = true;
            } else {
                player.grounded = false;
            }

            // GESTIONE LIVELLO 2
            if (score >= 500 && level === 1) {
                level = 2;
                gameSpeed += 3; // Boost di velocità
                // Cambio Sfondo
                canvas.style.background = "linear-gradient(to bottom, #2c003e, #000)"; 
                levelEl.innerText = "2 (HARD)";
                levelEl.style.color = "#ff00ff";
                
                // Mostra scritta LEVEL 2
                levelMsg.style.display = "block";
                setTimeout(() => { levelMsg.style.display = "none"; }, 3000);
            }

            // Spawn Ostacoli
            // Al livello 2 spuntano più spesso
            let baseRate = level === 1 ? 50 : 35; 
            let spawnRate = Math.max(baseRate, 120 - Math.floor(gameSpeed * 5)); 
            
            if (frames % spawnRate === 0 && Math.random() > 0.1) obstacles.push(new Obstacle());

            // Gestione Ostacoli
            for (let i = 0; i < obstacles.length; i++) {
                let o = obstacles[i];
                o.update();
                o.draw();
                if (player.x < o.x + o.width && player.x + player.width > o.x && player.y < o.y + o.height && player.y + player.height > o.y) {
                    endGame();
                }
            }
            obstacles = obstacles.filter(o => !o.markedForDeletion);
        }

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // Suolo
            ctx.strokeStyle = "white"; ctx.beginPath(); ctx.moveTo(0, canvas.height); ctx.lineTo(canvas.width, canvas.height); ctx.stroke();
            // Player
            ctx.fillStyle = player.color; ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillStyle = "black"; ctx.fillRect(player.x + 20, player.y + 5, 5, 5); 
        }

        function endGame() {
            gameRunning = false;
            document.getElementById('finalScore').innerText = Math.floor(score);
            saveScore(score);
            document.getElementById('gameOver').style.display = 'block';
            jumpBtn.style.display = 'none';
        }

        function resetGame() {
            player.y = 300; player.dy = 0;
            obstacles = []; score = 0; frames = 0; gameSpeed = 5;
            level = 1; // Reset Livello
            levelEl.innerText = "1";
            levelEl.style.color = "white";
            
            // Reset sfondo
            canvas.style.background = "linear-gradient(to bottom, #333, #111)";
            levelMsg.style.display = "none";

            gameRunning = true;
            document.getElementById('gameOver').style.display = 'none';
            jumpBtn.style.display = 'flex';
            scoreEl.innerText = "Punti: 0";
            requestAnimationFrame(loop);
        }

        function loop() {
            if (!gameRunning) return;
            drawGame();
            updateGame();
            
            frames++;
            score += 0.1;
            scoreEl.innerText = "Punti: " + Math.floor(score);
            
            // Incremento graduale velocità standard (indipendente dal salto di livello)
            if (frames % 500 === 0) gameSpeed += 0.2;

            requestAnimationFrame(loop);
        }

    </script>
</body>
</html>
