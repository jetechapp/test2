<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LEO WORLD: ROBLOX EDITION</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">

    <style>
        /* --- STILI GENERALI --- */
        body {
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #74b9ff, #dfe6e9); /* Skybox */
            font-family: 'Fredoka', 'Verdana', sans-serif;
            overflow: hidden;
            user-select: none; -webkit-user-select: none; touch-action: none;
        }

        /* Il Canvas di gioco */
        canvas {
            display: block;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            max-width: 100%; max-height: 100%;
            background: transparent;
        }

        /* --- INTERFACCIA UTENTE (GUI) --- */
        #uiLayer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
            padding: 15px; box-sizing: border-box;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        .gui-top { display: flex; justify-content: space-between; align-items: flex-start; }
        
        .badge {
            background: rgba(30, 30, 30, 0.7);
            color: white; padding: 8px 14px; border-radius: 20px;
            border: 2px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
            font-weight: 600; font-size: 14px;
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 5px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }

        .leaderboard-box {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 10px; padding: 10px;
            min-width: 160px; color: #fff;
            font-size: 12px;
        }
        .leaderboard-row { display: flex; justify-content: space-between; margin-bottom: 4px; padding-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .leader-avatar { width: 12px; height: 12px; background: #ffd700; display: inline-block; margin-right: 5px; border-radius: 50%; }

        /* --- NOTIFICHE --- */
        #notifyArea {
            position: absolute; top: 20%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; width: 100%; pointer-events: none;
        }
        .pop-text {
            font-size: 20px; font-weight: bold; color: #fff;
            text-shadow: 0 2px 0 #000;
            animation: floatUp 0.8s forwards;
        }
        @keyframes floatUp { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-30px); } }

        /* --- SCHERMATE (Login, Shop, GameOver) --- */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center; z-index: 100;
        }
        
        .card {
            background: #fff; padding: 25px; border-radius: 20px;
            width: 320px; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            border: 4px solid #fff;
        }

        h1, h2 { margin: 0 0 10px 0; color: #2d3436; }
        
        input {
            width: 100%; padding: 12px; margin: 8px 0;
            border: 2px solid #dfe6e9; border-radius: 8px;
            font-family: 'Fredoka', sans-serif; outline: none; box-sizing: border-box;
        }
        input:focus { border-color: #0984e3; }

        .btn {
            width: 100%; padding: 12px; border: none; border-radius: 10px;
            font-family: 'Fredoka', sans-serif; font-weight: bold; font-size: 16px;
            cursor: pointer; margin-top: 8px; color: white;
            transition: transform 0.1s; box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }
        .btn:active { transform: translateY(4px); box-shadow: none; }
        
        .btn-green { background: #00b894; }
        .btn-blue { background: #0984e3; }
        .btn-orange { background: #e17055; }
        .btn-yellow { background: #fdcb6e; color: #d35400; }

        /* SHOP GRID */
        .shop-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
            margin-top: 10px; max-height: 220px; overflow-y: auto;
        }
        .shop-item {
            background: #f1f2f6; border-radius: 8px; padding: 8px;
            border: 2px solid transparent; cursor: pointer;
        }
        .shop-item.owned { border-color: #0984e3; }
        .shop-item.equipped { border-color: #00b894; background: #e3fff3; }
        .preview-canvas { width: 30px; height: 30px; margin: 0 auto; display: block; }

        /* PULSANTE JUMP (MOBILE) */
        #jumpBtn {
            position: absolute; bottom: 30px; right: 30px;
            width: 80px; height: 80px; background: rgba(255,255,255,0.2);
            border: 3px solid rgba(255,255,255,0.5); border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            pointer-events: auto; backdrop-filter: blur(4px);
            cursor: pointer;
        }
        #jumpBtn:active { background: rgba(255,255,255,0.4); transform: scale(0.95); }

    </style>
</head>
<body>

    <div id="uiLayer">
        <div class="gui-top">
            <div>
                <div class="badge">👤 <span id="uiName">Guest</span></div>
                <div class="badge" style="color:#fab1a0;">⬢ <span id="uiCoins">0</span></div>
            </div>
            <div class="leaderboard-box">
                <div style="border-bottom:1px solid #aaa; margin-bottom:5px;">TOP PLAYERS</div>
                <div id="leaderList">Caricamento...</div>
            </div>
        </div>
        <div id="notifyArea"></div>
        <div class="badge" style="align-self: flex-end; font-size:18px;">SCORE: <span id="uiScore">0</span></div>
    </div>

    <canvas id="gameCanvas" width="800" height="450"></canvas>
    
    <div id="jumpBtn" onmousedown="handleInput(event)" ontouchstart="handleInput(event)">
        <span style="font-size:30px; color:white;">⬆️</span>
    </div>

    <div id="mainMenu" class="overlay">
        <div class="card">
            <h1>LEO WORLD</h1>
            <p style="color:#636e72;">ROBLOX EDITION</p>
            <input type="text" id="loginUser" placeholder="Username">
            <input type="password" id="loginPass" placeholder="Password">
            <button class="btn btn-green" onclick="doLogin()">GIOCA (PLAY)</button>
            <button class="btn btn-blue" onclick="playGuest()">ENTRA COME OSPITE</button>
            <p style="font-size:11px; margin-top:10px; cursor:pointer; text-decoration:underline;" onclick="doRegister()">Non hai un account? Registrati qui</p>
        </div>
    </div>

    <div id="shopMenu" class="overlay" style="display:none;">
        <div class="card" style="width: 360px;">
            <h2>AVATAR SHOP</h2>
            <div class="badge" style="justify-content:center; background:#dfe6e9; color:#2d3436;">Saldo: ⬢ <span id="shopBalance">0</span></div>
            
            <div style="display:flex; gap:5px; margin:10px 0;">
                <button class="btn btn-blue" style="margin:0; font-size:12px;" onclick="switchShop('skins')">SKINS</button>
                <button class="btn btn-orange" style="margin:0; font-size:12px;" onclick="switchShop('pets')">PETS</button>
            </div>
            
            <div class="shop-grid" id="shopGrid"></div>
            <button class="btn btn-green" onclick="closeShop()">TORNA AL GIOCO</button>
        </div>
    </div>

    <div id="gameOverMenu" class="overlay" style="display:none;">
        <div class="card">
            <h1 style="color:#d63031; font-size: 40px;">OOF!</h1>
            <p>Sei stato eliminato.</p>
            <h2>Score: <span id="finalScore">0</span></h2>
            <p style="color:#00b894; font-weight:bold;">+<span id="finalCoins">0</span> ⬢</p>
            <button class="btn btn-green" onclick="resetGame()">RESPAWN</button>
            <button class="btn btn-yellow" onclick="openShop()">SHOP</button>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURAZIONE SUPABASE ---
        const SUPABASE_URL = 'https://jcylyutlybmbjrgghpzm.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpjeWx5dXRseWJtYmpyZ2docHptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA0NTc4NTYsImV4cCI6MjA4NjAzMzg1Nn0.X9xwESmsRJurzGODAb6V0x4QA_YODtKbATooYcC39Ew';
        
        let sb = null;
        try {
            if(typeof supabase !== 'undefined') sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch(e) { console.warn("Supabase non caricato, modalità offline."); }

        // --- 2. DATI DEL GIOCO (SKINS & PETS) ---
        const SKINS = {
            'noob': { name: 'Noob', price: 0, colors: ['#ffeaa7', '#0984e3', '#55efc4'] }, // Head, Body, Legs
            'guest': { name: 'Guest', price: 200, colors: ['#dfe6e9', '#2d3436', '#2d3436'] },
            'bacon': { name: 'Bacon', price: 500, colors: ['#fab1a0', '#74b9ff', '#636e72'] },
            'gold': { name: 'Gold', price: 2000, colors: ['#fdcb6e', '#ffeaa7', '#e17055'] },
            'void': { name: 'Void', price: 5000, colors: ['#000000', '#2d3436', '#636e72'] }
        };

        const PETS = {
            'none': { name: 'Nessuno', price: 0, color: null },
            'cube': { name: 'Cubo', price: 1000, color: '#ff7675' },
            'doge': { name: 'Doge', price: 2500, color: '#fdcb6e' },
            'ghost': { name: 'Ghost', price: 5000, color: '#dfe6e9' }
        };

        // Stato Giocatore
        let user = {
            username: 'Guest', id: 'guest',
            coins: 0, highscore: 0,
            inventory: ['noob'], skin: 'noob',
            pets: ['none'], pet: 'none'
        };

        // --- 3. MOTORE AUDIO (Sintetizzatore) ---
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const audio = AudioCtx ? new AudioCtx() : null;

        function playSfx(type) {
            if (!audio) return;
            if (audio.state === 'suspended') audio.resume().catch(()=>{});

            const osc = audio.createOscillator();
            const gain = audio.createGain();
            osc.connect(gain); gain.connect(audio.destination);
            
            const t = audio.currentTime;

            if (type === 'jump') { // Suono salto stile platform
                osc.type = 'sine'; osc.frequency.setValueAtTime(300, t); osc.frequency.linearRampToValueAtTime(500, t+0.1);
                gain.gain.setValueAtTime(0.1, t); gain.gain.linearRampToValueAtTime(0, t+0.1);
                osc.start(t); osc.stop(t+0.1);
            } 
            else if (type === 'coin') { // Suono moneta (ching)
                osc.type = 'triangle'; osc.frequency.setValueAtTime(1200, t); osc.frequency.setValueAtTime(1800, t+0.1);
                gain.gain.setValueAtTime(0.05, t); gain.gain.linearRampToValueAtTime(0, t+0.2);
                osc.start(t); osc.stop(t+0.2);
            }
            else if (type === 'die') { // Suono "OOF"
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, t); osc.frequency.exponentialRampToValueAtTime(50, t+0.3);
                gain.gain.setValueAtTime(0.2, t); gain.gain.linearRampToValueAtTime(0, t+0.3);
                osc.start(t); osc.stop(t+0.3);
            }
            else if (type === 'click') { // Click UI
                osc.type = 'square'; osc.frequency.setValueAtTime(800, t);
                gain.gain.setValueAtTime(0.05, t); gain.gain.linearRampToValueAtTime(0, t+0.05);
                osc.start(t); osc.stop(t+0.05);
            }
        }

        // --- 4. MOTORE GRAFICO (Canvas + Shading) ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Helper: Scurisce o chiarisce un colore HEX
        function shade(hex, percent) {
            if(!hex) return '#000000';
            let f=parseInt(hex.slice(1),16),t=percent<0?0:255,p=percent<0?percent*-1:percent,R=f>>16,G=f>>8&0x00FF,B=f&0x0000FF;
            return "#"+(0x1000000+(Math.round((t-R)*p)+R)*0x10000+(Math.round((t-G)*p)+G)*0x100+(Math.round((t-B)*p)+B)).toString(16).slice(1);
        }

        // Helper: Disegna un cubo stile "Plastic" di Roblox
        function drawBlock(x, y, w, h, color) {
            // Faccia principale
            ctx.fillStyle = color; ctx.fillRect(x, y, w, h);
            // Bordo superiore (Luce)
            ctx.fillStyle = shade(color, 0.2); ctx.fillRect(x, y, w, 4);
            // Bordo laterale e inferiore (Ombra)
            ctx.fillStyle = shade(color, -0.2); 
            ctx.fillRect(x+w-4, y, 4, h); 
            ctx.fillRect(x, y+h-4, w, 4);
            // "Studs" (I pallini sopra stile Lego)
            ctx.fillStyle = shade(color, 0.1);
            for(let i=4; i<w-4; i+=10) {
                ctx.beginPath(); ctx.arc(x+i+3, y+2, 2, 0, Math.PI*2); ctx.fill();
            }
        }

        function drawAvatar(x, y, colors) {
            // Testa
            drawBlock(x+5, y, 20, 16, colors[0]);
            // Corpo
            drawBlock(x, y+16, 30, 16, colors[1]);
            // Gambe (animate)
            let legH = 14; 
            let anim = Math.sin(frames*0.2)*4;
            if(!player.grounded) anim = -5; // Posa salto
            drawBlock(x+2, y+32, 12, legH+anim, colors[2]);
            drawBlock(x+16, y+32, 12, legH-anim, colors[2]);
        }

        function drawPet() {
            if(user.pet === 'none' || !PETS[user.pet]) return;
            const pColor = PETS[user.pet].color;
            // Pet che segue il player (Lerp)
            pet.tx = player.x - 40;
            pet.ty = player.y - 20 + Math.sin(frames*0.05)*10;
            pet.x += (pet.tx - pet.x) * 0.1;
            pet.y += (pet.ty - pet.y) * 0.1;

            ctx.shadowBlur = 10; ctx.shadowColor = pColor;
            drawBlock(pet.x, pet.y, 16, 16, pColor);
            ctx.shadowBlur = 0;
        }

        // --- 5. LOGICA DI GIOCO ---
        let gameActive = false;
        let frames = 0, speed = 6, score = 0, sessionCoins = 0;
        let shake = 0;
        let gravity = 0.6;
        
        let player = { x: 80, y: 200, w: 30, h: 46, dy: 0, grounded: false };
        let pet = { x: 40, y: 200, tx: 0, ty: 0 };
        
        let obstacles = [];
        let coins = [];
        let clouds = [];

        function initClouds() {
            for(let i=0; i<5; i++) clouds.push({x:Math.random()*canvas.width, y:Math.random()*150, s:Math.random()*0.5+0.5});
        }

        function update() {
            if(!gameActive) return;
            frames++; score += 0.05; speed += 0.001;

            // Fisica Player
            player.dy += gravity;
            player.y += player.dy;
            let floorY = canvas.height - 50;
            
            if (player.y + player.h > floorY) {
                player.y = floorY - player.h;
                player.dy = 0;
                player.grounded = true;
            } else {
                player.grounded = false;
            }

            // Nuvole
            if(Math.random()<0.01) clouds.push({x:canvas.width, y:Math.random()*150, s:Math.random()*0.5+0.5});
            clouds.forEach(c => c.x -= speed * 0.5);
            clouds = clouds.filter(c => c.x > -100);

            // Spawn Ostacoli
            if (frames % Math.floor(100 - speed) === 0) {
                let r = Math.random();
                if(r < 0.6) obstacles.push({x:canvas.width, w:40, h:40, type:'block', col:'#636e72'});
                else if(r < 0.8) obstacles.push({x:canvas.width, w:40, h:40, type:'kill', col:'#ff0000'});
                else obstacles.push({x:canvas.width, w:40, h:70, type:'truss', col:'#2d3436'});
            }
            obstacles.forEach(o => o.x -= speed);

            // Spawn Monete
            if (frames % 70 === 0) coins.push({x:canvas.width, y: floorY - 30 - Math.random()*80});
            coins.forEach(c => c.x -= speed);

            // Collisioni
            obstacles.forEach(o => {
                // Hitbox semplice
                if(player.x < o.x + o.w && player.x + player.w > o.x &&
                   player.y + player.h > canvas.height - 50 - o.h + 10) {
                    die();
                }
            });
            obstacles = obstacles.filter(o => o.x > -100);

            coins = coins.filter(c => {
                let hit = Math.hypot(player.x - c.x, player.y - c.y) < 40;
                if(hit) {
                    sessionCoins++; score += 100; playSfx('coin');
                    showNotify("+1 ⬢");
                }
                return !hit && c.x > -50;
            });

            // UI Update
            document.getElementById('uiScore').innerText = Math.floor(score);
            document.getElementById('uiCoins').innerText = user.coins + sessionCoins;
            if(shake > 0) shake *= 0.9;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Camera Shake
            ctx.save();
            if(shake > 0.5) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);

            // Nuvole
            ctx.fillStyle = "rgba(255,255,255,0.5)";
            clouds.forEach(c => {
                ctx.beginPath(); ctx.arc(c.x, c.y, 30*c.s, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(c.x+20*c.s, c.y-10*c.s, 40*c.s, 0, Math.PI*2); ctx.fill();
            });

            // Terreno (Verde Roblox)
            ctx.fillStyle = "#5b9e52"; ctx.fillRect(0, canvas.height-50, canvas.width, 50);
            // Dettaglio "Studs" sul terreno
            ctx.fillStyle = "#6ab060";
            for(let i=0; i<canvas.width; i+=20) ctx.fillRect((i-(frames*speed)%20), canvas.height-50, 10, 4);

            // Oggetti
            obstacles.forEach(o => {
                let oy = canvas.height - 50 - o.h;
                if(o.type === 'kill') { 
                    ctx.shadowBlur=10; ctx.shadowColor='red'; 
                    drawBlock(o.x, oy, o.w, o.h, '#ff4757'); 
                    ctx.shadowBlur=0;
                } else if(o.type === 'truss') {
                    ctx.fillStyle='#2d3436'; ctx.fillRect(o.x, oy, 10, o.h); ctx.fillRect(o.x+30, oy, 10, o.h);
                    for(let k=0; k<o.h; k+=10) ctx.fillRect(o.x, oy+k, 40, 5);
                } else {
                    drawBlock(o.x, oy, o.w, o.h, o.col);
                }
            });

            // Monete (Esagoni)
            coins.forEach(c => {
                let cy = c.y + Math.sin(frames*0.1)*5;
                ctx.fillStyle = "#55efc4"; ctx.beginPath();
                for(let i=0; i<6; i++) ctx.lineTo(c.x+12*Math.cos(i*2*Math.PI/6), cy+12*Math.sin(i*2*Math.PI/6));
                ctx.fill(); ctx.strokeStyle="#00b894"; ctx.lineWidth=2; ctx.stroke();
            });

            // Entità
            drawPet();
            if(gameActive) drawAvatar(player.x, player.y, SKINS[user.skin].colors);

            ctx.restore();
            if(gameActive) requestAnimationFrame(() => { update(); draw(); });
        }

        // --- INPUT ---
        function handleInput(e) {
            if(!gameActive) return;
            if(e.type === 'keydown' && (e.code !== 'Space' && e.code !== 'ArrowUp')) return;
            e.preventDefault();
            if(player.grounded) { player.dy = -13; player.grounded = false; playSfx('jump'); }
        }
        window.addEventListener('keydown', handleInput);

        // --- STATI DEL GIOCO ---
        function resetGame() {
            obstacles = []; coins = []; 
            score = 0; sessionCoins = 0; speed = 6; 
            player.y = 200; player.dy = 0;
            
            gameActive = true;
            document.getElementById('gameOverMenu').style.display = 'none';
            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById('shopMenu').style.display = 'none';
            document.getElementById('jumpBtn').style.display = 'flex';
            
            initClouds();
            update(); draw();
        }

        function die() {
            gameActive = false;
            shake = 20; playSfx('die');
            draw(); // Disegna l'ultimo frame con shake
            
            document.getElementById('gameOverMenu').style.display = 'flex';
            document.getElementById('jumpBtn').style.display = 'none';
            document.getElementById('finalScore').innerText = Math.floor(score);
            document.getElementById('finalCoins').innerText = sessionCoins;
            
            saveData();
        }

        function showNotify(msg) {
            const el = document.createElement('div'); el.className = 'pop-text'; el.innerText = msg;
            document.getElementById('notifyArea').appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        // --- LOGICA DATABASE & UTENTE ---
        
        async function doLogin() {
            const u = document.getElementById('loginUser').value;
            const p = document.getElementById('loginPass').value;
            if(!sb || !u) return playGuest();

            try {
                let { data, error } = await sb.from('leo_players').select('*').eq('username', u).eq('password', p).single();
                if(error || !data) { alert("Dati errati!"); return; }
                
                // PARSING SICURO (Se mancano colonne nel DB, usa i default)
                user.id = data.id;
                user.username = data.username;
                user.coins = data.coins || 0;
                user.highscore = data.best_score || 0;
                user.inventory = (data.inventory || 'noob').split(',');
                user.skin = data.current_skin || 'noob';
                // Nuove colonne
                user.pets = (data.pets || 'none').split(',');
                user.pet = data.current_pet || 'none';

                postLogin();
            } catch(e) { console.error(e); alert("Errore di rete. Gioca offline."); playGuest(); }
        }

        async function doRegister() {
            const u = document.getElementById('loginUser').value;
            const p = document.getElementById('loginPass').value;
            if(!sb || !u || !p) { alert("Inserisci User e Pass!"); return; }

            const newUser = {
                username: u, password: p, coins: 0, best_score: 0,
                inventory: 'noob', current_skin: 'noob',
                pets: 'none', current_pet: 'none'
            };

            const { error } = await sb.from('leo_players').insert([newUser]);
            if(error) { alert("Username occupato!"); } 
            else { alert("Registrato! Ora premi GIOCA."); }
        }

        function playGuest() {
            user = { username: 'Guest_'+Math.floor(Math.random()*999), id: 'guest', coins: 0, highscore: 0, inventory:['noob'], skin:'noob', pets:['none'], pet:'none' };
            postLogin();
        }

        function postLogin() {
            updateUI();
            document.getElementById('mainMenu').style.display = 'none';
            loadLeaderboard();
            resetGame();
        }

        async function saveData() {
            if(user.id === 'guest') return;
            user.coins += sessionCoins;
            if(score > user.highscore) user.highscore = Math.floor(score);
            updateUI();

            // Salva su Supabase
            if(sb) {
                await sb.from('leo_players').update({
                    coins: user.coins,
                    best_score: user.highscore
                }).eq('id', user.id);
                loadLeaderboard();
            }
        }

        async function loadLeaderboard() {
            const list = document.getElementById('leaderList');
            if(!sb) { list.innerHTML = 'Offline Mode'; return; }
            
            const { data } = await sb.from('leo_players').select('username, best_score').order('best_score', {ascending:false}).limit(5);
            if(data) {
                list.innerHTML = data.map(p => `
                    <div class="leaderboard-row">
                        <span><div class="leader-avatar"></div> ${p.username}</span>
                        <span style="color:#ffeaa7;">${p.best_score}</span>
                    </div>
                `).join('');
            }
        }

        // --- LOGICA SHOP ---
        let currentShopTab = 'skins';
        
        function openShop() {
            document.getElementById('gameOverMenu').style.display = 'none';
            document.getElementById('shopMenu').style.display = 'flex';
            switchShop('skins');
        }
        function closeShop() {
            document.getElementById('shopMenu').style.display = 'none';
            document.getElementById('gameOverMenu').style.display = 'flex';
        }
        function switchShop(tab) {
            currentShopTab = tab;
            renderShop();
        }

        function renderShop() {
            const grid = document.getElementById('shopGrid'); grid.innerHTML = '';
            document.getElementById('shopBalance').innerText = user.coins;

            const isSkin = currentShopTab === 'skins';
            const DB = isSkin ? SKINS : PETS;
            const owned = isSkin ? user.inventory : user.pets;
            const equipped = isSkin ? user.skin : user.pet;

            for(let k in DB) {
                let item = DB[k];
                let isOwned = owned.includes(k);
                let isEquipped = equipped === k;
                
                let div = document.createElement('div');
                div.className = `shop-item ${isOwned?'owned':''} ${isEquipped?'equipped':''}`;
                
                // Preview canvas
                let cvs = document.createElement('canvas'); cvs.width=30; cvs.height=30; cvs.className='preview-canvas';
                let cx = cvs.getContext('2d');
                if(isSkin) { cx.fillStyle=item.colors[0]; cx.fillRect(10,5,10,10); cx.fillStyle=item.colors[1]; cx.fillRect(5,15,20,15); } 
                else if(item.color) { cx.fillStyle=item.color; cx.fillRect(5,5,20,20); }
                
                let btnTxt = isEquipped ? "USATO" : (isOwned ? "USA" : item.price);
                let btnClass = isEquipped ? "btn-green" : (isOwned ? "btn-blue" : "btn-yellow");
                
                div.innerHTML = `<div><b>${item.name}</b></div>`;
                div.appendChild(cvs);
                div.innerHTML += `<button class="btn ${btnClass}" style="font-size:10px; padding:6px; margin-top:4px;" onclick="buyItem('${k}')">${btnTxt}</button>`;
                
                grid.appendChild(div);
            }
        }

        async function buyItem(k) {
            playSfx('click');
            const isSkin = currentShopTab === 'skins';
            const DB = isSkin ? SKINS : PETS;
            let item = DB[k];
            
            // Reference arrays
            let inv = isSkin ? user.inventory : user.pets;

            if(inv.includes(k)) {
                // Equip
                if(isSkin) user.skin = k; else user.pet = k;
            } else {
                // Buy
                if(user.coins >= item.price) {
                    user.coins -= item.price;
                    if(isSkin) user.inventory.push(k); else user.pets.push(k);
                    if(isSkin) user.skin = k; else user.pet = k;
                } else {
                    alert("Soldi insufficienti!"); return;
                }
            }
            
            updateUI();
            renderShop();

            // Sync Database
            if(user.id !== 'guest' && sb) {
                let payload = { coins: user.coins };
                if(isSkin) { payload.inventory = user.inventory.join(','); payload.current_skin = user.skin; }
                else { payload.pets = user.pets.join(','); payload.current_pet = user.pet; }
                await sb.from('leo_players').update(payload).eq('id', user.id);
            }
        }

        function updateUI() {
            document.getElementById('uiName').innerText = user.username;
            document.getElementById('uiCoins').innerText = user.coins;
        }

        // Init
        window.onload = () => {
            draw(); // Disegna sfondo iniziale
            loadLeaderboard();
        };

    </script>
</body>
</html>
